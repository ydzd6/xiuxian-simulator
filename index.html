<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe6d5">
<meta name="format-detection" content="telephone=no">
<title>修仙模拟器 · 一世一轮回</title>
<meta name="description" content="一个网页文字修仙小游戏：随机灵根、择宗拜师、秘境奇遇、道侣情缘，六个结局六种人生。">
<meta property="og:title" content="修仙模拟器 · 一世一轮回">
<meta property="og:description" content="测灵根、选宗门、闯秘境、结道侣。这一世，你能走到哪一步？">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efe6d5'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%239c2b23' font-family='serif'%3E仙%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
 * 修仙模拟器 · 水墨样式
 * ========================================================================== */

:root {
  --ink: #1d1a16;
  --ink-2: #453d33;
  --ink-3: #6d6255;
  --paper: #efe6d5;
  --paper-2: #f7f1e4;
  --paper-3: #e3d8c3;
  --cinnabar: #9c2b23;
  --jade: #4e6b52;
  --gold: #a67c22;
  --line: rgba(29, 26, 22, 0.22);
  --line-soft: rgba(29, 26, 22, 0.1);
  --shadow: 0 2px 10px rgba(60, 48, 32, 0.12), 0 10px 30px rgba(60, 48, 32, 0.07);
  --kai: "STKaiti", "Kaiti SC", "KaiTi", "STSong", "Songti SC", "SimSun", "Noto Serif SC", serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: var(--kai);
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse at 18% 8%, rgba(255, 255, 255, 0.75), transparent 55%),
    radial-gradient(ellipse at 82% 92%, rgba(180, 160, 130, 0.28), transparent 60%),
    radial-gradient(ellipse at 90% 12%, rgba(156, 43, 35, 0.05), transparent 45%),
    repeating-linear-gradient(102deg, rgba(120, 100, 70, 0.035) 0 1px, transparent 1px 4px);
  background-attachment: fixed;
  font-size: 16px;
  line-height: 1.85;
  -webkit-text-size-adjust: 100%;
}

/* 飘落的墨点 */
#inkfall { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#inkfall i {
  position: absolute;
  top: -8vh;
  display: block;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(40, 34, 28, 0.5), rgba(40, 34, 28, 0.08) 70%, transparent);
  animation: fall linear infinite;
  opacity: 0.5;
}
@keyframes fall {
  0%   { transform: translate3d(0, -10vh, 0) scale(1); opacity: 0; }
  12%  { opacity: 0.55; }
  100% { transform: translate3d(6vw, 112vh, 0) scale(0.7); opacity: 0; }
}

#app {
  position: relative;
  z-index: 1;
  max-width: 660px;
  margin: 0 auto;
  padding: 18px 16px 40px;
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}

.screen { display: none; animation: fadeUp 0.45s ease both; }
.screen.on { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* ---------------------------------------------------------------- 通用 --- */

.brush-title {
  font-size: 34px;
  letter-spacing: 0.22em;
  text-align: center;
  margin: 0;
  font-weight: 400;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 3px 12px rgba(60, 48, 32, 0.16);
}

.sub { text-align: center; color: var(--ink-3); font-size: 14px; letter-spacing: 0.12em; margin: 6px 0 0; }

.card {
  position: relative;
  background: linear-gradient(180deg, var(--paper-2), var(--paper));
  border: 1px solid var(--line);
  border-radius: 3px;
  box-shadow: var(--shadow);
  padding: 18px 18px 16px;
  margin: 16px 0;
}
.card::before, .card::after {
  content: "";
  position: absolute;
  left: 6px; right: 6px;
  height: 1px;
  background: var(--line-soft);
}
.card::before { top: 5px; }
.card::after { bottom: 5px; }

.hr-ink {
  height: 1px;
  border: 0;
  margin: 14px 0;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}

/* -------------------------------------------------------------- 标题页 --- */

.scroll {
  margin-top: 6vh;
  text-align: center;
  padding: 10px 8px 24px;
}
.scroll .seal-top {
  display: inline-block;
  font-size: 12px;
  letter-spacing: 0.4em;
  color: var(--cinnabar);
  border: 1px solid rgba(156, 43, 35, 0.45);
  padding: 2px 8px 2px 12px;
  margin-bottom: 14px;
  border-radius: 2px;
}
.scroll .brush-title { font-size: 40px; letter-spacing: 0.18em; }
.scroll .sub { margin-top: 12px; line-height: 2; }

.field { margin: 22px auto 0; max-width: 340px; text-align: left; }
.field label { display: block; font-size: 13px; color: var(--ink-3); letter-spacing: 0.2em; margin-bottom: 6px; }

input[type="text"] {
  width: 100%;
  font-family: var(--kai);
  font-size: 20px;
  letter-spacing: 0.12em;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--line);
  padding: 8px 4px;
  outline: none;
}
input[type="text"]:focus { border-bottom-color: var(--cinnabar); }

.gender-row { display: flex; gap: 10px; margin-top: 16px; }
.gender-row .gbtn {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.35);
  border-radius: 3px;
  cursor: pointer;
  font-size: 17px;
  letter-spacing: 0.2em;
  transition: all 0.18s;
}
.gender-row .gbtn.sel { background: var(--ink); color: var(--paper-2); border-color: var(--ink); }

/* ---------------------------------------------------------------- 按钮 --- */

.btn {
  display: block;
  width: 100%;
  text-align: left;
  font-family: var(--kai);
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.42);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink-3);
  border-radius: 3px;
  padding: 12px 14px;
  margin: 9px 0;
  cursor: pointer;
  transition: transform 0.14s, background 0.18s, border-color 0.18s, color 0.18s;
}
.btn:hover { background: var(--ink); color: var(--paper-2); border-color: var(--ink); border-left-color: var(--cinnabar); }
.btn:active { transform: scale(0.985); }
.btn.center { text-align: center; letter-spacing: 0.2em; }
.btn.primary {
  background: var(--ink);
  color: var(--paper-2);
  border-color: var(--ink);
  border-left-color: var(--cinnabar);
  text-align: center;
  letter-spacing: 0.24em;
  font-size: 18px;
}
.btn.primary:hover { background: #322b23; }
.btn.ghost { background: transparent; border-left-color: transparent; color: var(--ink-3); text-align: center; font-size: 14px; }
.btn.ghost:hover { background: rgba(29, 26, 22, 0.06); color: var(--ink); }
.btn.gold { border-left-color: var(--gold); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn { margin: 0; }

/* ------------------------------------------------------------ 属性面板 --- */

.hud { margin-top: 4px; }
.hud-top {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
}
.hud-name { font-size: 19px; letter-spacing: 0.1em; }
.hud-realm {
  font-size: 13px;
  color: var(--paper-2);
  background: var(--ink);
  padding: 1px 9px;
  border-radius: 2px;
  letter-spacing: 0.14em;
}
.hud-age { margin-left: auto; font-size: 13px; color: var(--ink-3); letter-spacing: 0.08em; }

.cultbar { height: 5px; background: rgba(29, 26, 22, 0.1); margin-top: 9px; border-radius: 3px; overflow: hidden; }
.cultbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--jade), var(--gold)); transition: width 0.5s ease; }

.chips { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
.chip {
  font-size: 12.5px;
  color: var(--ink-2);
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--line-soft);
  border-radius: 2px;
  padding: 2px 7px;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.chip b { font-weight: 400; color: var(--ink-3); margin-right: 3px; }
.chip.warn { color: var(--cinnabar); border-color: rgba(156, 43, 35, 0.35); }
.chip.up { color: var(--jade); }
.chip.down { color: var(--cinnabar); }

.toggle-hud {
  font-size: 12px;
  color: var(--ink-3);
  text-align: right;
  margin-top: 6px;
  cursor: pointer;
  letter-spacing: 0.1em;
  user-select: none;
}

/* ------------------------------------------------------------ 事件正文 --- */

.event-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.event-head .t { font-size: 21px; letter-spacing: 0.14em; }
.event-head .turn { margin-left: auto; font-size: 12px; color: var(--ink-3); letter-spacing: 0.1em; }
.event-head .t::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--cinnabar);
  margin-right: 9px;
  vertical-align: middle;
  transform: rotate(45deg);
}

.event-text { font-size: 16.5px; line-height: 2.05; color: var(--ink); text-indent: 2em; }
.event-text .cursor { display: inline-block; width: 0.6em; color: var(--cinnabar); animation: blink 0.9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.choices { margin-top: 6px; }
.choices .hint { font-size: 12px; color: var(--ink-3); text-align: center; letter-spacing: 0.16em; margin: 10px 0 4px; }

.result {
  border-left: 3px solid var(--ink-3);
  background: rgba(255, 255, 255, 0.45);
  padding: 12px 14px;
  font-size: 16px;
  line-height: 2;
  margin-top: 4px;
  animation: fadeUp 0.4s ease both;
}
.result .rtag {
  display: inline-block;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--paper-2);
  background: var(--ink-3);
  padding: 1px 8px;
  border-radius: 2px;
  margin-bottom: 8px;
}
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* -------------------------------------------------------------- 抽灵根 --- */

.roll-box { text-align: center; padding: 8px 0 4px; }
.roll-line { font-size: 15px; color: var(--ink-3); letter-spacing: 0.16em; }
.roll-big {
  font-size: 30px;
  letter-spacing: 0.16em;
  margin: 8px 0 2px;
  animation: stamp 0.5s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp {
  0% { transform: scale(2.2); opacity: 0; }
  60% { transform: scale(0.94); opacity: 1; }
  100% { transform: scale(1); }
}
.roll-desc { font-size: 14px; color: var(--ink-2); line-height: 1.9; margin-top: 8px; }

/* -------------------------------------------------------------- 结算页 --- */

.ending-wrap { text-align: center; padding-top: 10px; }
.ending-tier { font-size: 13px; letter-spacing: 0.5em; color: var(--ink-3); }
.ending-name { font-size: 42px; letter-spacing: 0.16em; margin: 10px 0 4px; }
.ending-title { font-size: 17px; letter-spacing: 0.24em; color: var(--ink-2); }
.seal {
  display: inline-block;
  width: 74px; height: 74px;
  line-height: 70px;
  font-size: 40px;
  color: var(--cinnabar);
  border: 3px double var(--cinnabar);
  border-radius: 4px;
  margin: 14px auto 6px;
  transform: rotate(-6deg);
  animation: stamp 0.6s cubic-bezier(.2,1.6,.4,1) both;
}
.ending-verdict { font-size: 15px; color: var(--ink-2); letter-spacing: 0.1em; margin-top: 6px; }

.chronicle { max-height: 300px; overflow-y: auto; text-align: left; font-size: 14px; line-height: 1.95; }
.chronicle .row { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line-soft); }
.chronicle .age { flex: 0 0 62px; color: var(--ink-3); font-size: 12.5px; padding-top: 3px; }
.chronicle .txt { flex: 1; }
.chronicle .txt em { font-style: normal; color: var(--ink-3); font-size: 13px; }

.share-preview { text-align: center; margin-top: 12px; }
.share-preview img { width: 100%; max-width: 340px; border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 2px; }

/* ---------------------------------------------------------------- 图鉴 --- */

.gal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.gal-item {
  border: 1px solid var(--line);
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.4);
  padding: 10px 6px;
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
}
.gal-item.unlock { color: var(--ink); background: linear-gradient(180deg, var(--paper-2), var(--paper)); box-shadow: var(--shadow); }
.gal-item .g-name { font-size: 14.5px; letter-spacing: 0.1em; display: block; margin-top: 4px; }
.gal-item .g-seal { font-size: 20px; color: var(--cinnabar); }

.ach-list { display: grid; gap: 8px; margin-top: 10px; }
.ach {
  display: flex;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.3);
  font-size: 13.5px;
  color: var(--ink-3);
}
.ach.on { color: var(--ink); background: rgba(255, 255, 255, 0.62); border-color: var(--line); }
.ach .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(29,26,22,0.18); flex: 0 0 auto; }
.ach.on .dot { background: var(--cinnabar); }
.ach .d { font-size: 12px; color: var(--ink-3); }

.footnote { text-align: center; font-size: 12px; color: var(--ink-3); letter-spacing: 0.1em; margin-top: 22px; line-height: 2; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 12%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--paper-2);
  font-family: var(--kai);
  font-size: 15px;
  letter-spacing: 0.14em;
  padding: 9px 20px;
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 99;
  max-width: 84vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 400px) {
  .brush-title { font-size: 32px; }
  .scroll .brush-title { font-size: 33px; }
  .ending-name { font-size: 34px; }
  .event-text { font-size: 16px; }
  #app { padding-left: 13px; padding-right: 13px; }
}

</style>
</head>
<body>
<div id="inkfall"></div>
<div id="app">

  <!-- ================= 标题页 ================= -->
  <section id="screen-title" class="screen">
    <div class="scroll">
      <span class="seal-top">網 頁 文 字 遊 戲</span>
      <h1 class="brush-title">修仙模拟器</h1>
      <p class="sub">一世一轮回<br>测灵根 · 择宗门 · 闯秘境 · 结道侣</p>

      <div class="field">
        <label>道 号</label>
        <input id="name-input" type="text" maxlength="8" placeholder="输入你的名字" autocomplete="off">
      </div>

      <div class="field" style="margin-top:14px">
        <label>性 别</label>
        <div class="gender-row">
          <div class="gbtn sel" id="btn-male">男</div>
          <div class="gbtn" id="btn-female">女</div>
        </div>
      </div>

      <div style="margin-top:26px">
        <button class="btn primary" id="btn-start">踏 入 仙 途</button>
        <button class="btn ghost" id="btn-continue" style="display:none">继续上一世</button>
        <div id="continue-info" style="display:none;text-align:center;font-size:12.5px;color:#6d6255;letter-spacing:.1em"></div>
        <button class="btn ghost" id="btn-gallery" style="display:none">结局图鉴与成就</button>
      </div>

      <p class="footnote" id="stat-line"></p>
    </div>
  </section>

  <!-- ================= 抽灵根 ================= -->
  <section id="screen-roll" class="screen">
    <div class="card">
      <div class="roll-box">
        <div class="roll-line">— 测 灵 根 —</div>
        <div class="roll-big" id="roll-root"></div>
        <div class="roll-desc" id="roll-root-desc"></div>
        <hr class="hr-ink">
        <div class="roll-line">— 出 身 —</div>
        <div class="roll-big" id="roll-origin" style="font-size:24px"></div>
        <div class="roll-desc" id="roll-origin-desc"></div>
        <hr class="hr-ink">
        <div class="roll-desc" id="roll-age"></div>
      </div>
    </div>
    <div style="text-align:center;font-size:12.5px;color:#6d6255;letter-spacing:.14em" id="reroll-note"></div>
    <div style="margin-top:16px">
      <button class="btn gold" id="btn-reroll">重 开 一 世</button>
      <button class="btn primary" id="btn-enter">就 此 落 定</button>
    </div>
  </section>

  <!-- ================= 游戏主界面 ================= -->
  <section id="screen-game" class="screen">
    <div class="card hud" id="hud"></div>
    <div class="card">
      <div class="event-head">
        <span class="t" id="event-title"></span>
        <span class="turn" id="event-turn"></span>
      </div>
      <div class="event-text" id="event-text"></div>
    </div>
    <div id="event-choices">
      <div class="choices" id="choices"></div>
    </div>
    <button class="btn gold" id="btn-breakthrough" style="display:none"></button>
    <div id="result-box" class="result" style="display:none"></div>
    <div style="text-align:center;margin-top:10px">
      <button class="btn ghost" id="btn-chron-game">生平年表</button>
    </div>
  </section>

  <!-- ================= 结算 ================= -->
  <section id="screen-ending" class="screen">
    <div class="card ending-wrap">
      <div class="ending-tier" id="ending-tier"></div>
      <div class="ending-name" id="ending-name"></div>
      <div class="seal" id="ending-seal"></div>
      <div class="ending-title" id="ending-title"></div>
      <div class="ending-verdict" id="ending-verdict"></div>
    </div>
    <div class="card" id="ending-stats"></div>
    <div class="card">
      <div style="font-size:13px;letter-spacing:.24em;color:#6d6255;text-align:center;margin-bottom:8px">生 平 年 表</div>
      <div class="chronicle" id="ending-chron"></div>
    </div>
    <button class="btn primary" id="btn-share">生 成 战 绩 图</button>
    <button class="btn" id="btn-again">再 修 一 世</button>
    <button class="btn ghost" id="btn-gal2">结局图鉴与成就</button>
    <button class="btn ghost" id="btn-chron2">看完整生平</button>
  </section>

  <!-- ================= 生平 ================= -->
  <section id="screen-chron" class="screen">
    <div class="card">
      <div style="font-size:13px;letter-spacing:.24em;color:#6d6255;text-align:center;margin-bottom:8px">生 平 年 表</div>
      <div class="chronicle" id="chron-body" style="max-height:64vh"></div>
    </div>
    <button class="btn ghost" id="btn-chron-back">返 回</button>
  </section>

  <!-- ================= 图鉴 ================= -->
  <section id="screen-gallery" class="screen">
    <h2 class="brush-title" style="font-size:26px;letter-spacing:.3em">结 局 图 鉴</h2>
    <div class="gal-grid" id="gal-grid"></div>
    <div class="card" style="margin-top:16px">
      <div style="font-size:13px;letter-spacing:.24em;color:#6d6255;text-align:center;margin-bottom:6px">成 就</div>
      <div class="ach-list" id="ach-list"></div>
    </div>
    <p class="footnote" id="gal-stat"></p>
    <button class="btn ghost" id="btn-gal-back">返 回</button>
  </section>

  <!-- ================= 分享图 ================= -->
  <section id="screen-share" class="screen">
    <h2 class="brush-title" style="font-size:24px;letter-spacing:.3em">战 绩 图</h2>
    <p class="sub">长按图片保存，发到群里或朋友圈</p>
    <div style="margin-top:16px">
      <button class="btn primary" id="btn-share-make">生 成 图 片</button>
    </div>
    <div class="share-preview" id="share-result" style="display:none">
      <img id="share-img" alt="战绩图">
      <a class="btn center" id="btn-download" download="xiuxian.png" style="display:block;margin-top:12px;text-decoration:none">下 载 图 片</a>
    </div>
    <button class="btn ghost" id="btn-share-back">返 回</button>
  </section>

</div>
<div class="toast" id="toast"></div>

<script id="game-data" type="application/json">{"events":[{"id":"d01_01","title":"槐下怪梦","weight":12,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"你梦见一级一级的天梯，走到第九级脚下一空，低头看，台阶全是白骨垒的。醒来娘说你喊了半宿。","choices":[{"text":"把梦原原本本讲给爹娘听","effect":{"cult":12,"mind":4,"luck":-3,"flagAdd":["槐下怪梦"],"log":"槐下怪梦，说与爹娘"},"result":"娘听完脸色变了，爹沉默半天，带你去老槐树下烧了三张纸。他说梦是反的，叫你以后别往东山那边跑。说这话时他蹲下来，看了你很久。"},{"text":"瞒下来，深夜独自去槐树下","effect":{"cult":22,"luck":5,"mind":-3,"flagAdd":["槐下怪梦"],"log":"独赴老槐树下"},"result":"你对着树磕了三个头，什么也没求。回家路上觉得背后有人跟着你走了一段，回头看只有月光。那夜之后你睡觉踏实了，像是把什么东西留在了树底下。"}]},{"id":"d01_02","title":"白狐衔药","weight":11,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"背阴坡采药，你手脚并用往上爬。伸手先摸到血，温的，结了壳。白狐被兽夹咬住前爪，不叫不挣，只抬眼看你。","choices":[{"text":"掰开兽夹放它走","effect":{"cult":18,"mind":8,"luck":4,"wealth":-20,"rel":{"白狐":10},"flagAdd":["放生白狐"],"log":"背阴坡放走白狐"},"result":"铁夹锈得厉害，你掰了很久，虎口裂开一道口子。白狐没跑，围着你转了半圈才进林子。那天你没采到药，回家挨了一顿骂，晚上伤口结痂结得很快。"},{"text":"连夹子一起扛下山换钱","effect":{"wealth":40,"luck":-6,"mind":-5,"log":"卖狐换钱"},"result":"皮货商人给了四十文，说这皮子干净，没伤着几处。你揣着钱回家，一路上那狐狸没再叫过一声，你也就没想起它。钱花得很快，两天就没了。"},{"text":"记下位置，明天带盐和布来","effect":{"cult":10,"mind":5,"luck":3,"flagAdd":["放生白狐"],"log":"记下白狐位置"},"result":"第二天你带了盐水和干净布条上山，兽夹空了，地上有拖行的痕迹，一路往林子深处去。你把布条挂在树杈上才下山。此后你在山里走，总觉得有东西远远跟着你。"}]},{"id":"d01_03","title":"镇上测灵根","weight":12,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"镇上来了仙门执事，青布衫，腰挂玉牌。轮到你，他指尖点在你眉心，只在名册上写了一笔。眉心凉了一下午。","choices":[{"text":"追上去问他那一笔写了什么","effect":{"cult":15,"mind":6,"luck":3,"flagAdd":["名册一笔"],"log":"名册上有你一笔"},"result":"他停下脚步，把名册合上按在胸口，说写着你在册上会得点东西，但不会太多。他又看你一眼，说这样反而好，得太多的人，命都不长。"},{"text":"请他去家里喝碗热粥","effect":{"wealth":-30,"cult":25,"mind":5,"rel":{"玄虚道人":5},"log":"请执事喝粥"},"result":"他真来了，坐在你家门槛上把粥喝得干干净净。临走前他拿筷子蘸着粥汤在桌上画了一道弯线，说照这个挪气，不容易死。娘擦桌子时把线擦了，你记在了心里。"},{"text":"转身把位置让给后面的孩子","effect":{"luck":8,"mind":4,"fame":6,"log":"让出测灵根位置"},"result":"后面那个孩子是他娘背来的，腿不好。执事看了你一眼，什么也没说，把名册又翻开添了一笔。那天下午你回家割了一整捆草，天黑前就割完了。"}]},{"id":"d01_04","title":"破庙乞儿","weight":11,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"你抱着半块干粮钻进破庙，香案下缩着个乞儿，破碗是空的。他喉咙动了一下，却没伸手。你站在门口。","choices":[{"text":"把干粮掰一半递过去","effect":{"mind":8,"cult":15,"wealth":-15,"rel":{"乞儿":10},"flagAdd":["破庙乞儿"],"log":"破庙分食"},"result":"他吃得很快，吃完把碗底舔得发亮，然后认真地看你，说这个他会记着。雨停时他先走，走前在供桌上用指甲划了一道痕，说以后你看见这道痕，就有人欠你一顿饭。"},{"text":"脱下旧外衣给他，自己冒雨走","effect":{"mind":6,"luck":4,"cult":8,"log":"破庙赠衣"},"result":"他接衣服的样子很别扭，像从来没接过别人的东西。你冒雨跑回家，烧了一夜，第二天照样下地。那片旧衣后来出现在你家的柴垛上，叠得整整齐齐。"},{"text":"把干粮收进怀里，出庙去","effect":{"wealth":5,"mind":-6,"log":"破庙未施援手"},"result":"你走到庙门口回头看了一眼，他还缩在原处，没有看你，也没有再动。那一眼你记了很久，久到后来很多次你都想，当时要是掰一半会怎么样。"}]},{"id":"d01_05","title":"界石南移","weight":11,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"王大奎把界石往南挪了三尺，你家河边那块好田就归了他。爹握着镰刀站在田埂上，青筋鼓了半天，最后还是放下了。","choices":[{"text":"在祠堂前当着族老的面理论","effect":{"fame":12,"mind":5,"wealth":60,"cult":10,"log":"祠堂前争田"},"result":"族老们不好装作没看见。王大奎被驳了面子，田是挪回来了，但他临走时指着你家的门框说了句话。此后你走夜路，偶尔会觉得身后有脚步声，不紧不慢地跟着。"},{"text":"先认下，转头去镇上学门手艺","effect":{"wealth":80,"cult":20,"luck":5,"fame":-8,"log":"弃田学手艺"},"result":"铁匠铺的师父收了你，管饭不给工钱。你抡了三个月锤，胳膊粗了一圈。田的事家里再没人提，爹蹲在门口抽了一夜旱烟，第二天照常下地。"},{"text":"夜里独自去把界石挪回来","effect":{"cult":25,"luck":6,"mind":12,"fame":-5,"log":"夜挪界石"},"result":"石头比你想的重，挪完你在田埂上坐了半天，手心磨掉一层皮。半个月后听说王大奎家的耕牛死了，村里人都说是报应。你没说话，那阵子你睡得格外好。"}]},{"id":"d01_06","title":"半面铜镜","weight":10,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"你在河里摸鱼，捞上来半面铜镜，断口很利。随手一照，镜里那张脸比你老十来岁，眉眼却还是你的，正冲你笑。","choices":[{"text":"擦干净，用布包好收起来","effect":{"cult":30,"luck":6,"mind":-5,"flagAdd":["半面铜镜"],"log":"拾得半面铜镜"},"result":"你把它藏在房梁上。夜里翻身时，总觉得梁上有极轻的一声响，像金属碰了一下木头。过了些日子你就不在意了，它一直在那个位置，直到很多年以后。"},{"text":" 扔回河里，就当没捞着","effect":{"cult":10,"luck":-5,"mind":4,"log":"掷镜还河"},"result":"铜镜落水时没溅起多少水花，反而在水面上浮了一下才沉下去。你盯着那片水看了很久。回家路上你一直在想那半个字，想到最后连它的样子都记不清了。"},{"text":"拿去镇上的铜匠铺子估个价","effect":{"wealth":50,"cult":20,"luck":-8,"fame":4,"log":"铜镜换钱"},"result":"老铜匠把手里的活计停了，翻来覆去看了半炷香，最后问你是在哪儿捡的。他给了你五十文，收了镜子，还多送你一句：这种东西，原先不该用铜来做。"}]},{"id":"d01_07","title":"墙外听书","weight":11,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"私塾墙根有块青石，被人踩出包浆。先生讲天地有气，一字一字穿过窗纸，全落进你耳朵。你贴着墙根，没敢再往前。","choices":[{"text":"站到散学，把听到的全背下来","effect":{"cult":25,"mind":8,"flagAdd":["墙外听讲"],"log":"墙外偷听讲书"},"result":"先生讲了整整一下午，你回家路上一边走一边默，到家时能把开头那段一字不错地背出来。你不识字，但那几句句子像钉子一样钉在脑子里，拔不出来。"},{"text":"翻墙进去，就坐在最后面","effect":{"cult":40,"mind":10,"fame":6,"wealth":-15,"flagAdd":["先生赠字"],"log":"翻墙入学"},"result":"先生把你从地上拎起来，戒尺举得老高，最后落在桌角上。他只说了三个字：坐后面。你识的字都是他教的，他从来没认过你这个学生，也从来没赶过你。"},{"text":"听半段就回家干活","effect":{"cult":12,"luck":5,"wealth":20,"mind":-3,"log":"听半段归家"},"result":"你回去时正好赶上收谷上场，木锨递过来，爹没骂你。那年收成不错，谷子干得快，堆在场上金灿灿一片。你干活的时候嘴里一直含着一句话，含到天黑也没含完。后来你把它忘了，忘得很干净。"}]},{"id":"d01_08","title":"母病药钱","weight":12,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"娘咯血咳了整宿，枕巾上洇开一小片暗红。郎中说药钱要三两，递方子时叹了口气。你在炕边站了整宿。","choices":[{"text":"去镇上药铺赊账按手印","effect":{"cult":20,"wealth":-150,"mind":-10,"flagAdd":["母病未愈"],"log":"为母赊药钱"},"result":"利钱三分。债主把纸按在桌上，你按了手印。药抓回来了，娘喝了能坐起来。那个三分利像块石头压在你家梁上，压了整整一年，谁都不提，谁都记得。"},{"text":"进山采那味险药","effect":{"cult":60,"mind":15,"flagAdd":["母亲痊愈"],"log":"进山采药救母"},"result":"书里说那味药长在背阴的石缝下。你在山里转了两天，摸到那道石缝时手已经冻得不听使唤。药是真的。娘喝了三剂就能下地，她问你在哪儿采的，你没说。"},{"text":"把祖母的玉佩拿去典当","effect":{"cult":15,"wealth":120,"luck":-10,"mind":-6,"flagAdd":["母亲痊愈"],"log":"典当祖传玉佩"},"result":"当铺老板压价压得极狠，玉是好玉，他只给了一半的价。药抓回来了，娘的病好了。玉赎不回来。过年时娘问起那块玉，你说收起来了，她点点头，没再问。"}]},{"id":"d01_09","title":"山贼夜袭","weight":10,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"火把从村口连到河边，像谁把火星撒了一路。狗叫得不成样子，爹把你往祠堂推。你跑出两步，才想起娘还在屋里。","choices":[{"text":"留下和大家一起敲锣守门","effect":{"fame":20,"mind":8,"cult":30,"flagAdd":["守村之夜"],"log":"守村抗贼"},"result":"铜盆敲破了，手也震麻了，天亮时贼退了，村口那棵老槐树烧掉了一半。族老拍着你的肩说了句好样的。三天后有人在山上看见一伙人扎营，离得不远。"},{"text":"冲回屋里把娘背出来","effect":{"cult":25,"mind":15,"luck":8,"fame":-5,"log":"火中背母"},"result":"你把她从柜子底下拽出来的时候房梁正好塌下来半根，砸在你身后的地上。娘在你背上一直说没事没事。祠堂那边有人回头看见了，也有人说你临阵乱跑。"},{"text":"顺着后山路先躲进林子","effect":{"luck":-8,"mind":-15,"cult":10,"log":"夜奔后山"},"result":"你在山路上跑到天亮，鞋跑丢了一只，回头看村子还在冒烟。天亮后你回去，房子还在，人也在，只是爹一整天没跟你说话。你自己也没敢先开口。"}]},{"id":"d01_10","title":"月下剑光","weight":12,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"你在院里纳凉，忽见东山一道白光横过天去，细得像线，收得极快。蛙声全停了一瞬，你的耳朵嗡嗡响到三更。","choices":[{"text":"顺着剑光的方向往山里走","effect":{"cult":30,"mind":10,"luck":5,"wealth":-10,"flagAdd":["东山剑光"],"log":"夜追东山剑光"},"result":"你追到天快亮，一直追到东山的山腰，什么也没看见，鞋磨破了一双。回来时在山道边捡到一片叶子，叶面上有一条笔直的口子，像是被什么割开的。"},{"text":"冲着东山深深行礼","effect":{"mind":12,"cult":15,"fame":5,"log":"望东山行礼"},"result":"你朝那个方向磕了三个头，膝盖磕在石子上磕破了皮。你不知道自己在拜什么，但心里踏实。那之后你每天睡前都会往东山那边看一眼，看了很多年。"},{"text":"在村口石头上刻下剑痕","effect":{"cult":22,"mind":5,"luck":-3,"flagAdd":["石上剑痕"],"log":"石上摹刻剑痕"},"result":"你手抖，刻得歪歪扭扭，跟那道光半分都不像。后来你每天路过都照着那几道刻痕比划一遍。有外乡人路过看了一眼，笑了一声，问你这是跟谁学的。"}]},{"id":"d01_11","title":"道人借宿","weight":11,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"老道士叩门借宿，一身味比雨前的河还重，只那双眼睛亮得不像这岁数。天亮时他说：你这缸水放错了地方。","choices":[{"text":"追问他是不是认得你","effect":{"cult":30,"mind":8,"rel":{"玄虚道人":15},"flagAdd":["欠你一饭"],"log":"老道借宿留话"},"result":"他眯起眼睛笑起来，说不上认得，只是欠你一饭。你正想问哪一顿，他已经走出院门。后来你翻遍记忆也想不出自己什么时候给过他饭，但这句话你记了一辈子。"},{"text":"照他说的把水缸挪到南墙根","effect":{"luck":10,"mind":6,"cult":8,"rel":{"玄虚道人":5},"log":"依言挪动水缸"},"result":"水缸沉，你和爹挪了半日。那年秋天你家的井水喝起来确实比别家甜些，邻家来讨水的人多了。爹说是缸的位置好，娘说是老道士有本事。你想的跟他们都不太一样。"},{"text":"天亮送他出村，一直送到山口","effect":{"cult":18,"mind":10,"fame":5,"luck":4,"flagAdd":["送道出村"],"log":"送老道至山口"},"result":"他一路没说话，到了山口才回头，说别送了。他从袖子里摸出半块干饼塞给你，饼硬得能砸核桃。你站在原地看着他走远，那半块饼你啃了三天。"}]},{"id":"d01_12","title":"集市糖人","weight":12,"once":true,"cond":{"realmMax":1,"turnMax":12},"text":"腊月集市，卖糖人的老汉支着草把子，插着糖做的走兽，太阳一照透亮。你摸出铜板数了两遍，站在摊前看到脚冻麻。","choices":[{"text":"请他照着你的样子捏一个","effect":{"wealth":-20,"mind":8,"luck":5,"flagAdd":["糖人自画像"],"log":"买糖人照己身"},"result":"他捏出来的那个东西丑得离谱，你舍不得吃，插在床头看了三天，最后化成一摊糖水。老汉收钱时说了句：捏得不像，你别往心里去，人这一辈子也不像自己。"},{"text":"问他嘟囔的那句是什么意思","effect":{"cult":20,"mind":5,"luck":6,"wealth":-10,"flagAdd":["糖人暗语"],"log":"问明糖人暗语"},"result":"刚才他吹糖时嘟囔了一句，里头有个词你在私塾墙外听过，当时没记住。老汉手上不停，说小孩子别学这个。他还是说了一遍，说完自己乐了，多给了你一支小的。"},{"text":"只买最便宜的一串山楂","effect":{"wealth":-10,"mind":5,"cult":5,"log":"集市买糖串"},"result":"你把三文钱递过去，挑了一串最红的，一路咬到村口，牙酸了一整个下午。晚饭时你吃不下东西，娘以为你病了，摸了你半天额头，你也没敢说是糖吃多了。"}]},{"id":"d01_13","title":"镇口择宗","weight":50,"once":true,"cond":{"noSect":true,"realmMin":1},"text":"你下山那日在镇口被拦下。来人穿洗得发白的青衫，翻着厚名册说：你的名字被人圈了一笔，按规矩可以挑一次宗门。","choices":[{"text":"青云剑宗：剑要直，人要硬","effect":{"sectJoin":"青云剑宗","cult":120,"mind":12,"fame":10,"wealth":-50,"log":"拜入青云剑宗"},"result":"接引你的是个背剑的女子，姓沈，一路上只说过两句话，其中一句是叫你把背挺直。青云的规矩最难看懂，同门之间比同门之间更狠。但真有人欺负你的时候，剑宗的人从不问你打得过打不过。"},{"text":"丹霞谷：有药有谷，饿不着","effect":{"sectJoin":"丹霞谷","wealth":200,"cult":70,"mind":5,"contribution":10,"rel":{"白芷":10},"log":"拜入丹霞谷"},"result":"谷口的药田一层层铺到半山，风一过全是苦香。分给你的是一炉火和一屋子药柜，从此你要守着它。这里的人说话都慢，救人也慢，杀人的时候也慢，只是那一下特别准。"},{"text":"天音阁：弦上能听人心","effect":{"sectJoin":"天音阁","cult":60,"mind":8,"luck":8,"rel":{"苏婉儿":15,"顾长歌":10},"log":"拜入天音阁"},"result":"阁里第一日就有人塞给你一张琴，弹不成调也不许停。教你的师兄姓顾，笑着说音修最大的毛病是多情，最大的本事也是多情。小师妹苏婉儿把点心藏在琴匣里，被罚抄了三天谱。"},{"text":"万魔殿：快，只要你敢要","effect":{"sectJoin":"万魔殿","cult":260,"mo":12,"fame":12,"mind":-5,"log":"投身万魔殿"},"result":"殿门前的石阶是黑的，据说是踩出来的。他们不问你出处，只看你撑不撑得住。三个月抵得上别人三年，代价是每天都要重新证明自己配站在那里。圣女的轿子从你身边过去时停了一瞬。"},{"text":"散修联盟：没靠山，也没人管","effect":{"sectJoin":"散修联盟","luck":12,"cult":80,"mind":6,"wealth":20,"log":"入散修联盟"},"result":"联盟不过是一处挂着旧幌子的院子，谁来谁走都由自己。有人教你半套身法就没了下文，有人借你二十块灵石再没出现过。最大的好处是自在，最大的坏处也是自在，摔倒时没人扶。"},{"text":"合欢宗：名声难听，诺最重","effect":{"sectJoin":"合欢宗","cult":50,"mind":10,"luck":6,"fame":-12,"rel":{"苏婉儿":12,"姜雪璃":5},"log":"拜入合欢宗"},"result":"山门外的桃花一年开两季，门口迎你的女子先递给你一纸契，上面写着同门不得相欺，违约者道心自损。她说外头把我们说得难听，我们懒得辩，但宗里的人说话算数。"}]},{"id":"d02_01","title":"剑碑参悟","weight":9,"once":true,"cond":{"sect":["青云剑宗"],"realmMin":1,"realmMax":3},"text":"后山荒崖立着三十六块剑碑，碑面无字，只有剑意。第三块上有道断剑刻的口子，守碑人说那是长老留下的。","choices":[{"text":"不动，再坐两日","effect":{"cult":70,"mind":5,"log":"静坐剑碑两日"},"result":"你不去碰那道口子，只把三十六块碑一块块重看。第二日夜里，那道深深的刻痕自己亮了一下，像有人在说，先学会不悟。你起身时腿麻得几乎站不住，可剑意第一次顺着呼吸走完了全身。"},{"text":"以自身剑意强碰碑面","effect":{"cult":210,"mind":-7,"contribution":20,"log":"强碰剑碑"},"result":"你把剑意全压上去，碑身嗡了一声，那道旧痕被你硬生生撬开一道缝。你胸口一甜，血染红了半幅袖子，碑上却多出一道属于你的新痕，比所有人的都浅，但确实是你的。守碑老剑修看了一眼，没说话，替你上了药。"},{"text":"在碑侧刻下自己的名字","effect":{"fame":14,"contribution":-20,"flagAdd":["剑碑留名"],"log":"剑碑刻名"},"result":"你找了块空白的碑侧，把名字刻了上去，笔画尽量端正。三个月后有人路过看见，说青云剑宗出了个狂徒。宗门罚了你二十点贡献，那名气却没散，山下已经有人打听你的名字。"}]},{"id":"d02_02","title":"剑意比试","weight":10,"once":true,"cond":{"sect":["青云剑宗"],"realmMin":1,"realmMax":3},"text":"内门比试，执剑长老点了你的名字。对手周衍已连赢八场，剑尖朝下压了三寸，让你先出剑。台下有人等着看。","choices":[{"text":"堂堂正正递出一剑","effect":{"cult":110,"contribution":60,"rel":{"沈青霜":12},"log":"剑意比试八场止步"},"result":"你把剑意收成一线，正面刺出去。周衍挡了，也退了半步。三十招后你腕骨发麻，剑脱手，可全场静了一息才响起掌声。沈青霜从人群外走过，什么也没说，只把掉在地上的剑踢回你脚边。"},{"text":"使诈攻他伤处","effect":{"fame":6,"contribution":20,"rel":{"沈青霜":-15},"mo":6,"log":"比试取巧胜周衍"},"result":"你早看见他左肩旧伤未愈，剑走偏锋，专挑那半边递。第七剑他就丢了兵器。台下有人鼓掌，也有人低低骂了一声。沈青霜当场转身走了，走出三步又停下来，回头看了你一眼。"},{"text":"认输，看完全场","effect":{"mind":6,"cult":40,"log":"认输观剑"},"result":"你抱剑认输，退到台下，把周衍后面九场全看完了。他起手、换气、收势的节奏你记了个遍。散场时长老拍了拍你的肩：知道自己现在不该打，比打赢难。这一夜你练剑到天亮。"}]},{"id":"d02_03","title":"护山剑阵","weight":8,"once":true,"cond":{"sect":["青云剑宗"],"realmMin":1,"realmMax":3},"text":"护山大阵要七名剑修同镇剑眼，掌门点了你的名。那剑眼直通地底，风一过就呜呜响，守过阵的两人都没回来。","choices":[{"text":"接剑眼，守满三年","effect":{"contribution":120,"cult":90,"mind":8,"age":3,"flagAdd":["剑冢残卷"],"log":"守剑眼三年"},"result":"你在剑眼边坐了三年，风把脸吹得粗糙。第二年冬天，一道洪流从沟底涌上来，你在断剑堆里捡到半卷残页，上面记着护山剑阵的第七种变阵。出来那天，守门弟子没认出你，看清后才行了个大礼。"},{"text":"先与同门推演三夜再接班","effect":{"contribution":80,"mind":5,"rel":{"顾长歌":10},"log":"推演剑阵三夜"},"result":"你拉着顾长歌在阵图上划了三夜，把七处剑眼的换气顺序全排了一遍。接班后你按图轮值，三年间阵眼一次没乱。顾长歌说这不算本事，算命硬，说完自己先笑了，把最后一坛酒留给了你。"},{"text":"推掉这门差事","effect":{"contribution":-30,"fame":-8,"log":"推掉守阵差事"},"result":"你说自己修为太浅，怕误了大事。掌门没有多问，只把名字从名册上划了。之后半年你再去剑冢附近，守阵的弟子会客客气气地请你绕路。那半年你确实多练了几百遍剑，也确实总觉得自己少了点什么。"}]},{"id":"d02_04","title":"丹炉出事","weight":10,"once":true,"cond":{"sect":["丹霞谷"],"realmMin":1,"realmMax":3},"text":"三更天，丹房炉火失了控。那是配给外门弟子的筑基丹，一炉七十二枚，火候过了就是毒。火已经舔上了梁。","choices":[{"text":"立刻开炉取丹","effect":{"cult":60,"contribution":100,"mind":-6,"rel":{"白芷":10},"log":"开炉救下七十二丹"},"result":"你用袖子裹住手掀开炉盖，热浪扑上脸，眉毛燎掉了一半。七十二枚丹取出来，四十一枚还能用。你两条小臂烫出成片水泡，白芷来看你时眉头拧得很紧，一句话没说，把最好的药膏整盒按在你床头。"},{"text":"先撤火，再喊人救丹","effect":{"contribution":40,"fame":4,"log":"撤火保下丹房"},"result":"你先掀了炉底的引火砖，火势稳住了，丹房保住了，那炉丹却全废。长老回来只看了一眼，说丹房比丹值钱。执事弟子被罚去种药，你得了四十点贡献，还有他此后每次见你都躲着走的背影。"},{"text":"趁乱把两枚丹揣进怀里","effect":{"wealth":90,"contribution":-25,"mind":-5,"log":"趁乱藏丹两枚"},"result":"你把两枚尚好的丹塞进袖袋，转手在坊市换了九十块下品灵石。回谷时你一直觉得有人在背后看，回头却只有烧黑的门框。后来那炉丹清点少了三枚，没人查到你头上。你也没再吃过那两枚丹。"}]},{"id":"d02_05","title":"药园看守","weight":9,"once":true,"cond":{"sect":["丹霞谷"],"realmMin":1,"realmMax":3},"text":"药园西角那株三千年灵芝熟透了，谷里派你看守十日。白芷送饭时说，去年也有人看过它，看着看着就没了。","choices":[{"text":"寸步不离守满十日","effect":{"contribution":90,"mind":8,"rel":{"白芷":10},"log":"守夜十日"},"result":"十夜你没合眼，用剑鞘把自己的手腕和白芷送来的小凳腿绑在了一处。灵芝成熟那日，谷里长老亲来采摘，分了你半片叶。白芷把叶收走晒干，说这个冬天给你留着，你那张脸实在不像气血足的人。"},{"text":"摘一小片叶收好","effect":{"wealth":160,"contribution":-30,"mind":-4,"log":"私摘灵芝叶"},"result":"你趁雾浓时摘下一小片叶，藏在鞋底带出药园。坊市上有人肯出一百六十块灵石，你卖了，钱袋沉甸甸的。那半月你走路都绕着药园走。白芷始终没提这事，只是后来再送饭，饭盒总是放在门口。"},{"text":"查查去年是谁动的手脚","effect":{"contribution":70,"fame":8,"rel":{"白芷":18},"log":"查出偷药之人"},"result":"你翻了三天的出入记录，比对药渣，最后在杂役房的一个旧坛子里找到了去年那株灵芝的残根。偷药的人被逐出谷门。白芷知道后把手里的药杵放下来，说了句原来不是我记错了。那天她做了一锅很甜的粥。"}]},{"id":"d02_06","title":"丹方被窃","weight":8,"once":true,"cond":{"sect":["丹霞谷"],"realmMin":1,"realmMax":3},"text":"谷中三张秘传丹方的拓本少了一张，石室门禁完好，锁扣还是温的。长老对了一遍口供就压下了。你记得有个旧交。","choices":[{"text":"循着坊市自己查下去","effect":{"contribution":80,"fame":10,"wealth":-60,"log":"查明丹方下落"},"result":"你在坊市蹲了六天，花了六十块灵石买通一个跑腿的，顺着药渣一路摸到了城外的黑铺。长老带人抄了铺子，丹方回来了一半。窃方的人被废了灵根逐谷。你那位旧交从此不再与你同桌吃饭。"},{"text":"把疑点禀给长老","effect":{"contribution":50,"mind":5,"rel":{"白芷":-8},"log":"上报丹方疑点"},"result":"你把看到的都说了，一句没添也没减。长老查了两月，最后只罚了那人三年月俸，丹方始终没找回来。白芷听说以后沉默了很久，说了一句，你做得没错。然后她再没跟你提过这件事。"},{"text":"装作不知，替旧交圆一次","effect":{"wealth":200,"contribution":-40,"mo":6,"mind":-6,"log":"替旧交遮掩"},"result":"对供时你把那天的时辰说错了半个。长老看了你一眼，没追问。半年后你账上多了两百块灵石，来源说不清。那张丹方后来在外头被人改得面目全非，害死了三个人，你听说时正在煮药。"}]},{"id":"d02_07","title":"抚琴悟道","weight":9,"once":true,"cond":{"sect":["天音阁"],"realmMin":1,"realmMax":3},"text":"子时阁楼上风大，你独坐抚琴。弹到第三遍，弦上忽然多出一道余音，有人在你背后把下半句接了下去。","choices":[{"text":"装作不知，继续弹完这一曲","effect":{"cult":80,"mind":6,"log":"夜弹一曲"},"result":"你没回头，把那支曲子弹到最后一声，余音在廊柱间绕了很久才散。天亮时栏杆上的糖糕不见了，多了一小包新买的，纸还热着。你把那包糖糕吃了，觉得这一夜的曲子比平时好听。"},{"text":"停手，循着余音找过去","effect":{"cult":50,"luck":5,"rel":{"苏婉儿":12},"log":"寻到廊下听曲之人"},"result":"你收了琴追下去，在转角堵到一个抱着食盒的小师妹。苏婉儿理直气壮地说，她只是路过，顺手听听，顺便吃个糕。她说完自己先绷不住笑了，把食盒塞给你，让你明天再弹一遍给她听。"},{"text":"故意弹错一个音","effect":{"mind":-4,"cult":30,"luck":8,"log":"错音试出真心"},"result":"你手腕一沉，把一个音弹得离了调。廊下的气息立刻乱了半拍，随即有人极快地替你补上了那个音，补得比你原本弹的还好。你回头时人已经走了。此后夜里，阁楼上再没出现过别人的声音。"}]},{"id":"d02_08","title":"音律比试","weight":10,"once":true,"cond":{"sect":["天音阁"],"realmMin":1,"realmMax":3},"text":"阁中音律比试分两场：先斗曲，后斗心。第一场对方弹《塞上雪》，杀气很重。第二场考定力，连谱都不给。","choices":[{"text":"照着谱子稳稳弹完两场","effect":{"cult":100,"contribution":70,"mind":6,"log":"音律比试稳过两场"},"result":"你两场都用同一手起势，不快不慢。第二场对手弹得翻江倒海，你始终没偏一个音。长老最后给了个中等的评语，说你没有一处破绽，也没有一处让人记住。顾长歌说这话翻译过来就是，你还得再来几年。"},{"text":"第二场顺着对方的曲子接下去","effect":{"cult":120,"fame":12,"mind":-5,"log":"接曲夺场"},"result":"第二场你忽然跟着对方弹了下去，两条旋律缠成一团，最后你的那一条压住了他。台下炸了，长老也抬了抬眉毛。散场后你耳鸣了三天，那三天里连喝水都听见曲子。从那以后，没人再敢在你面前随便起势。"},{"text":"第二场故意认输，避其锋芒","effect":{"contribution":20,"mind":8,"wealth":40,"log":"让出一场"},"result":"你第二场收了手，抱琴认输。对方怔了一下，下台后塞给你四十块灵石，说是谢你昨晚上替他母亲带了药。这事你早忘了。你少了一个名次，多了一个此后在阁里替你说话的人。"}]},{"id":"d02_09","title":"以曲疗心","weight":8,"once":true,"cond":{"sect":["天音阁"],"realmMin":1,"realmMax":3},"text":"一位外门师兄在幻境里伤了心神，醒来后不肯说话，谁靠近就让谁出去。长老把这差事交给你，说你伤不到他。","choices":[{"text":"弹他入门时学的第一支曲","effect":{"contribution":80,"mind":10,"fame":6,"log":"以旧曲开解师兄"},"result":"你换了他入门那年的第一支曲，弹得慢，几处还错。门里静了很久，然后传来粗重的呼吸声。第五天他自己开了门，眼睛肿着，说了一句，这曲子我娘也会。此后他重新拿起了琴。"},{"text":"把幻境的事摊开说","effect":{"contribution":60,"cult":40,"rel":{"苏婉儿":-10},"luck":-4,"log":"直言幻境之事"},"result":"你推门进去，把他在幻境里看见的东西一件件说了出来，一句没绕。他先是发抖，然后哭得像个孩子。他好了，苏婉儿却为此生了很久的气，说你哪是疗心，你是在他伤口上又划了一遍。"},{"text":"先去找长老问清来龙去脉","effect":{"contribution":40,"mind":5,"rel":{"苏婉儿":8},"log":"先问清再疗心"},"result":"你花了两天把那位师兄的旧事问清楚，连他家中还有谁都记下了。再去的时候你没带琴，只是坐着陪他吃了几顿饭。他慢慢开始说话。苏婉儿说你总算像个天音阁的弟子，那天她把自己那份点心分了你一半。"}]},{"id":"d02_10","title":"血池淬体","weight":10,"once":true,"cond":{"sect":["万魔殿"],"realmMin":1,"realmMax":3},"text":"殿中血池开了三日，轮到谁谁下去，没人敢往后缩。池里的血是战死者的，泡一个时辰顶三年苦修，泡不好会疯。","choices":[{"text":"泡满两个时辰","effect":{"cult":260,"mo":12,"mind":-8,"log":"血池泡足两时辰"},"result":"你下去时水是温的，半个时辰后开始烫，一个时辰后你听见很多人在你耳朵里说话。两个时辰到了，你从池里爬出来，浑身像换了一层皮。姜雪璃隔着水汽看了你很久，说了句，你还站着，算你有点意思。"},{"text":"只泡一个时辰","effect":{"cult":130,"mo":5,"log":"血池泡一时辰"},"result":"一个时辰到点你就上来了，岸上几个弟子嗤笑了一声。你没理会，回去把衣服上的血渍洗了三遍。后来殿里比试，几个泡满两个时辰的人当场发了狂，被拖下去了。你从旁边走过去，什么也没说。"},{"text":"不下池，替管池修士当值一夜","effect":{"contribution":60,"mind":8,"luck":5,"log":"守夜不下血池"},"result":"你替老修士守了一夜池子，记下每一个下池的人何时上岸、几时发抖。天亮时老修士难得看了你一眼，说这次入门的二十七个，只有你没想死。他给了你一枚避血的丹，你自己收着吧。"}]},{"id":"d02_11","title":"同门相残","weight":9,"once":true,"cond":{"sect":["万魔殿"],"realmMin":1,"realmMax":3},"text":"秘境里进来七个人，出口只认三枚令牌。你追着第三枚跑到洞窟深处，听见有人压着嗓子求救，是同门女弟子。","choices":[{"text":"搬开石头，把她带出去","effect":{"fame":8,"cult":40,"mind":6,"mo":-4,"rel":{"姜雪璃":10},"log":"救出被压同门"},"result":"你搬了半个时辰，指甲全翻了。她出来后什么也没说，把藏起来的那枚令牌直接塞给你，一瘸一拐往反方向走，去给另外五人引路。最后七个人出来四个。姜雪璃在出口站着，看见你满手的血，笑了一下。"},{"text":"取令牌先走，留她自生自灭","effect":{"cult":150,"wealth":120,"mo":10,"mind":-10,"log":"取令牌弃同门"},"result":"你摸走了那枚令牌，头也没回。出口开启时你排在第二个。三个月后殿中传开，那女弟子死在落石下，尸体是半年后清秘境的人带出来的。你手里那枚令牌如今还挂在腰间，谁看见都当没看见。"},{"text":"退回去，另找出口","effect":{"cult":60,"mind":5,"luck":-5,"log":"弃令牌另寻出路"},"result":"你把那枚令牌推回石缝，转身往深处走。你在洞底绕了两天，最后从一道裂开的地缝里爬了出来，浑身是伤，什么也没拿到。姜雪璃听说了，只说了三个字，笨得可以。她说这话时手里正在给你留一份口粮。"}]},{"id":"d02_12","title":"魔功反噬","weight":8,"once":true,"cond":{"sect":["万魔殿"],"realmMin":1,"realmMax":3},"text":"你修的功法第九层开始反噬，静坐时经脉里有东西在爬，再过十五日就要撞上心脉。殿里的规矩是自行处置。","choices":[{"text":"散功，从头再练一门","effect":{"cult":-120,"mind":12,"mo":-8,"lifespan":20,"log":"散去魔功重修"},"result":"你花了七日把九层功力一层层散掉，散到最后咳出一口黑血，人却轻了。你改修一门极慢的养气法，进境慢得像爬。半年后同批的人已经超过你两个小境界，但你的夜里终于安静了。"},{"text":"顺其反噬，把痛苦压成修为","effect":{"cult":220,"mo":15,"mind":-12,"log":"硬压反噬"},"result":"你不再抵抗，让那股逆行之气撞进丹田，疼得咬穿了嘴唇。天亮时你修为暴涨，出手比原先狠了三成。只是从此每逢月圆，你右手会不受控制地抽一下。姜雪璃注意到了，什么都没问，只在你桌边放了一瓶安神的药。"},{"text":"去求罗睺指点一句","effect":{"cult":80,"mo":8,"rel":{"罗睺":10},"log":"求罗睺指点","death":"魔道大能的随手一试，断送了你的性命"},"result":"你在殿外跪了一夜，罗睺终于出来，抬手按在你天灵盖上试了试，说这功法他自己也修过，修到第九层就换了人。他收回手时你眼前一黑。你的经脉没能撑住那一下轻描淡写的试探。"},{"text":"硬撑，谁也不告诉","effect":{"cult":60,"mind":-6,"mo":6,"log":"独撑反噬"},"result":"你把这事压在心底，白天照常出入，夜里咬着布巾挨过去。撑了四十多天，反噬自己退了下去，修为却像被凿掉一层。你在镜子里看见自己瘦了，眼下发青。这件事你到现在也没跟任何人说过。"}]},{"id":"d02_13","title":"坊市接活","weight":10,"once":true,"cond":{"sect":["散修联盟"],"realmMin":1,"realmMax":3},"text":"联盟木牌上挂着一排活计：清渠、押货、北坡除三头妖狼。钱数写在牌上，命数写在牌后。别接钱最多的那一栏。","choices":[{"text":"接押货，稳当走一趟","effect":{"wealth":80,"cult":40,"luck":4,"log":"押货一趟"},"result":"货是三十箱药材，路上遇了一伙劫道的，你和同行的四个人把箱子围成一圈站了一夜，没打起来。到地方后雇主多给了十块灵石，说你们这趟没掉一片叶子。你把钱缝进衣角，回联盟交了牌。"},{"text":"接除狼，赌一把大的","effect":{"wealth":150,"cult":90,"lifespan":-10,"log":"北坡除狼三头"},"result":"北坡的狼是开了灵智的，你追了两天两夜，杀了两头，第三头咬穿了你的左臂。你把它按在雪里结果了它。一百五十块灵石到手，箭头在骨头上留了疤。此后阴雨天你的左臂会先知道。"},{"text":"接清渠，顺便看看城里的门路","effect":{"wealth":20,"fame":3,"luck":8,"log":"清渠赚人情"},"result":"你清了六里水渠，认识了沿渠十几户人家和一个管水的修士。活钱少，可此后半年你在城里走动，总有人肯给你递个消息。老散修说这就对了，散修靠的不是灵石，是有人肯在你出事时多说一句话。"}]},{"id":"d02_14","title":"黑市交易","weight":9,"once":true,"cond":{"sect":["散修联盟"],"realmMin":1,"realmMax":3},"text":"黑市在地下的旧仓里，进门交一把下品灵石，出来谁也不记得谁。有人摆出一枚玉简，说是某宗的内门功法。","choices":[{"text":"买下，回去抄一遍就烧掉","effect":{"cult":160,"wealth":-120,"mo":8,"mind":-5,"log":"黑市买下残缺功法"},"result":"你付了钱，回去抄了两夜，把玉简砸碎丢进了河里。功法确实能修，前三层进境极快。可你抄到第四层时发现后面断得干净，而前四层的路子，分明是给某一家弟子量身定的。"},{"text":"不买，只把卖家记下来","effect":{"fame":5,"contribution":50,"mind":5,"log":"记下黑市卖家"},"result":"你什么都没买，退到角落把卖家的身形、口音、手上的疤记了个全，出来就把话递给了联盟的执事。三个月后那处旧仓被抄了。你没得过一个钱，但联盟里从此有几个老散修肯叫你一声师弟。"},{"text":"把玉简买下再交还失主","effect":{"wealth":-120,"fame":12,"mind":8,"log":"买回玉简归还原主"},"result":"你买下玉简，照着那道缺口找了两个月，终于摸到青云剑宗的外门。接东西的管事弟子不肯认，你却看见他手指在抖。三天后有人往你住的客栈送了三百块灵石，没有留名，钱数比你花的多了一倍半。"}]},{"id":"d02_15","title":"雇主赖账","weight":9,"once":true,"cond":{"sect":["散修联盟"],"realmMin":1,"realmMax":3},"text":"你替药商守了四十天库房，说好一百二十块灵石，结账那天他只给八十，还叫四个护卫堵门。联盟的规矩是自行了断。","choices":[{"text":"堵着门讨，一分不让","effect":{"wealth":120,"fame":8,"lifespan":-5,"mo":5,"log":"讨回全部灵石"},"result":"你在库房门口站了三天三夜，四个护卫轮流上来推你。最后一天你咳着血把契书拍到柜台上，药商脸色变了，把钱数全了。你拿了钱走人，背上挨的那两下，到冬天还在隐隐作痛。"},{"text":"请联盟执事出面做个中人","effect":{"wealth":90,"contribution":30,"fame":4,"log":"请中人了结"},"result":"执事来了，两边各退一步，你拿到九十块。药商此后在城里的名声坏了半截，执事却记住了你这个人。他说下回接活先来跟他打声招呼，联盟不保钱，保人还是能保一保的。"},{"text":"认下八十块，换他往后三年的活","effect":{"wealth":80,"luck":-4,"mind":-6,"log":"认亏换长久活计"},"result":"你收了八十块，还笑着跟他握了手，说往后有活尽管找你。此后三年你确实一直有活干，也一直是这个价。第四年他换了更便宜的人。你把那四十块灵石，当成学费记在了心里。"}]},{"id":"d02_16","title":"情丝难解","weight":9,"once":true,"cond":{"sect":["合欢宗"],"realmMin":1,"realmMax":3},"text":"宗里有门功课叫观心，要你把自己最放不下的那个人写在纸上，当众烧了。你提笔停住，墨晕成一个圆。","choices":[{"text":"写下名字，当众烧掉","effect":{"mind":12,"cult":90,"mo":-5,"log":"观心烧纸"},"result":"你把那个名字写上去，看它卷成黑边，化成灰。你没有哭，也没有看任何人的脸。掌事师姐说，你烧的是纸，不是人，能分清这一点就算过了。这一夜你的心境第一次稳得像一潭水。"},{"text":"交一张空白的上去","effect":{"mind":-8,"cult":60,"mo":8,"log":"空纸过观心"},"result":"你把空白的纸投进火里，说没什么可写的。掌事师姐看了你很久，让你出去了。此后每次夜里打坐，你总会听见纸被点燃时的响。那门功法你练得比谁都快，也比谁都冷。"},{"text":"留在宗里，不走这条道","effect":{"contribution":40,"mind":6,"fame":-5,"log":"不写名字留下"},"result":"你把笔搁下，跟掌事师姐说这门功课你暂时不做。她没罚你，只把你从观心的名册上挪到末尾。宗里有人说你怂，也有人在夜里来找你坐一会儿，什么也不说，坐够了就走。"}]},{"id":"d02_17","title":"幻境试心","weight":9,"once":true,"cond":{"sect":["合欢宗"],"realmMin":1,"realmMax":3},"text":"入门三年要过一次心幻阵，阵中把你最想要的东西摆在最近、最顺手的地方。阵里过一夜，外面只过一炷香。","choices":[{"text":"走过去，坐下，把它过完","effect":{"mind":10,"cult":100,"luck":-5,"log":"心幻阵中安坐"},"result":"你走过去坐下，把那一顿饭慢慢吃完。饭是热的，话是软的，你几乎信了。香烧尽时屋子散了，你站在原地，手里什么也没有。出来后你在阵外坐了很久，觉得心里空了一块，也轻了一块。"},{"text":"认出是假的，当场打碎","effect":{"mind":-6,"cult":140,"fame":8,"mo":8,"log":"破幻而出"},"result":"你抬手把桌子掀了，屋子和人一起碎成光点。你比同批的人早出阵两个时辰，长老夸你心志坚定。此后你再进幻境，什么都骗不过你，可你也再没在幻境里吃上一口热饭。"},{"text":"不动，站到香烧完","effect":{"mind":6,"cult":60,"contribution":30,"log":"立于幻境不动"},"result":"你没过去，也没出手，就站在门边看着那间屋子，看着那炉火一点点灭。香烧完时你连眼都没眨。长老说你这一关过得最像样，既没被骗，也没把心砸坏。宗里给了你三十点贡献。"}]},{"id":"d02_18","title":"双修合道","weight":8,"once":true,"cond":{"sect":["合欢宗"],"realmMin":1,"realmMax":3},"text":"宗中讲合道，讲两个人把修行铺开在同一张图上，谁也不许先松手。长老问你愿不愿与同门结伴，契书上按手印。","choices":[{"text":"答应结伴，各修各的道","effect":{"cult":120,"contribution":50,"mind":8,"rel":{"顾长歌":8},"log":"与人结伴合道"},"result":"你们立了契，约好不动情、不越界，只把修为铺在同一张图上。此后三年你进境快了一倍，他遇到瓶颈时你也拉过他一把。契满那天你们在宗门口各自散去，谁都没多说一句。"},{"text":"答应，把契立成终身的那种","effect":{"cult":180,"mind":6,"fame":8,"partner":"同门道友","log":"立终身合道之契"},"result":"你在契书上按了手印，把这一生和另一个人的修行绑在一处。宗里摆了三日流水席，来的人比你想的多。此后你的道途不再是一个人走的，遇上瓶颈时有人比你还急。这很好，也确实比从前重。"},{"text":"婉拒，只做同门","effect":{"mind":5,"contribution":-20,"log":"婉拒合道之约"},"result":"你把话说得很轻，也说得清楚，说不愿意拿别人的道途替自己垫脚。那位同门听完点了点头，说他也这么想过。此后你们还是同门，见面依旧行礼，只是那三年你的进境比旁人慢了一截。"}]},{"id":"d02_19","title":"宗门大比","weight":11,"once":false,"cond":{"realmMin":1,"realmMax":3},"text":"五年一次的宗门大比，六宗都来观礼，演武场外搭了三层看台。第一场抽到你，对手修为比你高一个小境界。","choices":[{"text":"先藏招，后发制人","effect":{"cult":90,"contribution":60,"fame":8,"mind":4,"log":"大比藏招取胜"},"result":"你前二十招只守不攻，把对方的节奏全摸清了才还手。翻盘那一下台下静了半息，然后炸开。本宗长老在人群后点了点头。你下场时手还在抖，顾长歌递水给你，说这一手藏得够阴，他喜欢。"},{"text":"开场就压上去","effect":{"cult":60,"fame":14,"lifespan":-8,"log":"大比硬碰一场"},"result":"你开场就把压箱底的东西全砸出去，打了对方一个措手不及，也在第三十招上被抓住破绽。你输半招，肋骨断了一根，可台下记住了你。有人打听你的名字，也有人打听你师承。"},{"text":"查清对手底细再上台","effect":{"cult":110,"contribution":40,"wealth":-40,"luck":5,"log":"查清对手再上台"},"result":"你花四十块灵石买了对手近三年的比试记录，一夜没睡，把他起手的三个习惯背了下来。上台时你每一步都踩在他前面。赢得不漂亮，但很干净。对方下场时看了你一眼，什么也没说。"}]},{"id":"d02_20","title":"内门晋升","weight":10,"once":true,"cond":{"realmMin":1,"realmMax":3},"text":"内门今年空三个位子，报了名的有十一个。考的是过一线崖，旧索桥只剩一根绳子，崖顶还要打坐一炷香。","choices":[{"text":"第一个上桥去","effect":{"cult":130,"contribution":80,"fame":10,"lifespan":-6,"log":"首位过索桥晋升"},"result":"你第一个踩上绳子，走到中段时绳索磨破了掌心，血顺着手腕滴下去。你没停，过去后直接坐在崖顶打了一炷香。三个位子里有你一个。后来别人提起这年晋升，都说第一个上去的那个人。"},{"text":"让同门先走，稳住后面","effect":{"contribution":70,"mind":8,"rel":{"顾长歌":12},"log":"殿后过桥"},"result":"你退到队伍末尾，把绳子那一头在石头上多绕了两圈。前面的人过去七个，掉下去两个，都被你在桥下接住了。考核的长老最后也把你算过了。顾长歌拍着你的背说，你这叫笨人有笨福。"},{"text":"先把绳索加固再上","effect":{"cult":70,"contribution":90,"fame":6,"log":"加固索桥过崖"},"result":"你花了半个时辰在桥头打了个结，多了两道活扣，掉下去的人也摔不着。十一个人过去十个。长老看着那个结，问你跟谁学的。你说跟你娘学的，她从前在山里采药。他听完没再问。"},{"text":"绕后山小道自己上去","effect":{"cult":50,"fame":-8,"mind":-5,"log":"绕道登崖"},"result":"你从后山绕了两个时辰，从崖背爬上去，赶在香烧完前坐进了打坐的位置。考核的长老看了你一眼，把你的名字划掉了。他说规矩不难为笨人，只难为想省事的人。你从那道崖走回住处，走了整整一夜。"}]},{"id":"d02_21","title":"藏经阁值夜","weight":10,"once":true,"cond":{"realmMin":1,"realmMax":3},"text":"藏经阁值夜是个没人愿接的差事，七个时辰不能合眼，烛火不许挪位置。第三层锁着三只铁匣，封条是三百年前贴的。","choices":[{"text":"巡阁七次，一步不错","effect":{"contribution":70,"mind":8,"log":"值夜巡阁七次"},"result":"你七个时辰巡了七趟，把每一层的窗栓都推过一遍。天亮时老修士进来，看了一眼烛台的位置，又看了看你，说了句，你昨天晚饭吃的是什么。你答得上来。他就把钥匙多留了你一把。"},{"text":"撕开封条，看一页","effect":{"cult":200,"mo":10,"mind":-8,"contribution":-20,"flagAdd":["夜读禁书"],"log":"夜读禁书一页"},"result":"你撕开一角，抽出册子只看了一页，那上面的东西就钻进脑子里烧了起来。你原样贴回封条，可边角再也压不平。此后你的修行快得反常，老修士再没让你值过夜，也没问过你什么。"},{"text":"抄下借出去的书册名录","effect":{"fame":6,"wealth":100,"contribution":30,"log":"抄录借书名录"},"result":"你没动铁匣，先把三层书架上每册书借出与归还的记号抄了一份。半年后有人拿着你的单子找出了三个私改借期的内门弟子。你把单子卖了两次，一次给管阁，一次给那几个弟子的对头。"}]},{"id":"d02_22","title":"灵石矿出事","weight":10,"once":false,"cond":{"realmMin":1,"realmMax":3},"text":"宗门辖下的灵石矿在西岭，午时地动，主巷道塌了三里，下面还有三十七个矿工，多数是凡人。矿头跪在洞口喊你。","choices":[{"text":"组织人手，先救人","effect":{"cult":60,"fame":15,"contribution":80,"wealth":-80,"mind":8,"log":"矿难中救出十九人"},"result":"你把身上所有灵石拿出来雇了二十个散修，按矿头画的旧图挖了三天。塌方又落了两回，最后一次把你埋到腰。最后救出十九个人。宗门补给你的钱不够填雇人的费用，可那些矿工记住了你的名字。"},{"text":"先封侧道，等宗门定夺","effect":{"contribution":60,"fame":-6,"mind":-6,"log":"封矿待命"},"result":"你封了矿口，写了加急文书。等宗门的执事带人赶到，已经是第五天，下面的声音早就没了。宗门赏了你六十点贡献，说你处置稳妥。你拿着那份赏，觉得手里沉得不像是自己的东西。"},{"text":"趁乱下侧道去抢富矿","effect":{"wealth":300,"contribution":-50,"mo":10,"mind":-8,"log":"矿难中抢矿"},"result":"你顺着侧道下去，从塌方压出来的富矿脉上搬了三袋上品灵石，一路无人拦你。这笔钱够你花三年。此后你再路过西岭，会绕很远。那三十七个矿工里，活下来十一个。"},{"text":"从侧道口自己撤出去","effect":{"fame":-10,"mind":-8,"lifespan":10,"log":"撤离矿难现场","death":"你在侧道口被第二次塌方埋住了"},"result":"你转身往侧道口走，脚底忽然一沉，整面洞壁在你身后塌了下来。你没能跑出去。等有人清到这一段时，只找到半截袖子，和那块亮得很奇怪的灵石。"}]},{"id":"d02_23","title":"长老收徒","weight":9,"once":true,"cond":{"realmMin":1,"realmMax":3},"text":"老修士忽然要收徒，天没亮听风亭外已排了二十多人。他说挑人不看修为：三日后午时，等一个不来的人。","choices":[{"text":"三日午时，准时赴约","effect":{"cult":120,"mind":10,"luck":8,"contribution":40,"log":"听风亭守约三日"},"result":"你三日后准时到了听风亭，坐到日落。那位不会来的人确实没来。老修士下午走进亭子，在你对面坐下，倒了两杯茶。他说他等的不是那个人，是肯来的人。他成了你的师尊，第一句话是让你别学他那身邋遢。"},{"text":"闭关三日，不赴约","effect":{"cult":140,"mind":-6,"fame":-5,"log":"闭关未赴听风之约"},"result":"你把自己关了三日，修为进了一层。出关时听人说老修士收了另一个弟子，就是那个在亭外站到最后一刻的人。你去看过一次，那师徒两个正在亭子里下棋。你站在远处看了一会儿，回去继续闭关。"},{"text":"当日去，把话问清楚再决定","effect":{"mind":6,"cult":60,"luck":5,"log":"问清缘由再拜师"},"result":"你去了，先问他为什么非得等一个不来的人。老修士笑了一声，说他年轻时错过一次，此后就不信空口的约定。他没收你，但给了你一本自己批注过的册子。那册子你翻了十年，翻烂了两遍。"}]},{"id":"d02_24","title":"师尊闭关","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":3,"flagNone":["师尊闭关"]},"text":"掌门宣布，师尊将闭关三年，不问外事，连传音符都封了。师尊留下一峰的事务、两处产业和七封没写完的信。","choices":[{"text":"守在峰上，代管这三年的事务","effect":{"contribution":120,"fame":8,"cult":50,"age":3,"flagAdd":["师尊闭关"],"log":"代管一峰三年"},"result":"你接了名册和账本，三年里没出过一次峰门。峰上的事比你想象的琐碎，冬天漏雨的屋脊、秋天不够分的丹药、还有两个总在吵架的师弟。师尊出关那天看了账本，说了句，比他自己管得好。"},{"text":"把事务交出去，自己在崖上苦修","effect":{"cult":200,"contribution":-20,"mind":6,"age":3,"flagAdd":["师尊闭关"],"log":"闭关崖上三年"},"result":"你把名册原样交还管事，搬去剑崖下的小屋。三年里除了送饭的弟子，你不见任何人。出关时你的修为越了两个小境界，峰上的弟子有一半已经不认得你。师尊听说后只说了两个字，也好。"},{"text":"下山游历寻信之主","effect":{"fame":15,"wealth":100,"cult":80,"luck":8,"age":3,"flagAdd":["师尊闭关"],"log":"下山寻信之主"},"result":"你带着那七封信下了山，三年走了四个州，找到其中三个人。有一个已经死了，有一个不肯认，还有一个抱着信哭了半个时辰。回峰时你只剩最后一封没送出去。师尊看着你手里的信，很久没说话。"}]},{"id":"d02_25","title":"同门陷害","weight":10,"once":false,"cond":{"realmMin":1,"realmMax":3},"text":"库房丢了一瓶筑基丹，长老查到最后一环，指到了你头上。指你的是个同你点头的弟子，说夜里见你在库房外站着。","choices":[{"text":"自己去找证据","effect":{"cult":50,"contribution":70,"fame":6,"wealth":-50,"log":"自证清白"},"result":"你花了五十块灵石，把库房前那条路上的三家铺子问了个遍，找到两个肯作证的伙计。第二次问话时你把人证摆在堂上。指你的那位弟子当场瘫坐下去。长老没罚你，也没赏你，只说下回少往库房跑。"},{"text":"当众反问他前日在哪里","effect":{"fame":10,"contribution":30,"mo":6,"rel":{"顾长歌":10},"log":"当众反击诬告者"},"result":"你当场问了他三个问题，问到第二个他的时辰就对不上了。堂上有人笑出了声。他被罚了三年月俸，你洗清了干系。散场后顾长歌说这一手够痛快，也够险，往后他会记着你。"},{"text":"认下罚，换他欠你一次","effect":{"contribution":-40,"fame":-6,"mind":-5,"wealth":200,"log":"认罚换人情"},"result":"你没争，认了四十点贡献的罚。三个月后那人半夜来找你，把两百块灵石放在桌上，说那瓶丹是他姐姐病重时偷的。此后他在宗门里一直替你说话。你始终没提那两百块灵石是怎么来的。"}]},{"id":"d02_26","title":"丹药分配","weight":10,"once":false,"cond":{"realmMin":1,"realmMax":3},"text":"这个月的丹药分下来，你连着三个月领的都是最少的那一份。苏婉儿受了伤，把药瓶往袖里藏。","choices":[{"text":"去找执事当面理论","effect":{"contribution":-20,"fame":8,"mind":-5,"rel":{"苏婉儿":12},"log":"为丹药当众理论"},"result":"你拿着三个月的任务册子站在执事堂前，一条条念了出来。执事脸色很难看，最后给你补了半份。这事传开以后，有人说你不懂规矩。苏婉儿把你补的那半份塞回来一半，说她一个人吃不完。"},{"text":"把丹药匀给需要的人","effect":{"mind":10,"fame":5,"rel":{"苏婉儿":18,"白芷":8},"wealth":-30,"log":"匀丹给受伤同门"},"result":"你把自己那份拆开，一半留给苏婉儿，一半托人送去药庐。你自己去坊市花了三十块灵石买了些下等的补气丹对付。那个月你进境慢得几乎停住，可药圃那边的咳嗽声，过了半个月就没有了。"},{"text":"不争，去多接任务攒贡献","effect":{"contribution":100,"cult":60,"lifespan":-5,"mind":6,"log":"多接任务自攒丹药"},"result":"你什么也没说，把空闲的时间全填进了任务。一个季度下来攒了足够的贡献，自己换回两瓶好丹。执事后来再分东西，会先看一眼你的册子。这个道理你花了三个月才明白：能自己挣的，不必等人给。"}]},{"id":"d02_27","title":"下山历练","weight":11,"once":false,"cond":{"realmMin":1,"realmMax":3},"text":"宗门下了历练令，要你们这批弟子下山各领一处差事。城南闹妖，报酬厚；城北查失踪案，安生；还有往东的官道。","choices":[{"text":"去城南接令除妖","effect":{"cult":200,"wealth":120,"fame":12,"lifespan":-12,"log":"城南除妖受伤"},"result":"妖是只成了气候的赤狸，你追了它五天，最后在一口枯井里堵住。它临死前咬掉了你半只耳朵。一百二十块灵石的报酬拿到手，你就着药躺了半个月。此后你听风辨位比从前准得多，这算意外之得。"},{"text":"去城北查失踪案","effect":{"cult":90,"fame":10,"mind":8,"wealth":40,"log":"城北查清失踪案"},"result":"失踪的六个人最后都指向同一口废井和一位收租的里正。你把案子交到官府，那六个人里活了两个。报酬不多，事情做得干净。回宗交差时长老翻了翻你的卷宗，说以后有这种差事还让你去。"},{"text":"护送商队三个月","effect":{"wealth":220,"cult":60,"contribution":40,"age":1,"log":"护送商队三月"},"result":"三个月你走了两千里官道，遇过两次劫道的，都是谈开了的。商队管事把你当自家人，临别时多结了两成钱。你回宗时季已经换了，山上的叶子落了一地。这两百二十块灵石解了你半年的窘迫。"}]},{"id":"d02_28","title":"宗门庆典","weight":10,"once":false,"cond":{"realmMin":1,"realmMax":3},"text":"掌门寿辰，宗门摆了三天流水席，各峰都要出人出力。执事给你留了三个去处：前场演武、后山当值、偏厅待客。","choices":[{"text":"去前场演武出头","effect":{"fame":14,"contribution":60,"cult":60,"lifespan":-6,"log":"庆典演武出彩"},"result":"你在前场演了一套剑，最后收势时用力太猛，膝盖里的旧伤裂了。台下掌声不少，掌门也看了两眼。你在偏厅敷药敷了一晚上，第二天起来腿还在发软，但那两天来贺的客人里，有三个人记住了你的名字。"},{"text":"去后山当值守夜","effect":{"contribution":90,"cult":50,"mind":8,"luck":-3,"log":"庆典后山当值"},"result":"你在后山守了三天三夜，守着库房和柴房，听前场的鼓乐声一阵阵飘上来。第三夜你在库房外抓住了两个偷酒的杂役。执事说你这份差事办得利落，给你记了九十点贡献。你把酒还了回去，自己没喝。"},{"text":"去偏厅招待客卿","effect":{"fame":10,"wealth":-80,"contribution":40,"luck":6,"log":"庆典偏厅待客"},"result":"你在偏厅站了三天，记住了十七位客卿的姓氏和口味，还把贺礼单子按宗门理了一遍。有位老客卿走时点名要你送出门。为了递上那份像样的贺礼，你自己贴了八十块灵石。这份人情账，往后总要收的。"}]},{"id":"d03_01","title":"剑冢残鸣","weight":10,"once":true,"cond":{"realmMin":1,"realmMax":3},"text":"你跌进一道地缝，缝底全是剑。千万柄残剑插在赤土里，齐声低鸣。冢中央是一块无字碑，碑前跪着一具枯骨。","choices":[{"text":"拾起那柄断剑","effect":{"cult":30,"mind":4,"wealth":60,"flagAdd":["剑冢残锋"],"log":"剑冢得残锋"},"result":"断剑入手的刹那，千万柄残剑同时静了。你听见一声叹息，不是从耳朵进来的。剑身里残着半式剑意，你照着比划，手臂被震得发麻，却记下了那一划的走向。碑前枯骨无声，你把断剑插回腰间。出地缝时，袖中多了几块锈铁，卖价倒不低。"},{"text":"在无字碑前磕三个头","effect":{"mind":8,"lifespan":5,"luck":3,"log":"剑冢叩碑"},"result":"你跪下，额头碰在土上，三下，不轻不重。第三下时，碑面浮出一行极淡的字，你只来得及记住“剑不为人所使”六个，字就散了。起身时你觉得心口那块地方稳了一点。枯骨的手指不知何时松了，掌心空空，什么也没留下。"},{"text":"先搜枯骨，再理残剑","effect":{"cult":40,"mo":3,"wealth":120,"log":"剑冢取骨"},"result":"枯骨怀里藏着一只旧布袋，袋口一松，掉出几枚灵石和半卷剑谱。你收下了。转身要走时，背后千万柄残剑忽然一齐嗡鸣，声浪从脊椎里穿过去，你在坡上呕了一口血，耳鸣了三天。那半卷剑谱确实是真的。"}]},{"id":"d03_02","title":"龙骨未凉","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":4},"text":"裂开的山壁里嵌着半截龙爪，谷底横着龙骨，肋骨像桥拱。龙首早没了，胸腔里那团暗红的光一明一暗，像还在跳。","choices":[{"text":"摘骨缝里的白果","effect":{"cult":45,"lifespan":8,"luck":-2,"log":"龙骨秘境摘果"},"result":"果子入口先是腥的，随后化成一股滚烫的暖流从喉咙滑进丹田。你盘膝坐了半日，醒来时手脚都轻了。但那些白藤像是被谁叫醒，慢慢朝你这边卷。你退得快，只被刮掉半片袖子。果子共摘了七枚，还剩五枚揣在怀里。"},{"text":"把手按上那团暗红光","effect":{"cult":70,"mo":8,"mind":-4,"lifespan":-5,"log":"触龙心残焰"},"result":"光不烫，是活的。它顺着你的经脉往里钻，一路上把堵着的地方全烧开了。你疼得跪下去，又觉得痛快，修为硬生生涨了一大截。代价是此后每逢雨夜，你心口都会跟着某种节奏跳，比自己的心跳慢半拍。龙虽死，心未凉。"},{"text":"不碰任何东西，原路退出","effect":{"mind":6,"luck":4,"log":"全身出龙骨谷"},"result":"你数着自己的脚步往外走，一步没停。走到山壁那道裂口时，你回头看了一眼——那团光还在一明一暗，肋骨的白在暗处像一排没关严的门。你没带走什么，也没留下什么。三个月后你听说，同一处秘境进去了十一人，出来了四个。"}]},{"id":"d03_03","title":"雾里故人","weight":10,"once":true,"cond":{"realmMin":1,"realmMax":4},"text":"沼泽的雾是甜的，回头已看不见来路。雾里浮出你最想见的那个人：衣裳干净，说前面有路。他早就不在了。","choices":[{"text":"跟着他走","effect":{"mind":-6,"cult":20,"luck":-3,"mo":5,"log":"雾中随影"},"result":"你跟着那道人影走了很久，走到雾薄的地方，人影忽然散了。你站在一片实地的边缘，脚下半寸就是黑水。前面确实有路——一条极窄的硬土脊，人若一头撞进去早就陷了。你冷汗透背，却到底走到了对岸，只是心口空了一块，像被谁取走。"},{"text":"站在原地，闭眼数息","effect":{"mind":10,"luck":5,"flagAdd":["雾中定心"],"log":"雾中立定"},"result":"你闭上眼，只数自己的呼吸。人影在你耳边说了许多话，从恳求到责备，最后变成一种很轻的哭声。你数到第九十息，哭声断了，风起了，雾散了。沼泽在你脚下，草是草，水是水。你睁眼时天已经黑了，但路看得清清楚楚。"},{"text":"对着人影问一句话","effect":{"cult":35,"mind":3,"lifespan":-3,"log":"问影得答"},"result":"你问：你走的时候疼不疼。人影停住，很久没有说话，然后它笑了，说了一句你听不懂的话——那是你从未听过的古音，可你偏偏懂了。雾气顺着你的七窍灌进来，冲开一段淤塞的经脉。等你回过神，人已经不在，地上只剩一摊清水。"}]},{"id":"d03_04","title":"万宝楼争丹","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":5},"text":"万宝楼三层，回春丹已抬到八百灵石。隔两席的青衫少年是江晚舟，身后是位咳嗽不止的老妇人，你怀里只有九百。","choices":[{"text":"一路加价到底","effect":{"wealth":-900,"fame":6,"mo":4,"flagAdd":["夺丹"],"rel":{"江晚舟":-12},"log":"万宝楼夺丹"},"result":"你举到九百，全场安静。江晚舟看了你一眼，慢慢把牌子放下。丹到手了，装在一只白玉盒里，很轻。你出门时听见背后有人低声说，散修出手真狠。那位老妇人被扶着从你身边走过，没有看你。丹是好丹，你至今没用。"},{"text":"替他叫一次价，再收手","effect":{"wealth":-300,"fame":10,"luck":6,"rel":{"江晚舟":18},"flagAdd":["万宝楼让丹"],"log":"让丹与药庐"},"result":"你举牌叫到八百，然后在江晚舟跟上时收了手。他愣了一瞬，冲你极轻地点了下头。散场后他在门口等你，把一只小瓷瓶塞过来，说里面是三枚他自己炼的丹药，不值什么钱。瓶底刻着一个极小的“江”字。"},{"text":"不拍丹，转头去后堂","effect":{"wealth":-200,"cult":50,"luck":-2,"flagAdd":["万宝楼后堂"],"log":"万宝楼后堂"},"result":"你从侧门绕到后堂，那里堆着流拍的杂货。你用两百灵石买了一堆没人要的旧竹简，其中三卷是残缺的功法注疏。回程路上你翻了半宿，发现里面记着一门早该失传的引气法。至于那枚回春丹，据说是被人以一千二百灵石买走的。"}]},{"id":"d03_05","title":"雷池九道","weight":8,"once":true,"cond":{"realmMin":3,"realmMax":5},"text":"雷池在云上，石坪上布满焦坑，坑里滚着紫色雷浆。跳下去扛满九道能换一副筋骨，扛不住的连灰都留不下。","choices":[{"text":"跳进雷浆，硬扛九道","effect":{"death":"第九道天雷落下，雷池里再没浮起什么"},"result":"第一道雷落在肩上，你听见自己的骨头在响。第四道时你已经不知道疼是什么。第七道落下，护体真元碎成一片光屑。你抬头看天，云还在压，第九道已经在云里蓄着了。你想起老修士说的那句话，想收回脚，可脚已经不在石坪上了。"},{"text":"入雷浆，扛三道就退","effect":{"cult":90,"lifespan":-8,"mind":7,"fame":10,"flagAdd":["雷池淬体"],"log":"雷池淬体"},"result":"三道雷，你数得很清楚。第三道落下时你咬着牙往坑外爬，指甲抠进石缝，一寸一寸把自己拖了出来。你趴在坑边，浑身焦黑，喘得像风箱。老修士睁眼看你一眼，说了句还行。此后你抬手时，袖口会有一线极细的紫光。"},{"text":"只在坑边引雷气淬手","effect":{"cult":45,"lifespan":-2,"mind":4,"log":"雷池引气"},"result":"你只在最靠边的一个浅坑边坐下，把手探进雷气里。紫气顺着指尖上来，一层一层剥你的皮。你换了三次手，最后两只手掌都厚了一层，摸刀口也不觉得疼。老修士哼了一声，说这样练一百年也成不了气候，但也死不了人。"},{"text":"不炼体，问他守池几年","effect":{"cult":15,"mind":8,"luck":6,"fame":4,"log":"雷池问道"},"result":"你退回石阶上，给老修士行了个礼，问他守在这里多少年了。他愣了很久，说我记不清了，我只记得我不是第一个守池的。他指给你看不远处几座没有名字的石堆。你在那里坐到日落，什么也没练，下山时脚步却比来时稳。"}]},{"id":"d03_06","title":"洞府坐化","weight":11,"once":true,"cond":{"realmMin":1,"realmMax":2},"text":"你追山兔到断崖下，石缝后是间塌了半边的屋子。月光照在盘坐的道人身上，干了，姿势不散。矮几上摊着册子。","choices":[{"text":"翻开那本册子","effect":{"cult":55,"mind":4,"flagAdd":["残册记名"],"log":"洞府得残册"},"result":"册子上是他每日的行功记录，字很老实，一笔一划，写到某一页忽然停了，最后一行的墨还没干透就被灰盖住。你照着上面的路子练了三日，气感比从前顺。合上册子时你看见封底内页写着三个字：别学我。"},{"text":"揭开那只粗瓷碗","effect":{"cult":20,"wealth":150,"luck":3,"log":"洞府启碗"},"result":"碗里扣着一枚温润的玉扣，成色古朴，旁边还有一小袋灵石。你对着枯坐的道人拜了三拜才敢拿。玉扣贴身收着，入夜便暖。你后来才知道那是压祟的东西，卖给识货的人能换半年用度，只是卖了之后你连着做了几夜噩梦。"},{"text":"先替他收殓，再动东西","effect":{"mind":12,"fame":8,"cult":25,"lifespan":3,"log":"葬坐化道人"},"result":"你在崖下挖了个坑，把他连蒲团一起抬进去，土填实了，又搬了块石头立在坟前。石头无字，你也刻不出什么。等你回屋，那盏灯自己亮了。你翻册子、揭碗，什么也没少。出洞时你觉得背上有人轻轻推了一把，回头看，只有月光。"}]},{"id":"d03_07","title":"兽潮围城","weight":9,"once":true,"cond":{"realmMin":1,"realmMax":5},"text":"望云城的钟响了七下。兽潮。城外林子像开了锅，兽目在暗处亮成一片，会阵法的全去了东门。","choices":[{"text":"上城墙，跟着守垛口","effect":{"cult":60,"fame":20,"wealth":80,"mind":5,"log":"兽潮守城"},"result":"你守了一夜。刀卷了，手臂酸得抬不起来，中间有半炷香你几乎分不清人和兽。天亮时潮退了，垛口下堆着兽尸。执事点名发赏，念到你的时候顿了一下，说散修也有硬骨头。你分到八十灵石和一块腰牌，牌上刻着望云两个字。"},{"text":"去城墙下救治伤者","effect":{"cult":20,"mind":8,"fame":12,"wealth":-50,"rel":{"白芷":15},"log":"兽潮行医"},"result":"你在城墙根下忙了一整夜，撕了半件衣裳做布条，把身上带的金创药全用完了。白芷也在，她蹲在你旁边，一声不吭地给人接骨，手指稳得吓人。天亮时她递给你一小包药粉，说下次别把好药浪费在外伤上。你笑了笑，没接。"},{"text":"趁乱出城，抄兽潮后路","effect":{"cult":90,"wealth":200,"luck":-4,"mo":6,"log":"兽潮抄后"},"result":"你从水门溜出去，摸到兽潮后方的林子里。那里堆着被咬死的灵兽和没来得及吞下的储物袋。你捡得很快，也很轻。回城时天已经亮了，守门的人只当你是援兵。城墙上的人在清点死伤，你没敢抬头看。"}]},{"id":"d03_08","title":"阵道迷宫","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":4},"text":"你踏进阵道迷宫。砖上纹路是活的，走错一步就换出口。干粮见了底，墙上刻着：欲出此阵者，先忘此阵。","choices":[{"text":"记住每一步，硬算出阵眼","effect":{"cult":70,"mind":10,"lifespan":-3,"flagAdd":["破阵眼"],"log":"硬破阵迷宫"},"result":"你盘膝坐下，把走过的每一条路在心里重排，排到第七遍时，那些纹路忽然连成了一幅图。阵眼在东角一块不起眼的砖下。你踩上去，四周响声大作，墙一层层退开。出阵时你头发白了几根，但你从此看任何阵图都比别人快。"},{"text":"闭上眼，一直往前走","effect":{"mind":12,"luck":8,"cult":30,"log":"盲行出阵"},"result":"你闭上眼，不看出口，只认脚下的石砖缝。撞了三次墙，磕破了额角，走到后来连方向也不管了。某个时刻你睁眼，发现自己站在阵外的荒地上，天正亮。身后什么也没有，只有一片普通的石滩。你说不清自己是怎么出来的。"},{"text":"砸墙，一路凿出去","effect":{"cult":45,"mo":5,"lifespan":-5,"fame":4,"log":"凿壁出阵"},"result":"你没有耐心，直接祭出法器对着墙猛砸。墙是软的，砸开的洞里又是一层墙。你砸了整整一天，砸到手抖，最后砸到了真石头——阵基被你生生砸穿。出来时你浑身是灰。这法子太笨，但很有用。"}]},{"id":"d03_09","title":"缝里见己","weight":7,"once":true,"cond":{"realmMin":4,"realmMax":5},"text":"山谷里的风停了。面前裂开一道缝，缝里是你走过的路。路上那人正在回头，长着你的脸，腰间挂着剑。","choices":[{"text":"跨进去，与他换一句话","effect":{"cult":120,"mind":12,"lifespan":-10,"flagAdd":["见过自己"],"log":"裂缝见己"},"result":"你跨进去，裂缝里没有上下。他开口，说的是你此刻正要说的那句话，于是你们同时闭了嘴。他把自己腰间的一枚旧符解下来塞给你，动作和你一模一样。裂缝合上时，你站在原来的山谷里，风重新吹起来。那枚符在你掌心，纹路已经旧了。"},{"text":"伸手抓住他，拽他出来","effect":{"death":"你留在了不属于自己的那个时辰里"},"result":"你抓住了他的手腕，那一瞬你想的是，我不能再少一个我。裂缝开始急收，他反手把你也往缝里带。两个人卡在一条越来越窄的缝里。最后你听见的是自己的声音，在很远的地方说了一句：放手。风停了，山谷里再没有人。"},{"text":"后退三步，记下他的样子","effect":{"mind":10,"luck":6,"cult":40,"lifespan":5,"log":"退避裂缝"},"result":"你退了。裂缝在你眼里一寸寸合上，他一直在看你，最后笑了一下——那个笑法你自己都不知道自己会。风回来的时候你站在原地，把看到的每一样东西都记在心里：他的剑、他的疤、他的步子。你知道路该怎么走了。"}]},{"id":"d03_10","title":"阴兵过境","weight":8,"once":true,"cond":{"realmMin":3,"realmMax":5},"text":"荒原上只有断戈和碎骨。夜里起了雾，雾里有整齐的脚步声。你趴在壕沟里，一列列甲士走过，脸是空的。","choices":[{"text":"等阴兵过完，捡地上的东西","effect":{"wealth":220,"cult":40,"luck":-3,"mo":4,"log":"战场拾遗"},"result":"队伍走了整整一夜。天亮时你在他们踩过的地方捡到七枚锈蚀的箭头、半块将印、一柄还能出鞘的短刀。刀柄上缠的布早就糟了，却在你握住时紧了一下。你把东西收好，走出荒原时回头看了一眼，雾还在那里，脚步声也还在那里。"},{"text":"混进队伍里，跟着走","effect":{"cult":100,"mind":-8,"mo":10,"lifespan":-8,"flagAdd":["随阴兵行"],"log":"随阴兵行"},"result":"你站起来，走进队列，学他们的步子。走了二十步，你发现自己的呼吸慢了下来，心口的跳声越来越远。走到某个地方，前面的人忽然齐齐转头看你。你猛地惊醒，从壕沟里爬出来，天还黑着。你的靴底磨穿了，修为却涨得吓人。"},{"text":"放一道灵光，惊散阴兵","effect":{"fame":15,"cult":30,"mind":8,"luck":4,"mo":-5,"log":"战场驱阴兵"},"result":"你冲天打出一道灵光，光炸开的一瞬，整列甲士化作灰雾散了个干净。荒原上第一次安静下来。你站在原地喘气，忽然听见很远的地方有个声音说：多谢。第二天有商队路过，说这一带的阴兵几十年没散过，昨夜居然散了。他们给荒原东头的无名坟上了香。"}]},{"id":"d03_11","title":"药园傀儡","weight":10,"once":true,"cond":{"realmMin":1,"realmMax":3},"text":"药草成了野的，比人还高。你翻过篱笆踩到一根细绳，一尊石傀儡站起来，挡在你和七色花之间。","choices":[{"text":"绕过它，抢摘那株七色花","effect":{"cult":60,"lifespan":10,"luck":-2,"fame":3,"log":"夺园中药"},"result":"你使了个轻身法，从石傀儡腋下钻过去，一把攥住花茎。花离土的瞬间，整座园子响了起来。石傀儡的手掌落在你后背上，你被打飞出去三丈，肋骨断了两根，花却死死攥在手里。你在园外躺了半天才爬起来，花根还带着土。后来你把它种活了。"},{"text":"先毁它胸口的碎玉","effect":{"cult":45,"wealth":300,"mo":5,"log":"碎傀儡玉"},"result":"你看出那半块玉是它的机关所在。缠斗两刻，你找准空隙一击敲碎。石傀儡停在半空的手忽然垂下，慢慢跪倒在药畦里，不再动了。你从它胸腔里掏出剩下的零星灵石和一块旧玉牌，牌上刻着一个药园的名字。园里那些药，从此随你采。"},{"text":"退出去，替它把篱笆扶好","effect":{"mind":15,"luck":8,"cult":20,"fame":5,"flagAdd":["药园旧识"],"log":"修葺药园"},"result":"你退到篱笆外，蹲下身把被自己踩歪的铁线藤一根根重新缠好。石傀儡站在原地看你，看了很久，胸口的玉光慢慢暗下去。你转身要走时，它弯腰从畦里拔了一株不起眼的小草，放在篱笆桩上。那草寻常，但能解十七种毒。"}]},{"id":"d03_12","title":"秘境夺珠","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":5},"text":"石台上悬着一枚珠子，里面有星河流转。台前站着三个带伤的人，谁也没先动，珠子还没认主。","choices":[{"text":"直接出手抢珠","effect":{"cult":130,"fame":12,"mo":8,"luck":-6,"flagAdd":["夺珠"],"log":"秘境夺珠"},"result":"你先动了。年长那个比你更快，两人在台前换了一记，你肩膀被撕开一道口子。你借着这一撞抓住了珠子，转身就走。珠子在掌心烫得像炭，地宫的门在你身后塌了。你出去了，那三个人没有。"},{"text":"把珠子让给断腿的人","effect":{"mind":15,"fame":20,"luck":10,"cult":30,"log":"让珠与伤者"},"result":"你走到石台前，把珠子拿起来，然后递给了靠着台子喘气的那个年轻人。他愣住了。另两人看着你，手上的血还在滴。你退开两步，说，我守门，你们谁有本事谁拿。最后那年轻人抱着珠子活了下来，许多年后他找到了你。"},{"text":"先替死者收殓，再谈分珠","effect":{"fame":10,"mind":10,"luck":5,"wealth":-30,"cult":20,"log":"地宫收尸"},"result":"你蹲下把死者睁着的眼合上，翻出他腰间的名籍，卷好收进袖子。另三个人被你这动作弄得僵了一会儿，手上的劲都松了。珠子最后被中间那个拿走了，年长那个没争。你把名籍送回了原主所在的山门，得了一笔谢仪，不多，够用半年。"}]},{"id":"d03_13","title":"天降流星","weight":9,"once":true,"cond":{"realmMin":1,"realmMax":5},"text":"傍晚天上裂了一片，一颗星拖着赤尾砸进东山。你到得最早，陨坑还在冒烟，坑底那块石头是热的。","choices":[{"text":"伸手去碰那块星石","effect":{"cult":90,"lifespan":6,"luck":5,"mo":4,"flagAdd":["星石接引"],"log":"触星石"},"result":"银水顺着你的手往上爬，一直爬到肩膀，凉得钻心。你听见极远的星野里有人在说话，说的是一种比古音更古的语言。等你甩掉那层水，掌心里留了一枚很淡的星印。此后你夜里看天，能看见别人看不见的几颗。"},{"text":"先凿下星石，分装带走","effect":{"wealth":350,"cult":40,"fame":6,"luck":-4,"log":"凿星石出货"},"result":"你掏出短刀，趁石头还软，凿下三块拳头大的边角，塞进储物袋里，用土把坑口掩了。第二天辰时，整座山头被上百修士围住。你混在人群里，听他们争论星石在哪。三块边角后来换成了三百五十灵石，你一张符都没烧。"},{"text":"守在坑边，拦住后来的人","effect":{"fame":18,"mind":8,"cult":35,"wealth":100,"mo":-3,"log":"守坑护星"},"result":"你站在坑边，对着第一个赶到的修士抱拳说，这块还活着，别动它。那人骂了一句，绕开了。后来的人越来越多，你把话重复了十几遍。天亮时星石自己沉了下去，坑底只剩一层焦土。有几个散修记着你的名字，塞给你些谢礼，说昨夜听你的没错。"}]},{"id":"d03_14","title":"地宫求生","weight":8,"once":true,"cond":{"realmMin":3,"realmMax":5},"text":"地宫塌时你正在第九层。壁上一处渗水，一处窄缝在过风。符纸只剩三张。墙上写着：往水走，随风去。","choices":[{"text":"顺着渗水的方向挖","effect":{"cult":60,"mind":10,"lifespan":-4,"luck":3,"log":"地宫循水"},"result":"你放开手挖，指甲翻了三根，挖出两丈深的洞，水忽然大了起来，冲了你满脸。那是一处地下暗河。你顺着暗河游了不知多远，最后从一处山涧里被冲出来，在石头上躺到天黑才能动。你的左耳从此听不太清，但你活着回来了。"},{"text":"顺着风走那条窄缝","effect":{"cult":75,"wealth":400,"mind":6,"mo":5,"luck":-3,"flagAdd":["地宫得藏"],"log":"地宫随风得藏"},"result":"你挤进那条缝，侧着身子挪了一整夜，衣服和皮都磨掉了。缝的尽头是一间没有塌的小室，供着一只铅盒，盒里是满当当的灵石和一卷来历不明的功法。你抱着盒子往回挤，挤到天亮才见到光。那功法你只敢看了一半。"},{"text":"原路凿开塌方，走回去","effect":{"cult":45,"fame":8,"mind":12,"lifespan":-6,"log":"地宫凿归"},"result":"你选择记忆里的来路。三张符全烧在碎石上，你用剑鞘当钎子，一寸一寸往外挪。第三天的夜里你凿穿了最后一层，爬出来时十根手指没有一根是好的。回头看那座山，它安静得像什么也没发生过。你从此不太爱进地宫。"}]},{"id":"d03_15","title":"道旁半石","weight":18,"once":false,"cond":{"realmMin":1},"text":"你走在官道上，脚背磕到半枚灵石，断口很新。附近没人，草很高。你蹲下，闻到极淡的血腥味。","choices":[{"text":"收起灵石，快些走","effect":{"wealth":15,"luck":2,"log":"道旁拾灵石"},"result":"你把那半枚灵石塞进袖袋，脚步没停。走出三里地，你听见身后有马蹄声经过，没往你这边看。晚上投店时你摸出灵石看了看，断口在灯下泛白。你忽然有点庆幸自己没多站一会儿。"},{"text":"顺着压平的草找一找","effect":{"wealth":40,"cult":10,"luck":3,"mind":2,"log":"道旁寻踪"},"result":"你拨开高草，找到一个被踩进泥里的布包，里面还有三枚完整的灵石和半块干饼。布包上绣着一个很旧的字，已经看不清了。你把干饼留在原处，石头带走。你不觉得这是善事，只觉得这样比较妥当。"}]},{"id":"d03_16","title":"巷口伤狸","weight":15,"once":false,"cond":{"realmMin":1},"text":"巷口有只灰毛狸猫，左前腿被咬穿了，趴在水边舔伤口。见你走近，它没跑。毛里混着几片细鳞。","choices":[{"text":"掏出伤药，替它包扎","effect":{"wealth":-10,"luck":4,"mind":3,"flagAdd":["救猫"],"log":"巷口救狸"},"result":"你用牙咬开药囊，给它上了药，又撕了半根布条。它全程没叫，只是盯着你看。你包扎完起身要走，它跟着你走了两条街，在一处墙根停下，抬头冲你叫了一声，然后钻进墙洞。第二天你家门口多了一只死老鼠。"},{"text":"把它抱去药庐","effect":{"wealth":-20,"mind":4,"luck":3,"rel":{"江晚舟":8},"log":"抱猫投药庐"},"result":"你把它抱到药庐，江晚舟正在晒药，接过去翻了翻伤口，说这是被灵兽咬的，肉里进了毒。他忙了半个时辰，把猫包成个粽子。他抬头问你，是你的？你说不是。他哦了一声，说那更要治了。"},{"text":"绕开它，不惹麻烦","effect":{"mind":-1,"luck":-2,"log":"绕开伤狸"},"result":"你绕过去了。走出七八步，身后那声音还在，不高不低。你没有回头。晚上坐在灯下，你想起那几片细鳞——那东西若是还在附近，狸猫死在巷口是迟早的事。你想了想，把窗关了。"}]},{"id":"d03_17","title":"破庙避雨","weight":16,"once":false,"cond":{"realmMin":1},"text":"雨来得没有道理，半炷香前还是大晴天。你钻进一间没挂牌子的旧庙，神像脸泡烂了。火边坐着一个人。","choices":[{"text":"坐到火边，烤干衣裳","effect":{"mind":3,"luck":2,"rel":{"顾长歌":6},"log":"破庙避雨"},"result":"那人往边上挪了挪，给你让出半块地方。你烤着袖子，他忽然开口说这雨要下到后半夜。你问他是谁，他说记不清了，反正明天雨停就走。第二天雨停，人没了，火堆还温着，旁边留着一枚烤得半焦的栗子。"},{"text":"冒雨继续赶路","effect":{"cult":12,"lifespan":-1,"luck":-2,"log":"冒雨赶路"},"result":"你冲进雨里。雨水灌进领口，顺着背脊往下走，冷得你每走十步就要打个哆嗦。走到城外时雨小了，你浑身湿透，却意外发现经脉里那股滞涩的感觉被冲开了些。你打了个喷嚏，觉得这笔账不亏。"},{"text":"对着烂脸神像拜了一拜","effect":{"mind":4,"luck":3,"cult":8,"log":"破庙拜神"},"result":"你在神像前站直，拱手拜了三下。火堆边那人抬眼看了你一眼，笑了一声，没说什么。雨下到半夜，你在角落里打了个盹。醒来时火还没灭，供桌上多了一只豁口的碗，碗里是清水。"}]},{"id":"d03_18","title":"夜市一碗面","weight":18,"once":false,"cond":{"realmMin":1},"text":"夜市灯火一盏盏亮起，油烟混着糖味。你在面摊前坐下，汤面上浮着两片薄肉。邻桌几个散修正吵得面红耳赤。","choices":[{"text":"先喝汤，听他们吵","effect":{"mind":3,"luck":2,"wealth":-2,"log":"夜市吃面"},"result":"汤确实好。你听了半炷香，三个人从剑鞘吵到师承，又吵到谁家山门的饭难吃，最后一致同意丹霞谷的伙食最好。你吃完面，他们还在吵。你放下面钱走了，心里想，修仙修到最后，大概也就是为了一碗热汤。"},{"text":"替他们判个胜负","effect":{"fame":4,"mind":2,"wealth":-2,"log":"夜市论剑"},"result":"你插了一句：剑鞘是给剑挡雨的。三个人同时看你。安静了两息，其中一个拍桌说有理，另一个说放屁，第三个把碗一推，说再上三碗面边吃边论。你被拉着坐了一炷香，面钱最后是那个说放屁的人付的。"},{"text":"多加一份肉，慢慢吃","effect":{"wealth":-6,"mind":5,"lifespan":1,"log":"夜市加肉"},"result":"你让老板娘又添了一份肉。她切得比刚才厚。你吃得很慢，把每根面都嚼完，连汤也喝干了。结账时她说你气色不好，是不是熬夜熬的。你说是。她叹了口气，多给了你半勺汤。这半勺汤你记了很久。"}]},{"id":"d03_19","title":"集市小贼","weight":15,"once":false,"cond":{"realmMin":1},"text":"集市上你腰间忽然一轻。回头时一个瘦小身影正往人堆里钻。那是个半大孩子，十三四岁，跑得快，脚步是瘸的。","choices":[{"text":"追上去，把孩子揪回来","effect":{"fame":5,"wealth":40,"mo":3,"log":"集市擒小贼"},"result":"你三步追上，一把扣住他的后领。他挣了两下没挣开，忽然不挣了，低头把荷包举起来。你松手时看见他脚踝上有一圈很旧的疤。你把荷包拿回来，数了数，一枚不少。他跑了，一瘸一拐，跑得很快。"},{"text":"不追，只喊一声","effect":{"fame":2,"wealth":-60,"luck":-1,"log":"集市失荷包"},"result":"你喊了一声小贼。人群骚动起来，那孩子混进人流，转眼没了。荷包没了，这个月的用度也没了。晚上你啃着干粮，忽然想起他脚上那圈疤，像是被什么捆过很久。你把最后一口干粮咽下去，不再想了。"},{"text":"追上去，分他一半灵石","effect":{"wealth":-30,"mind":5,"luck":3,"fame":3,"flagAdd":["济小贼"],"log":"集市济小贼"},"result":"你在巷口堵住他，抽出荷包，倒出一半灵石塞进他怀里。他整个人僵住了。你说，下次别在这条街偷，这街上的人会打断你的腿。他捏着灵石看了你很久，点了点头。半年后你在另一个城里，被人从背后叫住，是他。"}]},{"id":"d03_20","title":"街角半句准","weight":14,"once":false,"cond":{"realmMin":1},"text":"街角一张旧桌子，坐个瞎眼老头，旗上写着半句准。他抬手：过来，我说半句。他说：你这一生会死在——然后倒茶。","choices":[{"text":"坐下来，等他说完","effect":{"luck":3,"mind":3,"cult":10,"wealth":-10,"log":"半句准算命"},"result":"你坐下，等到茶壶见了底。他终于开口：你这一生会死在——我不知道的地方。你愣了半天，反应过来他在耍你。你给了钱，起身走。走出十步，他忽然在背后补了一句：但你今天别走西边那条巷子。你走了东边。"},{"text":"把茶钱放下就走","effect":{"wealth":-5,"luck":1,"mind":1,"log":"算命不留"},"result":"你放下几枚铜钱，转身走了。身后老头还在说，哎，我说半句你就走。你走你的。当夜西边那条巷子塌了半边墙，压死了两头驴。你第二天听说这事，站在街口站了很久，然后回去找那张桌子。桌子还在，人没了。"},{"text":"反问他：那你呢","effect":{"mind":4,"luck":2,"fame":2,"log":"反问算命人"},"result":"你反问他，那你这一生会死在哪儿。老头笑了一下，把手里的茶泼在地上，说：我早就死过了。他把旗子收起来，桌子扛在肩上走了。第二天你路过街角，地上还剩一点茶渍，摆摊的位置干净得像没人来过。"}]},{"id":"d03_21","title":"老丐半丹","weight":13,"once":false,"cond":{"realmMin":1},"text":"出城门一只手拽住了衣角。那是个老乞丐，没讨什么，从怀里摸出半颗黑乎乎的丹药塞给你，上面有牙印。","choices":[{"text":"不问缘由，含在舌下","effect":{"cult":25,"lifespan":3,"luck":4,"mind":3,"log":"含老丐半丹"},"result":"丹药在舌下化开，一股热气从喉咙直冲眉心，比你想的干净得多。你站了一会儿，觉得眼前的路都清楚了些。回头想问，老乞丐已经睡着了，打鼾打得很响。你把剩下的一点丹渣吐在掌心看，看不出名堂。"},{"text":"还给他，去买吃的给他","effect":{"wealth":-30,"mind":6,"luck":5,"fame":4,"flagAdd":["施粥济丐"],"log":"买食与老丐"},"result":"你把丹药放回他碗里，跑去街对面的铺子买了两个热馒头和一碗粥。回来时老乞丐睁开眼，看着馒头看了很久，然后掰了一半，递回给你。你接过来吃了。他没吃那半颗丹，揣回怀里，说留着下次。"},{"text":"收下丹药，但不吃","effect":{"cult":8,"luck":2,"flagAdd":["藏半丹"],"log":"收藏半颗丹"},"result":"你把丹药用布包好收进怀里，冲他拱手道了谢。老乞丐摆摆手，说你别谢我，谢你自己。你没听懂。三年后你在另一场生死边沿想起这半颗丹，含下去，救了你一条命。那时你才明白他说的是哪一句。"}]},{"id":"d03_22","title":"寄错的信","weight":14,"once":false,"cond":{"realmMin":1},"text":"信是驿站递来的，写着别人的名字，地址却是你住的院子。封口的火漆一碰就掉渣。伙计说，写信的人三年前就死了。","choices":[{"text":"拆开看","effect":{"cult":30,"mind":-3,"luck":2,"flagAdd":["错信"],"log":"拆阅错信"},"result":"信上只有五行字，是一份药方，末行写着：若我不回，给他。署名是你不认识的名字，收信人也不是你。落款日期是三年前，正是这一带乱过一阵的时候。你把药方抄了一份收起来，原信烧了。你不确定自己做得对不对。"},{"text":"原样送回去","effect":{"fame":3,"mind":4,"wealth":-10,"luck":3,"log":"退还原信"},"result":"你花了半天找到信上那个地址。院子已经空了，门上贴着封条，封条旧得发白。邻居说那家人在三年前全没了。你把信从门缝底下塞了进去。回来的路上你走得很慢。你觉得自己好像替谁办完了一件事。"},{"text":"按地址去问个清楚","effect":{"cult":40,"mind":5,"luck":5,"wealth":-20,"flagAdd":["追查错信"],"log":"追查错信"},"result":"你顺着地址找到了城外的一处荒宅，宅子里还留着半个药炉和几本没烧完的账簿。你翻到一页，上面记着三年前一批药材的来路，来路很不干净。你把账簿收好，退出来。这封信寄错人，或许不是寄错了。也许只是你们都没懂。"}]},{"id":"d04_01","title":"灶房里的师妹","weight":12,"once":true,"cond":{"realmMin":1,"realmMax":5,"flagNone":["识得苏婉儿"]},"text":"夜半路过灶房，小师妹苏婉儿蹲在灶台后，抱着半块桂花糕，竖指求你替她瞒下，说好明日给你蒸松子糖。","choices":[{"text":"替她把风，等她吃完","effect":{"rel":{"苏婉儿":18},"luck":3,"cult":20,"flagAdd":["识得苏婉儿"],"log":"灶房共分桂花糕"},"result":"你把门掩上，站在廊下听巡夜人的脚步近了又远。她吃得极快，末了掰下一角塞给你，自己先红了耳根，说是谢你半块糕。此后她见你总要绕过来喊一声师兄，喊得后山那片竹林里的鸟都认得你了。"},{"text":"板起脸，叫她去领罚","effect":{"fame":6,"contribution":10,"rel":{"苏婉儿":-5},"log":"夜半秉公罚师妹"},"result":"她愣了一瞬，把糕放回蒸笼，擦干净手，真去戒律堂外跪了半宿霜。第二日你从她身边过，她抬头看你一眼，没说话，眼睛却很亮。管事记了你一笔秉公，你心里却没由来地空了一角。"}]},{"id":"d04_02","title":"松子糖与闭关","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":5,"flagAll":["识得苏婉儿"]},"text":"苏婉儿抱着糖罐堵在洞府门口，说新丹方小成，想讨三日时辰，请你替她看火候。话未说完，传讯符纸烧在手心。","choices":[{"text":"推了闭关，去替她看火","effect":{"rel":{"苏婉儿":20},"cult":-40,"luck":4,"flagAdd":["与苏婉儿情深"],"log":"为她误了关期"},"result":"三日夜你在丹炉边添了七十四次炭，眼皮沉得压不住，只看她额前一缕汗。丹成的刹那她把手拍在丹炉上，烫出一点红，笑得像偷了整座山的糖。气机那段最厚的时候过去了，你没提，她也没问。"},{"text":"收下糖，说明日要闭关","effect":{"cult":90,"mind":5,"rel":{"苏婉儿":4},"log":"闭关中托人送炭"},"result":"她点点头，把糖罐往你怀里一塞就走了，走得极快。你入定七日，出关时罐子空了半截，底下压着一张纸条，写着火候的诀要，字迹很用力。听人说这七日灶上的炭，是她一筐一筐自己挑上山的。"},{"text":"只把诀要写给她，各自忙","effect":{"cult":60,"contribution":8,"rel":{"苏婉儿":8},"log":"一纸诀要赠师妹"},"result":"你伏案写了半个时辰，把看火的诀窍一条条写清，连炭该添几分都标了数。她捏着纸看了许久，说写得比戒律堂的玉简还仔细，然后抱着罐子跑了。那年冬天她炼成了第一炉好丹。"}]},{"id":"d04_03","title":"雨里练剑的师姐","weight":12,"once":true,"cond":{"realmMin":1,"realmMax":5,"flagNone":["识得沈青霜"]},"text":"暮雨忽至，人都散了，只剩沈青霜一人在演武场上出剑，一式重复了不知多少遍，雨水顺着下颌淌下。","choices":[{"text":"撑伞立在她身后","effect":{"rel":{"沈青霜":16},"mind":4,"cult":30,"flagAdd":["识得沈青霜"],"log":"雨中为师姐撑伞"},"result":"她收了剑才回头，看见是你，眉梢动了一下。她说雨水碍不住剑，可也没让你把伞收走。两人并肩走出演武场，一路没说什么，伞面往她那边偏了半寸，她装作没有看见。"},{"text":"收伞入雨，陪她练完","effect":{"rel":{"沈青霜":20},"cult":70,"mind":-3,"flagAdd":["识得沈青霜"],"log":"雨中同练至掌灯"},"result":"你踏进雨里，站到她身侧跟着出剑，招式笨拙，被她纠正了三次腕。她终于开口，说你腕太硬，心太软，两样都该练。雨停时两人浑身湿透，她把自己那半块干帕子丢给你，转身就走了。"},{"text":"悄然退开，不扰她","effect":{"cult":40,"mind":6,"rel":{"沈青霜":8},"log":"远远观剑悟一理"},"result":"你退到廊下看了半个时辰，看她把那式重复到雨都停了。你忽然明白了自己剑里缺的是什么，回去在自己的剑鞘上刻了一道浅痕。第二日演武场上她朝你这边看了一眼，什么都没说。"}]},{"id":"d04_04","title":"剑穗与旧伤","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":5,"flagAll":["识得沈青霜"]},"text":"沈青霜剑柄上缠着一截洗得发白的旧穗。你要出远门，她把你叫到崖边，递来一截新搓的青穗，针脚歪七扭八。","choices":[{"text":"接过，说替你系上","effect":{"rel":{"沈青霜":18},"mind":5,"cult":40,"flagAdd":["与沈青霜情深"],"log":"青穗系于剑柄"},"result":"你把旧穗解下来收进怀里，换上新的一截，打了个她看不懂的结。她盯了那个结片刻，说难看。你说牢。她低声说了句什么，崖上风大，你没听清，也没敢再问一遍。"},{"text":"问她的腕伤，塞药给她","effect":{"rel":{"沈青霜":14},"wealth":-80,"fame":3,"flagAdd":["与沈青霜情深"],"log":"千金买药医腕伤"},"result":"你绕到下三街，用几乎全部灵石换了一小盒续筋的膏。她不肯收，你便放在她门口的剑架上，转身走。第二日那盒子空了，剑架上多了一行极浅的刻字：不必。"},{"text":"还回去，说你不惯带饰物","effect":{"cult":70,"mind":4,"rel":{"沈青霜":-6},"log":"退还剑穗自修行"},"result":"你把穗子递还，说剑上挂东西碍事。她接过去，指腹在那道歪针脚上按了很久，然后收入袖中，说也是。此后她的剑柄上仍旧只有那截白得发旧的穗子，再没换过。"}]},{"id":"d04_05","title":"师兄的酒与真话","weight":12,"once":true,"cond":{"realmMin":1,"realmMax":5,"flagNone":["识得顾长歌"]},"text":"顾长歌翻墙进来，肩上搭着一坛酒，与你并坐屋顶。他笑得没心没肺，说了半宿胡话，笑里却像藏着事。","choices":[{"text":"陪他喝到天亮","effect":{"rel":{"顾长歌":18},"luck":5,"cult":-20,"flagAdd":["识得顾长歌"],"log":"屋脊对饮至天明"},"result":"那坛酒空了，他也没说什么正经话。天快亮时他把空坛子往山下一掷，说摔了才吉利。你次日修行时头晕得厉害，被戒律堂记了一笔。他听说后笑了半天，说值。"},{"text":"问他为何今夜不笑","effect":{"rel":{"顾长歌":16},"mind":6,"fame":3,"flagAdd":["识得顾长歌"],"log":"屋脊问师兄心事"},"result":"他愣住，说你会不会看人。沉默一阵，他说他有个同乡死在去年的围剿里，连尸首都没带回来，明日是忌日。说完又笑起来，说喝酒喝酒。你陪他把剩下的半坛喝完，这次他笑得比方才真。"},{"text":"推说功课未毕，请他自便","effect":{"cult":80,"mind":3,"rel":{"顾长歌":-4},"log":"闭门推却师兄酒"},"result":"他说行行行，就你正经，抱着酒坛跳下屋顶，落地时踉跄了一下，回头冲你摆手。你回屋打坐，心却静不下来。第二日听说他在酒肆里一个人喝到关店。"}]},{"id":"d04_06","title":"替你挡的一鞭","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":5,"flagAll":["识得顾长歌"]},"text":"外门演武，长老说你起手不正，鞭子当众落下。顾长歌横插一步硬吃了一记，散场后靠在你肩上说：欠我一顿酒。","choices":[{"text":"背他去药庐，一路应下","effect":{"rel":{"顾长歌":20},"wealth":-100,"cult":-30,"flagAdd":["与顾长歌情深"],"log":"背师兄赴药庐"},"result":"他比看着沉，压得你脊背发酸。药庐的江晚舟替他上药，看见那一鞭直摇头。回来的路上他说，其实那鞭他躲得开，只是躲了长老面上不好看。你脚步一顿，他说你别停，继续走。"},{"text":"替他上药，不问缘由","effect":{"rel":{"顾长歌":15},"mind":4,"cult":30,"flagAdd":["与顾长歌情深"],"log":"亲手为师兄上药"},"result":"你把他按在石凳上，用清水一点点洗净那道血痕。他背对着你，胡说八道了一路，说到一半忽然没了声。你抬头看，他正望着远处山门，说多谢，说了两个字就再没下文。"},{"text":"当场向长老认错，自领其罚","effect":{"fame":12,"contribution":15,"rel":{"顾长歌":8},"cult":-40,"log":"自领鞭刑换师兄"},"result":"你上前一步认下起手之误，长老的鞭子便落到了你身上。顾长歌在旁边骂了一声，被执事按住。散场后他一句话没说，只把药膏丢给你，自己走了，走得比平时慢。"}]},{"id":"d04_07","title":"药庐里的少年","weight":12,"once":true,"cond":{"realmMin":1,"realmMax":5,"flagNone":["识得江晚舟"]},"text":"你送药材到山下药庐。少年江晚舟坐在窗边拣药，指节很白。他说这批天麻受了潮，入药伤经脉，执事要挨罚。","choices":[{"text":"自掏灵石，重买一批","effect":{"rel":{"江晚舟":16},"wealth":-150,"fame":4,"flagAdd":["识得江晚舟"],"log":"自赔灵石换药材"},"result":"你去了下三街的药行，把受潮的换成了新货。江晚舟把退回来的旧药材一一晾在檐下，说阴干后仍可外用，不必全弃。他给你包了一小包安神的药，说夜里睡得沉些，不算钱。"},{"text":"留下字据，如实上报","effect":{"contribution":15,"fame":8,"rel":{"江晚舟":-3},"log":"如实上报药材事"},"result":"执事挨了罚，采买的路子也换了一遍。江晚舟没说什么，只是递药包的手停了停。后来药庐里新到的药材都干得极好，你知道那是谁的功劳，他一个字也没提过。"},{"text":"陪他把受潮的药材分拣","effect":{"rel":{"江晚舟":12},"mind":5,"cult":20,"flagAdd":["识得江晚舟"],"log":"药庐分药至深夜"},"result":"两人坐着挑了大半夜，他教你辨药材的成色，辨得细致。灯芯短了三次，他用那只旧伤的手替你把灯芯剪齐。临走时他说，你比药庐里所有人都坐得住。"}]},{"id":"d04_08","title":"替他试的药","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":5,"flagAll":["识得江晚舟"]},"text":"江晚舟请你过去。案上摆着一只小碗，药汁成色古怪。他说是给自己配的，试了六次，只为阴天里那只手不疼。","choices":[{"text":"先舀半勺，自己尝","effect":{"rel":{"江晚舟":20},"cult":-50,"mind":6,"flagAdd":["与江晚舟情深"],"log":"替他先尝苦药"},"result":"药入喉像吞了一把火。你压着翻涌的气息看了他半炷香，才说似乎能行。他冲过来探你脉，手抖得按不准。那方子后来成了，他那只手在阴天里终于能稳稳握住药杵。"},{"text":"劝他别再拿自己试药","effect":{"rel":{"江晚舟":14},"mind":8,"luck":4,"flagAdd":["与江晚舟情深"],"log":"劝他弃药护己身"},"result":"你说疼就疼，手还在，人得先活着。他听了很久，然后把那碗药倒进了沟里，洗净了碗。他说你说话像个不讲道理的长辈，可那天他第一次没在阴天里皱眉头。"},{"text":"替他求谷中丹师加一味","effect":{"contribution":-20,"rel":{"江晚舟":10},"cult":60,"flagAdd":["与江晚舟情深"],"log":"求丹师改药方"},"result":"丹师看在旧情分上改了方子，一味药换成了性平的引子，药效慢了三成，却不再呕人。江晚舟按着新方子重配，试到第九次才好。他说慢些也无妨，反正他有的是日子。"}]},{"id":"d04_09","title":"山门外的白影","weight":12,"once":true,"cond":{"realmMin":1,"realmMax":5,"flagNone":["识得姜雪璃"]},"text":"夜巡至后山断崖，你撞见一个白衣女子蹲在崖边剥妖兽的筋，说这畜生吃了山下三户人家，追了两日才了结。","choices":[{"text":"接过筋，替她掩去血迹","effect":{"rel":{"姜雪璃":16},"mo":5,"luck":4,"flagAdd":["识得姜雪璃"],"log":"崖边分筋掩行迹"},"result":"你把那半条筋收进袖里，又用崖边的枯草扫平了血迹。她说你们正道的讲究真多，语气里却没多少嘲意。临走时她说明夜还来，若你想见，就在崖边点一盏灯。你去了。"},{"text":"问她为何不问宗门便杀","effect":{"rel":{"姜雪璃":12},"mind":6,"fame":6,"flagAdd":["识得姜雪璃"],"log":"崖上质问魔殿女"},"result":"她笑了一声，问你那三户人家报案时，哪个正道宗门接了。你答不上来。她把匕首在袖上擦净，说你们讲规矩，我讲人命，谁也别嫌谁脏。你回山门时天已泛白，一路都在想这句话。"},{"text":"退开，上报执事","effect":{"contribution":20,"fame":8,"mo":-5,"rel":{"姜雪璃":-8},"log":"上报后山魔道踪"},"result":"执事当晚加了三班巡夜，后山清净了半月。半月后你在集市上擦肩而过一个白衣身影，她没看你，只留下一句：那三户人家的坟，是你宗门修的么。你站在原地，没答上话。"}]},{"id":"d04_10","title":"雪夜的一碗汤","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":5,"flagAll":["识得姜雪璃"]},"text":"大雪封山，你被困在半山破庙。庙门推开，姜雪璃带着一身风雪进来，拎着一只瓦罐，说商队翻车，她顺手捡的。","choices":[{"text":"把僧袍撕了给她裹膝","effect":{"rel":{"姜雪璃":18},"mind":4,"cult":40,"flagAdd":["与姜雪璃情深"],"log":"破庙分袍御风雪"},"result":"她盯着那半幅旧袍看了很久，终究没有推回来。她说不必这样，我说不定明日就杀你家的人。你说那明日再说。火堆噼啪响了一夜，两人都没睡，也没再多说什么。"},{"text":"问她为何不肯入正道","effect":{"rel":{"姜雪璃":15},"mo":6,"mind":-4,"flagAdd":["与姜雪璃情深"],"log":"庙中问魔女旧事"},"result":"她说她八岁那年被正道当妖物钉在桩上，是万魔殿的人拔的钉。她说这话时语气很平，像在说别人的事。你想说些什么，她把汤碗塞回你手里，说喝吧，凉了更苦。"},{"text":"守在庙中，不与她说半句","effect":{"cult":70,"mind":8,"mo":-6,"rel":{"姜雪璃":6},"log":"一夜枯坐各守本心"},"result":"你抱着剑坐在佛龛下打坐，她靠着柱子擦刀，两个时辰谁也没开口。天亮时她先走了，只在雪地上留下一行字：你比我见过的正道都硬。你看着那行字，直到雪把它填平。"}]},{"id":"d04_11","title":"旧恩在白芷","weight":12,"once":true,"cond":{"realmMin":1,"realmMax":5,"flagNone":["识得白芷"]},"text":"丹霞谷商队过山门。为首的女药女一眼认出你，说三年前你在乱葬岗背过她，喂了两旬解毒汤才活，她叫白芷。","choices":[{"text":"说不要还，请她喝口茶","effect":{"rel":{"白芷":16},"luck":5,"mind":4,"flagAdd":["识得白芷"],"log":"与旧识白芷叙旧"},"result":"你把商队引到山门外的茶棚，要了两碗粗茶。她捧着碗不喝，只顾着看你，像要把你看清。末了她说，那我先记着，记得越久越值钱。茶钱她抢着付了，用的还是谷里发的月钱。"},{"text":"请她替宗门看一批丹材","effect":{"contribution":25,"fame":6,"rel":{"白芷":10},"flagAdd":["识得白芷"],"log":"引白芷验宗门丹材"},"result":"她验得极细，指出三味药火候过了，当场退了货。管事的脸色不好看，她也不看人脸色。事后你被记了一功，她只说是还账，还得很痛快。"},{"text":"推说往事已远，不必再提","effect":{"cult":70,"mind":5,"rel":{"白芷":-6},"log":"故人相认未敢应"},"result":"她抱着药箱站了很久，说也是，三年了。商队走时她回头看了一眼，那一眼让你想起当年乱葬岗上的雨。你回屋打坐，那晚入定得极慢，慢得像有人在耳边数着什么。"}]},{"id":"d04_12","title":"守在床前的夜","weight":11,"once":true,"cond":{"realmMin":2,"realmMax":5,"flagAll":["识得白芷"]},"text":"你伤及经脉，昏了三日。醒来时天色未明，榻边有人抱着凉透的汤打盹，案上药布叠得极齐，那人还没察觉。","choices":[{"text":"装睡，把这一觉留给她","effect":{"mind":10,"cult":50,"rel":{"白芷":18,"江晚舟":8},"flagAdd":["与白芷情深"],"log":"醒时装睡留人安眠"},"result":"你闭着眼听完那碗汤被轻轻放下的声响，听完那人挪动身子重新坐直的动静，直到窗外泛起灰白。你才睁开眼，问守了多久。她说不久，然后扶着墙踉跄了两步。原来她自己的腕上还缠着药布。"},{"text":"先开口，谢这几日守候","effect":{"rel":{"白芷":16,"江晚舟":6},"mind":8,"fame":4,"flagAdd":["与白芷情深"],"log":"伤榻谢守夜之人"},"result":"她手一抖，那碗汤差点翻了，慌忙站起来替你垫高枕头，嘴上说着没什么，替人守夜本就是药女的活计。话说到一半自己停了，两个人都没接下去。窗外有鸟叫了一声，你忽然觉得伤处没那么疼。"},{"text":"取过汤碗，自己喝尽","effect":{"cult":40,"mind":4,"contribution":10,"rel":{"白芷":12},"flagAdd":["与白芷情深"],"log":"伤中饮尽冷药汤"},"result":"汤是苦的，凉透了更苦。你仰头喝完，把碗放下，说下次别等了，去睡。她盯着空碗看了一会儿，忽然笑，说你这人真没良心，白守了。说完收拾药布退了出去，脚步很轻。"}]},{"id":"d04_13","title":"庆典夜的同游","weight":11,"once":true,"cond":{"realmMin":1,"realmMax":5},"text":"宗门大典燃起满山长明灯，弟子都下了山。你独自立在灯下，身后一人说灯影里太孤单，问要不要同走一段。","choices":[{"text":"一同过桥看灯","effect":{"rel":{"苏婉儿":8,"沈青霜":8},"luck":6,"cult":30,"log":"庆典夜并肩过桥"},"result":"桥上人挤，你替那人挡了两回醉汉。那人买了两支糖葫芦，分你一支，自己那支吃到一半被人撞掉了，气得脸都鼓起来。回程时两人隔着一肩的距离走着，谁也没有加快脚步。"},{"text":"借口清静，独自折返","effect":{"cult":100,"mind":8,"rel":{"苏婉儿":-3},"log":"庆典夜独归入定"},"result":"你留那人一人在灯影里，转身踏上山道。山门的灯比山下暗得多，你入定了一夜，气机顺得罕见。次日听说那晚最后一场烟火，是整座城的人一起抬头看的。"},{"text":"改走僻静小巷，绕远路","effect":{"rel":{"苏婉儿":4,"顾长歌":4},"luck":4,"mind":5,"log":"小巷绕远话至夜深"},"result":"小巷里没有灯，只有两旁的窗透出暖黄。两人说了一路闲话，说的都是些不着边际的事。走到尽头时那人忽然停住，说这条路太长了些，然后自己先笑了，说回去吧。"}]},{"id":"d04_14","title":"并肩之后","weight":11,"once":true,"cond":{"realmMin":3,"realmMax":5},"text":"魔道夜袭退去，天色将明。你与同行之人背靠背坐在城垛上，那人忽然说，这样打下去，总有一次回不来。","choices":[{"text":"说那就一起回去","effect":{"rel":{"沈青霜":8,"顾长歌":8,"姜雪璃":8,"白芷":8},"mind":12,"cult":80,"log":"并肩之后约定同归"},"result":"那人重重应了一声，把手伸过来，你们用沾着血的手掌碰了一下，算是立约。回营的路上谁都没再提那句话，可此后每次出战，总有人会站在你身侧那半步的位置上，从没落空过。"},{"text":"把话咽下去，起身收剑","effect":{"cult":150,"mind":6,"mo":-5,"rel":{"沈青霜":4},"log":"话到嘴边咽回肚里"},"result":"你站起来收剑入鞘，说走吧。身后静了很久，才响起跟着起身的声音。那一年你的剑势进境极快，快到连自己都觉得心惊。有些话你知道它还在那儿，只是没有了说出口的时辰。"},{"text":"先替那人缠好伤口","effect":{"rel":{"沈青霜":6,"顾长歌":6,"江晚舟":6,"白芷":6},"fame":6,"cult":40,"mind":4,"log":"并肩战后缠伤裹甲"},"result":"你撕了自己的内衬替那人勒住肩上的口子，勒得很紧，那人疼得龇牙也没躲。缠完你才说，方才那句话，打完这仗再说。那人愣了愣，低头笑了一下，说好。"}]},{"id":"d04_15","title":"冬至的愿牌","weight":5,"once":true,"cond":{"realmMin":3,"realmMax":5,"flagAny":["与苏婉儿情深","与沈青霜情深","与姜雪璃情深","与白芷情深","与江晚舟情深","与顾长歌情深"]},"text":"宗门冬至，山门挂起红绸。有人在你洞府外站了半个时辰，捏着一块没写完的愿牌，终究敲了门，说有些话想问。","choices":[{"text":"接过愿牌，写完下半句","effect":{"partner":"苏婉儿","rel":{"苏婉儿":15},"mind":15,"fame":15,"log":"结为道侣共证长生"},"result":"你把那块木牌接过来，在「愿与」二字后面添了三笔，字迹被雪气浸得有点糊。那人凑过来看，看了很久，说写得真难看。你说是，但改不了了。那年山门的红绸，一直挂到了开春。"},{"text":"执手为誓，从此同行","effect":{"partner":"姜雪璃","rel":{"姜雪璃":15},"mo":6,"fame":8,"mind":10,"log":"与魔殿圣女结道侣"},"result":"你把掌心摊开，那人用指尖在你手心划了一横，说是万魔殿的誓，划开了就退不得。此事在两道之间喧嚷了许久，你一概不理。此后每逢月夜，山外总有人点一盏灯，你便出去，天亮方归。"},{"text":"婉拒，专心求道","effect":{"cult":220,"mind":12,"luck":-3,"rel":{"苏婉儿":-8,"沈青霜":-8,"江晚舟":-8,"白芷":-8,"顾长歌":-8,"姜雪璃":-8},"log":"婉拒情缘一心求道"},"result":"你说大道未成，不敢许人。那人点点头，说早料到了，把空愿牌挂在洞府外的梅枝上，转身走进雪里。那树梅当年开得极盛，你却在梅下坐了整整一夜，直到雪把肩头埋白。"}]},{"id":"d05_01","title":"经脉逆行","weight":11,"once":true,"cond":{"realmMin":2,"realmMax":6},"text":"闭关中真元忽然顺着经脉倒着爬回去，骨缝里像春冰在裂。石门从外头落了锁——是你自己下的令。","choices":[{"text":"咬破舌尖，强行镇压","effect":{"cult":180,"mind":8,"lifespan":-20,"flagAdd":["经脉有损"],"log":"强压走火入魔"},"result":"你咬穿舌尖，一口血喷在丹田上，硬生生把逆流的真元一寸寸掰回正道。三日三夜你汗湿了两层蒲团，出关时左手指节还是发颤。修为涨了一截，可你心里清楚，有几条经脉从此是补不回原样的了。"},{"text":"散功保命，任它退去","effect":{"cult":-120,"mind":12,"luck":4,"log":"散功自保"},"result":"你松开神念，任那口真元倒卷出体外。洞府里刮起一阵小风，吹落了半墙经卷。你境界退了半层，可神台前所未有的干净，连呼吸都比从前轻。有人在门外问出了什么事，你说无妨，只是关了一场没成的关。"},{"text":"反其道行，顺它走完","effect":{"cult":300,"mo":12,"lifespan":-10,"flagAdd":["经脉有损"],"log":"逆行周天求险功"},"result":"你索性把周天倒着行了一遍。浑身的血像是被人从脚底往头顶抽，疼得你睁不开眼，疼过之后却有一种极陌生的畅快。境界确实上了一层，可你从此每次入定，都有一缕不属于你的念头在旁边静静看着。"}]},{"id":"d05_02","title":"幻境中的旧人","weight":11,"once":true,"cond":{"realmMin":2,"realmMax":6},"text":"你站在雨后泥路上，庙口蹲着个人，低头搓草鞋带子，抬头问你当年为什么没回头。那口型，和记忆里一模一样。","choices":[{"text":"走进去，正面认下当年","effect":{"mind":12,"cult":60,"luck":-3,"flagAdd":["心魔已斩"],"log":"幻境中认下旧债"},"result":"你在泥地里坐下，一五一十地把当年说给他听，说到口干。他听完只笑了笑，草鞋带子始终没系好。等你再抬眼，庙也没了，路也没了，只剩自己盘在蒲团上。心口那块压了很多年的石头，似乎轻了一点。"},{"text":"抬手一剑，劈了幻境","effect":{"cult":120,"mind":-8,"mo":8,"log":"一剑劈碎旧影"},"result":"剑光落处，泥路、土地庙、草鞋带子一齐碎成飞灰。你听见一声极轻的叹息，像是从很远的地方来。洞府里剑痕划进石壁三寸。往后你的剑更快了，可每到雨夜，你总觉得自己还站在那条泥路上。"},{"text":"退出定境，不再看他","effect":{"mo":-10,"mind":5,"cult":-40,"log":"避过心魔一劫"},"result":"你收神出定，把这段景当作战场上的烟，散了就是散了。之后数日你于定中再未见过他。有人问你闭关如何，你说一般。只有你自己知道，你是绕着走的，绕得比当年那一步还要快。"}]},{"id":"d05_03","title":"仇人跪在你面前","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":6},"text":"你把他从废墟里拎出来，他还在笑。屠镇的是他，如今跪在焦土上求个痛快。你掌心真元，暖得像刚出炉。","choices":[{"text":"一掌了结这段旧账","effect":{"cult":100,"mo":15,"fame":-8,"flagAdd":["手染血仇"],"log":"手刃仇人"},"result":"你没有用剑，只一掌按在他天灵上。他的笑没来得及收。焦土上多了一个不深不浅的坑。办完这件事，你回身走了很远才发觉自己一直握着拳。此后你的名声里多了一句评语：此人记仇，且不打算忘。"},{"text":"废他修为，留他一条命","effect":{"cult":60,"mind":10,"fame":15,"mo":-8,"log":"废仇人修为"},"result":"你按住他丹田，把那点修了半生的东西一点一点碾碎。他叫得很难听，你听着听完。末了你说，活着比死长，你慢慢还。他瘫在土里，此后是个凡人。你不觉得自己宽厚，只是不想让他死得那么干净。"},{"text":"松开手，转身就走","effect":{"mind":12,"mo":-10,"fame":-12,"luck":3,"log":"放下旧账"},"result":"你把手里的真元散了，暖意从指缝漏走。他愣在原地，以为你还要回头，你没有。往后数年你偶尔听见他的消息，卖过炭，也讨过饭。你不去打听。放下一桩仇，比报一桩仇要难得多，你算是懂了。"}]},{"id":"d05_04","title":"血祭之法","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":6},"text":"洞里多了一块玉简，是血祭之法：以活人精血为引，可换一次跃升。义庄押着战俘，等你一句吩咐。","choices":[{"text":"依玉简行事，取血为引","effect":{"cult":280,"mo":15,"fame":-20,"mind":-10,"flagAdd":["血祭之秘"],"log":"行血祭之法"},"res
