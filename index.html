ult":"义庄那一夜烧了整整两个时辰的火，火很旺，谁也没敢多问。你的修为确实跃了一层，快得连自己都陌生。玉简被你把玩到起了一层包浆。往后你路过义庄，总要绕开那面墙，尽管墙上什么也没有。"},{"text":"封了玉简，战俘交还","effect":{"fame":20,"mind":8,"mo":-12,"flagAdd":["血祭之秘"],"log":"封简还俘"},"result":"你用宗门封禁把玉简锁进藏经阁最下一层，又把十一名战俘尽数送还血煞门，一个不多一个不少。门中有人骂你迂，你没辩。封禁落下的那一刻，你听见玉简里一声极细的碎裂声，像是里头的东西终于死了。"},{"text":"当众毁简，放人自去","effect":{"fame":10,"luck":6,"cult":-40,"mo":-15,"log":"毁简放俘"},"result":"你当着守庄弟子的面把玉简碾成粉，又开了铁链，任那十一人各自散去。有人回头看你，眼里全是不解。你只说了一句：他们不欠我。那天夜里你入定很浅，梦里却安静。"}]},{"id":"d05_05","title":"镜中人","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":6,"moMin":25},"text":"出关净面，盆里的人还是你的眉目，眼底沉着一线赤色。你笑了一下，水里的人慢半拍才笑。末页写着：魔功大成。","choices":[{"text":"认下这条路，继续走","effect":{"cult":240,"mo":15,"mind":-12,"flagAdd":["魔功大成"],"log":"认下魔功之路"},"result":"你把那页纸撕下来烧了，从此不再抄。此后你出手一次比一次快，也一次比一次不像你自己。有回同门被你顺手一击震退，爬起来还替你解释说是你收手不及。你听着，没有纠正。"},{"text":"自缚三日，以清水洗魔性","effect":{"cult":-80,"mo":-14,"mind":12,"lifespan":-30,"log":"自缚洗魔性"},"result":"你封了自己的经脉，在冰泉里坐了三天三夜。第三夜你疼得咬破了嘴唇，水里那点赤色终于散了。修为退了不少，人也虚，可你照镜子时敢多看两眼了。出来时有人递给你一碗热汤，你接得手有点抖。"},{"text":"打碎铜盆，把功法封了","effect":{"cult":-40,"mind":10,"luck":5,"flagDel":["魔功大成"],"log":"碎镜封功"},"result":"铜盆碎在地上，水淌了一地，那本手抄本被你压进石匣、灌了铅，沉进后山潭里。修为停在原地不动了。往后你再没想起过那一页的诀要，只在偶尔做梦时，看见水面上有个人比你慢半拍。"}]},{"id":"d05_06","title":"正道的包围","weight":10,"once":true,"cond":{"realmMin":2,"realmMax":6,"moMin":40},"text":"山门外来了三百余人，请你下山自证。风里那点铁锈味是从你身上散出来的，洗过三遍也压不住。","choices":[{"text":"开山门，当众自证","effect":{"fame":20,"mind":12,"lifespan":-20,"cult":-60,"log":"当众自证清白"},"result":"你敞开门，解开中衣，让人看清胸口那道被强行压下的黑色脉络。有位丹修上前验了半日，最后拱手说冒犯。三百人退得干干净净。你回身时腿一软，扶着门框站住，没人看见。那点气息从此淡了，代价是你有半年提不起剑。"},{"text":"杀出重围，不与多说","effect":{"cult":200,"mo":15,"fame":-20,"flagAdd":["与正道为敌"],"log":"杀出正道重围"},"result":"你从山门一路打下山，血溅在自己的石阶上。身后有师弟在喊你的名字，喊到第二声就断了。三日后你站在另一条山道上，回头看，七家宗门的旗还在风里，而你已经没有回去的地方了。"},{"text":"自断一脉，换他们退去","effect":{"fame":20,"mo":-15,"cult":-180,"mind":10,"lifespan":-20,"log":"自断魔脉退敌"},"result":"你当众剖开左腕，把那条藏魔气的脉络整根抽了出来，扔在石阶上。血淋淋地跳了两下才死。三百人面面相觑，最后退了。你抱着手腕坐在门槛上，师兄弟围过来，谁都不敢碰你。"}]},{"id":"d05_07","title":"魔道传承","weight":8,"once":true,"cond":{"realmMin":3,"realmMax":6,"moMin":50,"fameMax":200},"text":"你被追到绝壁上，崖底是瘴气。石缝里坐着个黑袍人，自称罗睺，问你要不要传承。他不看你，只看你身后的火。","choices":[{"text":"接下传承，换一次活路","effect":{"cult":260,"mo":15,"mind":-10,"fame":-20,"flagAdd":["罗睺之传","魔道中人"],"log":"受罗睺传承"},"result":"黑袍人把手按在你额上，一股冰凉的东西顺着脊骨淌下去，走到哪里，哪里的旧伤就好了。追兵的火把在崖下烧了一夜，没敢上来。天亮时石缝里只坐着你一个人，你在心里数了数，自己还剩几分像从前。"},{"text":"拒绝传承，背水一战","effect":{"cult":120,"mind":12,"fame":15,"mo":-12,"luck":-3,"log":"拒传承背水一战"},"result":"你摇头，从石缝里走出来，站在悬崖最外的一块石头上。追兵上来时，你已经把最后一点真元压进了剑里。这一战打到日头偏西，你浑身是伤地站着，他们抬着死人下去。黑袍人始终没再出声。"},{"text":"只借他一线气息脱身","effect":{"mo":10,"cult":90,"fame":-8,"flagAdd":["罗睺之传"],"log":"借魔息脱身"},"result":"你说只要一线，多的不要。他笑了，指间漏出一缕黑气绕上你的脚踝，你借着它从瘴气里滑了下去，落地时连衣角都没破。这一缕气息你后来一直没舍得清。它很轻，却总在半夜里往你心口爬。"}]},{"id":"d05_08","title":"月圆之厄","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":6,"moMin":45},"text":"月亮要圆了。你咬死过一头鹿。今夜指节发痒，铁链早挂上梁，地上拖出人形磨痕。门外有人来送饭。","choices":[{"text":"让同门把自己缚在梁上","effect":{"mind":12,"mo":-12,"fame":15,"cult":-80,"lifespan":-20,"log":"月圆自缚"},"result":"你让人把铁链收紧，锁上三道，钥匙扔到院外。送饭的小弟子吓得一直抖，你还是让他锁了。天亮后你浑身是伤，铁链被咬出两排深痕，但院里的人一个都没伤着。此后他们叫你，声音里多了一点敬。"},{"text":"独自进山，等那一夜过去","effect":{"mo":-8,"cult":120,"luck":-4,"log":"独自入山避月"},"result":"你一个人进了深山，在一处无人的石洞里坐了整夜。醒来时洞壁上全是抓痕，指甲翻了四片。修为反倒涨了些，像是心魔替你练了一夜。你走到溪边洗手，洗了很久。"},{"text":"不管它，凭修为硬扛","effect":{"mo":15,"cult":160,"fame":-12,"luck":-5,"log":"硬扛月圆失控"},"result":"你留在屋里，任那股东西在经脉里冲撞。屋顶被掀了半边，隔壁院墙倒了一堵，两个人挨了你的掌，一个断了腿。第二日你提着药去看，他们摆手说无碍，眼神却总往你手上瞟。"}]},{"id":"d05_09","title":"道心一问","weight":9,"once":true,"cond":{"realmMin":3,"realmMax":6},"text":"你站在无水的渡口上，浮着一只空船。船头坐着个披蓑衣的人，问你修仙为了什么。你答不上来，船沉了一寸。","choices":[{"text":"答：为长生久视","effect":{"cult":200,"mind":6,"luck":3,"lifespan":-10,"log":"答以长生"},"result":"你说要活得更久一些，久到能看尽这世上的春秋。他点点头，把船桨推给你，说那你划吧。你划了很久，水面一直没有对岸。醒来时修为涨了一大截，可你忽然觉得年岁这个东西，比从前沉。"},{"text":"答：为不被人踩在脚下","effect":{"mo":12,"cult":180,"mind":-10,"fame":-10,"log":"答以不被人踩"},"result":"你说得很直，说完自己也愣了。他沉默片刻，笑了一声，说这个答复最省事。蓑衣下伸出来的手往你肩上拍了一下，力道很重。此后你练功比谁都狠，狠到同门敬而远之，你也确实再没被人踩过。"},{"text":"答：为不再看着人死","effect":{"mind":12,"mo":-12,"cult":100,"fame":10,"log":"答以护人"},"result":"你说完这句，船忽然平了。他把蓑衣掀开一角，底下空无一人，只有一船的月光。醒来时你坐在蒲团上，眼眶有点热。此后你出手总先看旁人，慢半分，却再没走岔过道心。"}]},{"id":"d05_10","title":"魔气救人","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":6,"moMin":20},"text":"山道上躺着送药少年，半边肩膀被妖兽掏开。你掌心那门法子极快，只是黑气一入体便洗不干净。","choices":[{"text":"以魔气封脉，先救活他","effect":{"mo":12,"fame":15,"mind":5,"cult":-40,"log":"以魔气救少年"},"result":"黑气从你掌心钻进他的伤口，血立刻止住了。他醒来第一句话是问药送到了没有。你把他背回村里，转身时听见他在后头小声说谢谢。此后你偶尔会收到一篮不知谁放的野果，果子上总带着一点土。"},{"text":"以寿元换他一线生机","effect":{"lifespan":-30,"mind":10,"fame":20,"mo":-8,"log":"舍寿元救少年"},"result":"你把手按在他心口，一寸一寸把自己的生机渡过去。渡完你坐在地上站了很久才起来，鬓角白了一小片。他活下来了，养了三个月又能挑药筐。你说不出这笔买卖值不值。"},{"text":"先封他伤口，再背去药庐","effect":{"cult":-80,"fame":10,"mind":6,"mo":-5,"luck":4,"log":"负伤行四十里"},"result":"你用最笨的法子压住他的血，背起来就跑。四十里山路，你跑到鞋底开了胶，到了药庐人已经说不出话。他活下来了，你的修为误了一截，可那天夜里你睡得极沉，什么梦都没有。"}]},{"id":"d05_11","title":"仇家上门","weight":10,"once":true,"cond":{"realmMin":1,"realmMax":6},"text":"来人腕上血色护腕，自称血煞门执事。他一手按在你家柴门上，门板裂了道缝。你娘在蒸馍，隔窗喊你吃饭。","choices":[{"text":"出村十里，与他了断","effect":{"cult":160,"mo":12,"fame":-10,"flagAdd":["血煞门之仇"],"log":"杀血煞门执事"},"result":"你把他引到村外十里的乱葬岗。半个时辰后你一个人回来，袖口沾了些洗不掉的东西。当夜你连夜把家搬走，没跟娘说清缘由，只说换个地方住。此后血煞门的名录上多了你一笔。"},{"text":"认下旧账，卸他一条手臂","effect":{"cult":80,"mind":8,"fame":12,"lifespan":-10,"flagAdd":["血煞门之仇"],"log":"自罚一臂平仇"},"result":"你先递上自己的左臂让他砍一刀，再卸了他一条手臂，两清了。他走的时候脸色很难看，什么也没说。你回屋吃饭，娘问你手怎么在滴血，你说切菜。饭还是热的。"},{"text":"当场拿下，押去宗门换赏","effect":{"fame":18,"contribution":40,"cult":60,"wealth":150,"flagAdd":["血煞门之仇"],"log":"生擒血煞门执事"},"result":"你只用了三招就把他按在自家门槛上，用的是剑背。宗门来人验过血煞门的腰牌，赏了你一笔灵石。消息传得快，仇家的仇家也记下了你。"},{"text":"放他走，记下这笔账","effect":{"mind":6,"luck":4,"fame":-15,"flagAdd":["血煞门之仇"],"log":"纵仇家归山"},"result":"你说今日不便，让他改日再来。他走得很快，临走回头看了你家屋顶一眼，那一眼让你后颈发凉。村里人说你怂，你没解释。你只是连夜磨了一遍剑。"}]},{"id":"d05_12","title":"同门之死","weight":10,"once":true,"cond":{"realmMin":1,"realmMax":6,"sect":["青云剑宗","丹霞谷","天音阁","万魔殿","散修联盟","合欢宗"]},"text":"戒律堂的钟敲了三下。溪涧里捞上一具尸首，喉间剑伤正合你惯用的一式。那夜你出山门，无人作证。","choices":[{"text":"呈出那夜的药方自证","effect":{"fame":15,"mind":8,"cult":-60,"flagAdd":["洗清嫌疑"],"log":"以药方自证"},"result":"你从怀里摸出一张揉皱的药方，是那夜去镇上给江晚舟抓的。药铺的伙计被请来对了笔迹。堂上静了很久，最后长老挥手让你退下。你走出戒律堂时腿有些软。真正的凶手，还在山上。"},{"text":"不辩，等他们自己查","effect":{"fame":-10,"mind":10,"contribution":-30,"lifespan":-20,"flagAdd":["洗清嫌疑"],"log":"自请禁闭待查"},"result":"你说查就是了，我等你查清。你把佩剑解下来放在堂上，自己去了思过崖。三月后真凶落网，是外门一个借你招式栽赃的人。长老亲自来崖上接你，你瘦了一圈，看人的眼神比以前静。"},{"text":"出剑逼开众人，独走","effect":{"sectLeave":true,"mo":12,"fame":-20,"cult":120,"flagAdd":["叛出宗门"],"log":"剑逼戒律堂"},"result":"你拔剑在堂前画了一道线，说谁过线谁死，然后一步不退地走了出去。身后有人在骂，有人在哭。你下山时回头望了一眼山门上的匾，看了很久，还是走了。"}]},{"id":"d05_13","title":"灭门之夜","weight":9,"once":true,"cond":{"realmMin":1,"realmMax":6,"flagAny":["血煞门之仇","罗睺之传","魔道中人","与正道为敌","手染血仇"]},"text":"东厢烧起来，血煞门来得又快又静。苏婉儿被梁柱压住腿，江晚舟已昏过去。火苗舔着门槛，你只来得及进出一次。","choices":[{"text":"背起苏婉儿冲出去","effect":{"rel":{"苏婉儿":25},"cult":-40,"fame":10,"mind":-8,"lifespan":-20,"flagAdd":["灭门余生"],"log":"火中救出苏婉儿"},"result":"你把她从梁下拖出来背上，一路上她的指甲掐进你肩膀。冲到院外时你回头看了一眼，右厢的屋顶已经塌了。此后很多年，她见你都笑得很大声，只有提到那一夜的时候不笑。"},{"text":"背起江晚舟冲出去","effect":{"rel":{"江晚舟":25},"cult":-40,"fame":10,"mind":-8,"lifespan":-20,"flagAdd":["灭门余生"],"log":"火中救出江晚舟"},"result":"你把他架在肩上时他还在发烫，一路没醒。出了火场你跪在地上替他拍背，他咳出一口黑烟。后来他给你煎了三年的药，从不提那一夜。你也从不敢问另一间屋里的事。"},{"text":"先灭火，两个都试一次","effect":{"fame":20,"lifespan":-30,"cult":-120,"luck":5,"flagAdd":["灭门余生"],"log":"火中往返两趟"},"result":"你以真元震塌半面墙隔断火势，先拖出苏婉儿，再折回去把江晚舟抱了出来，衣角烧掉了半幅。人是都活了，你的气海被火烧过一次，从此再没满过。你坐在焦土上，手一直抖。"}]},{"id":"d05_14","title":"断臂之厄","weight":8,"once":true,"cond":{"realmMin":2,"realmMax":6,"flagAll":["血煞门之仇"]},"text":"追兵把你堵在断崖石洞里，护山符烧到最后一张。你左臂被血刃削开，白骨露在外头。洞外的火把照了过来。","choices":[{"text":"自断左臂，从后崖走","effect":{"lifespan":-20,"fame":-10,"cult":-100,"mind":12,"flagAdd":["断臂"],"log":"自断左臂逃生"},"result":"你一口咬住剑柄，把左臂齐肘斩了，血喷在崖壁上。后崖是一条只有山羊走的路，你单手攀了一夜。天亮时你在溪边洗伤口，水是红的。断口愈合后你试着再握剑，握了三个月才握稳。"},{"text":"死守洞口，等他们进来","effect":{"death":"力竭战死于断崖石洞","lifespan":-10,"fame":12,"log":"断崖死战"},"result":"符烧完的那一刻，你把剑横在洞口。对方涌进来的时候你数了数，一共十一个。你换掉了四个，剩下的七个费了很久才把你按住。你最后看见的是洞顶那线天光。"},{"text":"吞丹强提，杀出一条路","effect":{"cult":60,"mo":12,"lifespan":-30,"fame":-8,"luck":-4,"flagAdd":["断臂"],"log":"强提修为突围"},"result":"你把最后一颗保命丹整颗咬碎吞了，药力烧得你耳朵嗡嗡响。你从洞口一路杀到山下，左臂是保住了，人是废了一半，此后每到阴雨，整条手臂都使不上劲。"}]},{"id":"d05_15","title":"寿元将尽","weight":8,"once":true,"cond":{"realmMin":2,"realmMax":6},"text":"你在铜镜里数新添的白发，数到第七根停住。寿元将尽，不过数载。案上那味燃寿的猛药，还在等你。","choices":[{"text":"燃尽余年，强冲一层境界","effect":{"cult":300,"lifespan":-30,"mind":-10,"mo":10,"flagAdd":["燃寿冲关"],"log":"燃寿冲关"},"result":"你把猛药含在舌下，任那点生机烧成冲关的柴。境界确实过了，你出关那天桃花全落了。剩下的日子不多，但足够你把剑再练得更狠一点。铜镜里的白发，你没再数过。"},{"text":"服旧丹养神，不再强求","effect":{"mind":12,"mo":-12,"cult":-80,"luck":5,"log":"服丹养神"},"result":"你服了那枚旧丹，把猛药倒进了炉子里。此后你每日扫院、煮茶、看桃树，气海虽未满，人却前所未有的松。有人说你认命了，你笑笑，把没写完的信接着写完了。"},{"text":"把余下几年全教给弟子","effect":{"fame":20,"contribution":60,"mind":8,"cult":-40,"lifespan":-20,"log":"传道授业"},"result":"你把内外两门的功课从头讲了一遍，讲到第三个月，膝下跪了十七个人。你把自己走过的弯路一条条画在地上，画得满院子都是。第二年春天，有两个孩子过了你卡了很多年的那道关。"}]},{"id":"d05_16","title":"替人挡下","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":6},"text":"宗门大比上，那记黑砂是冲沈青霜去的。她肩胛的旧伤露在外头。你离她三步，那半张符只护得住自己。","choices":[{"text":"侧身挡下这一记","effect":{"rel":{"沈青霜":25},"fame":20,"lifespan":-20,"cult":-60,"flagAdd":["护道之谊"],"log":"替沈青霜挡砂"},"result":"黑砂尽数打在你左肋上，你退了两步没倒，血从嘴角压不住地往下淌。她回身扶住你，手很凉，只说了一句“记下了”。此后她练剑时再多留一分力，是替你留的。"},{"text":"推她一把，自己退开","effect":{"rel":{"沈青霜":15},"fame":5,"cult":40,"luck":3,"log":"推她闪过黑砂"},"result":"你抢上一步把她推开，自己借着反力侧翻出去，黑砂擦着你的衣角钉进石台。她落地后看了你一眼，什么也没说，下一轮把对面那人的剑打落在地。这一眼你记了很久。"},{"text":"以符自保，任她挨这一记","effect":{"cult":80,"fame":-20,"mind":-12,"rel":{"沈青霜":-20},"log":"看台上袖手"},"result":"你捏碎了符，黑砂在你身前半尺散了。沈青霜被扫下擂台，肋骨断了三根，抬下去时没看任何人。赢是赢了，看台上的嘘声你听得清楚。此后宗门里提起你，总要先停顿一下。"}]},{"id":"d05_17","title":"宗门危难","weight":8,"once":true,"cond":{"realmMin":2,"realmMax":6,"sect":["青云剑宗","丹霞谷","天音阁","万魔殿","散修联盟","合欢宗"]},"text":"山门钟自鸣，护山大阵破了。血煞门的人已经摸上来。苏婉儿抱着经书往后山跑，跑一步回一次头。","choices":[{"text":"守山门，与长老并肩","effect":{"death":"守山门不退，与阵同碎","contribution":80,"fame":20,"log":"守山门殉道"},"result":"你把剑插在山门正中，站在那一道线上没有退。长老在你左边倒下的时候，你还在挥剑。护山大阵最后一线灵光散尽，门楼上那块匾砸了下来。"},{"text":"护着藏经阁先走","effect":{"contribution":60,"fame":15,"cult":-80,"lifespan":-20,"flagAdd":["护经之功"],"log":"背经卷走北道"},"result":"你把苏婉儿怀里的经卷接过来背在身上，一路砍断了两处索桥，赶在天亮前把人和书都带到了北道的别院。山门丢了，可藏经阁一卷没少。清点的时候你才发现自己后背上插着一支断箭。"},{"text":"散掉修为，震退来敌","effect":{"cult":-200,"fame":20,"mind":8,"contribution":30,"lifespan":-20,"log":"散功退敌"},"result":"你把半生修为压在掌上，一掌拍在断龙石上。石碎、阵起、血煞门的人被生生逼退三里。你自己跌坐在碎石里，气海空得发疼。此后你还是那个你，只是出手时要先看对方几眼。"},{"text":"趁乱脱身，独自下山","effect":{"sectLeave":true,"fame":-20,"mo":8,"wealth":200,"luck":4,"log":"乱中下山"},"result":"你从西边的狗洞钻了出去，走的时候怀里多了些原本不属于你的东西。山在身后烧了三天。三年后你路过此地，山门重修了，匾是新的，守门的不认得你，还是叫你一声道友。"}]},{"id":"d05_18","title":"识海之争","weight":8,"once":true,"cond":{"realmMin":3,"realmMax":6},"text":"你坐在灰白水面上，对面站着个人，穿你的衣服，长你的脸，语气比你慢。他说这身子住得舒服。","choices":[{"text":"以道心将他困在识海","effect":{"mind":-8,"cult":220,"mo":8,"flagAdd":["识海有痕"],"log":"识海镇夺舍者"},"result":"你在识海里与他纠缠了七天七夜，最后把他按进最底下那层。他挣不脱，就骂你，骂得很难听。你出来时修为涨了，人也沉了。此后你偶尔会在不认得的路上，想起一些不是你的事。"},{"text":"让出一角，引他入瓮","effect":{"cult":120,"mo":12,"mind":-5,"flagAdd":["识海有痕"],"log":"诱斩夺舍之魂"},"result":"你故意在识海里留了一道缝，引他钻进当年天音阁镇魂曲的残篇。等他明白过来，曲子已经响了。他散得很干净，连一句狠话都没留下。你收功时手指冰凉，像是刚从深水里捞出来。"},{"text":"与他谈，各让一半","effect":{"mo":15,"cult":250,"fame":-10,"lifespan":-20,"flagAdd":["识海有痕"],"log":"与夺舍者共处"},"result":"你们谈了很久，最后定下各据一半。他的见识确实比你的老，很多东西他一点你就通。只是从那天起，你笑的时候总要慢半拍，像是先问了谁一句。"}]},{"id":"d05_19","title":"旧人之叛","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":6},"text":"那笔灵石是你交他保管的，匣子还在，锁也完好，里头空了。他没跑，坐在门槛上等你，说他妹妹要换一条命。","choices":[{"text":"当众揭破，送他去戒律堂","effect":{"fame":15,"mind":6,"cult":-40,"lifespan":-10,"wealth":-80,"log":"揭破旧人之叛"},"result":"你把空匣子拎到戒律堂前，一句话没说。他被拖走时没有看你。那笔灵石追不回来了，你倒贴了八十去堵他妹妹的窟窿。有人说你狠，也有人说你软，两边都不算错。"},{"text":"把证据烧了，让他自己看","effect":{"fame":-5,"mind":10,"rel":{"顾长歌":12},"log":"烧掉证据"},"result":"你当着他的面把账册投进炉子，火苗窜起来，映着他一张惨白的脸。你只说了一句：下次别找我。他后来把那笔灵石连本带利还了两回。你收了第一回，第二回退回去了。"},{"text":"假装不知，反过来设局","effect":{"cult":160,"mo":12,"mind":-10,"fame":8,"log":"设局反用旧人"},"result":"你什么也没提，还多给了他一份差事。半年后那个局收网，牵连出三个吃里爬外的人。他跪在你面前磕头，磕出血来了。你让他起来，说以后办事小心些。"}]},{"id":"d05_20","title":"天劫提前","weight":7,"once":true,"cond":{"realmMin":3,"realmMax":6},"text":"云压下来，护劫的符阵还差三成没布完。紫雷落下时，你才想起日子本该在三月后。风里已有焦味。","choices":[{"text":"以魔念引开主雷","effect":{"mo":15,"cult":220,"luck":-5,"lifespan":-20,"flagAdd":["雷劫余伤"],"log":"魔念引雷"},"result":"你把心口那点黑色的东西逼出来，迎着第三道雷抛上去。雷在半空炸开，把整片林子烧成焦炭。你活下来了，代价是自此之后，你的气息里多了一点连自己都闻得出的味道。"},{"text":"散掉一半修为，卸去劫力","effect":{"cult":-200,"lifespan":-30,"mind":10,"fame":-5,"log":"散功卸劫"},"result":"你把自己的修为撕下一半扔进雷云里，像是扔出一块肉喂狗。剩下的雷落在身上时已经轻了很多。劫过了，你坐在焦土上，看着自己一双发抖的手，境界退回了三年前。"},{"text":"开识海，以身承雷","effect":{"death":"硬承九雷，形神俱灭","mind":12,"fame":15,"log":"以身承雷"},"result":"你解开所有禁制，把神念整个敞在雷云底下。第九道雷落下时，山巅的石头都化成了琉璃。有人后来说，那一夜天上亮得像白天，照了整整一炷香。"}]},{"id":"d05_21","title":"旧识求救","weight":9,"once":true,"cond":{"realmMin":2,"realmMax":6,"flagAny":["血煞门之仇","断臂","灭门余生","护道之谊","识海有痕","燃寿冲关"]},"text":"白芷跪着进来，膝盖在石阶上磨出血。她中毒已深，解药的引子只有你手里有。你正在冲关的紧要处。","choices":[{"text":"为她镇毒，误了这次冲关","effect":{"cult":-160,"lifespan":-20,"mind":10,"fame":15,"rel":{"白芷":25},"log":"废关为白芷镇毒"},"result":"你收功出关，把她扶进丹房，用真元一寸寸替她逼毒，逼了五天。毒是压住了，你的气机全散了。她醒来以后在你案上留了一张方子，说这个能补回来一点。方子你用了三年。"},{"text":"给她引子，让她去别处","effect":{"cult":100,"fame":5,"mind":-5,"rel":{"白芷":10},"log":"赠引子而未出关"},"result":"你把引子从门缝里递了出去，说了句去城里找姓孟的老医。她接了，磕了个头，自己站起来走了。你重新入定，气机接上了，只是那一段怎么都不如先前圆。"},{"text":"关门，说这次不救","effect":{"cult":200,"fame":-20,"mind":-12,"rel":{"白芷":-30},"log":"闭门不救白芷"},"result":"你说了一句关我何事，石门落了下来。外头很久没有声音，再开门时雪地上只剩两个膝盖的印子。这一关你冲得极顺。此后你偶尔听说她的消息，都隔得很远。"}]},{"id":"d06_01","title":"礁上观海","weight":10,"once":true,"cond":{"realmMin":4,"realmMax":6},"text":"东海孤礁退潮才露，你踏水坐了一夜。浪从看不见的地方来，往看不见的地方去。天亮时礁上落了层薄盐，白得像霜。","choices":[{"text":"任它长，坐到潮水漫膝","effect":{"cult":220,"mind":14,"lifespan":-20,"rel":{"苏婉儿":-8,"顾长歌":-8},"log":"礁上坐忘"},"result":"潮水漫过膝，漫过腰，你没有动。这一坐不知多少日夜，你只记得睁眼时礁石已被磨低半尺，而丹田里那片海，第一次和外面那片对上了。回山那天，苏婉儿在门口等你，欲言又止，最后只说了一句：你好像不太记得我们的事了。你确实记不清她上次笑是什么模样。"},{"text":"以减法镇住这份感悟","effect":{"cult":160,"mind":6,"lifespan":30,"luck":-4,"log":"舍五感镇道"},"result":"你自封五感，只留一线，把那一夜的潮声压成心头一枚种子。压得住，是因为你亲手剪掉了它伸出去的根。此后你听得见百里外的剑鸣，却在满城人声里觉得四面都是空的。寿元补回来了，那份天地一体的痛快，你再没尝到第二回。"},{"text":"把这一夜刻成文字","effect":{"cult":300,"mind":-4,"fame":30,"lifespan":-10,"log":"字成道隐"},"result":"你用剑尖在礁石上刻字，刻了三千余言，潮水一次次抹平，你一次次重刻。第七日字终于立住，围观的散修越聚越多，有人当场叩头认之为师。你名声大噪，可等你回头再望那片海，它只是海了。写出来的道，留给了别人。"}]},{"id":"d06_02","title":"天雷淬体","weight":10,"once":true,"cond":{"realmMin":4,"realmMax":6},"text":"北荒的落雷原无树无石，平地像被一掌抹过。惊蛰一到，雷不打天只打地。你赤脚走进去，电光落下，你站住也跪下。","choices":[{"text":"散了护体真元，硬受九道","effect":{"cult":450,"lifespan":-90,"mind":6,"mo":4,"log":"落雷原受九道"},"result":"九道雷，你数得很清楚，因为每数一道就少一分力气。第九道落下时你整个人陷进土里半尺，浑身焦黑，经脉却像被人用铁锤一寸寸重新砸直了。你爬出来时雷云已经散了，衣裳早没了，只有一对眼珠亮得吓人。寿元去了八十年，这副肉身却从此比金石更硬。"},{"text":"引雷入地，护住方圆百里","effect":{"cult":200,"fame":40,"lifespan":-30,"wealth":-300,"log":"引雷护落雷原"},"result":"你把真元插进地里，做了一根最蠢也最稳的避雷针。雷顺着你走，绕开了远处那片牧民的帐篷。事后他们抬了整年的牛羊来谢你，你收下了三头。经脉被反冲震裂三道，你养了十七年。声望传得很远，落雷原此后每逢惊蛰，有人会替你点一炷香。"},{"text":"借雷光炼一炉器","effect":{"cult":260,"wealth":600,"luck":-6,"log":"雷中成器"},"result":"你在雷口上摆开炉子，用天雷当炭火。器成的那一刻，落雷原静了整整一炷香，像天在替你让路。那柄东西后来卖出了极高的价，买主是万魔殿的人。但从此每逢阴天，你左手的指节都会自己发抖，那是炉子留给你的一笔账。"}]},{"id":"d06_03","title":"识海斩三尸","weight":9,"once":true,"cond":{"realmMin":5,"realmMax":6},"text":"闭关第四十日，识海里多出三个自己：数蚂蚁的、手带剑疤的、白发坐在极高处谁也不看的。他们同时抬头等你动手。","choices":[{"text":"只斩那个白发的","effect":{"cult":500,"mind":6,"mo":8,"lifespan":-40,"log":"斩未来尸"},"result":"你一剑劈开白发的自己。他散开时笑了笑，说了半句你不想听的话。斩掉的是斤斤计较的那部分，剩下的路确实顺畅了许多。代价是你从此再也看不见很远的东西——不是眼睛，是心里那盏本来照着路的灯，灭了一角。"},{"text":"三尸一个都不留","effect":{"cult":600,"mind":12,"mo":10,"lifespan":-100,"flagDel":["雾中定心","剑冢残锋"],"log":"三尸俱斩"},"result":"三剑，三声，识海里干净得像大雪后的院子。那些旧日的暖意连同软弱的根一起没了，你站起来时稳得不像人。可你后来用了很久才想起，曾经有个名字你一听见就会笑。现在你想不起来了，翻遍记忆只翻到一片雪。"},{"text":"一个都不斩，收剑入鞘","effect":{"cult":200,"mind":10,"mo":-10,"luck":8,"log":"不斩三尸"},"result":"你收了剑，在识海里坐下，跟三个自己说了很久的话。他们最后都散了，不是被你杀散的，是说完就走了。你出关时眉毛白了半截，修为进境远不如旁人传说中斩尸那样快。但心魔从此近不了你的身——一个连自己都不肯杀的人，没什么可被吓的。"}]},{"id":"d06_04","title":"分岔之年","weight":9,"once":true,"cond":{"realmMin":5,"realmMax":6},"text":"阵盘一揭开，你看见那年的雨：往西那条路的尽头坐着另一个你，正擦一柄木剑。他抬头问，那你呢。","choices":[{"text":"在他对面坐下，把话说完","effect":{"cult":240,"mind":16,"lifespan":-30,"wealth":-400,"log":"与分岔对坐"},"result":"你们对坐到天黑，又对坐到天亮。他讲他的鸡和木剑，你讲你的雷和潮。临别你把身上所有灵石都留在了他灶台边，明知道带不走。出来时阵盘碎成粉，你鬓边多了一缕白。有些路不走了，不代表不疼；但说完了，就真的放下了。"},{"text":"抹去这条分岔","effect":{"cult":520,"mind":-6,"luck":-10,"lifespan":-30,"log":"断诸般可能"},"result":"你抬手抹去那道岔路。屋子、灶火、鸡鸣、那个擦木剑的人，一层层淡下去，像墨被人从水里捞走。从此往后你只剩一条路可走，走得极快，快得连如果两个字都追不上你。气运薄了一层，你却不再犹豫——没什么可犹豫的了。"},{"text":"只看一眼，转身就走","effect":{"cult":180,"mind":8,"luck":6,"lifespan":20,"log":"过门不入"},"result":"你看了很久，久到阵盘开始发烫，然后转身出了废墟，一步没回头。那壶水到底有没有烧开，你这辈子都不会知道了。这件事就那么搁着，像袖口里一颗小石子。奇怪的是，此后你运功时格外稳，心里干净，干净得有点空。"}]},{"id":"d06_05","title":"前人遗愿","weight":10,"once":true,"cond":{"realmMin":4,"realmMax":6},"text":"洞府里坐着一具尸身，衣裳烂尽，脊背还直着。他手上托一枚玉简，石上刻着指甲刮的字：帮我送完这一趟，四百年。","choices":[{"text":"接下来，立誓送到","effect":{"cult":300,"lifespan":-100,"fame":30,"mo":-6,"flagAdd":["遗愿在身"],"log":"受前人遗愿"},"result":"你把玉简贴身收好，对着那具尸身行了礼。誓言出口的一瞬，你心口像被系了一根线，另一头拴在极西，拽着你往前走，也拽着你不能回头。此后你数次可以绕开是非，都绕不开。道心反倒稳了——欠着债的人，不容易走歪。"},{"text":"只取玉简，不接因果","effect":{"cult":200,"wealth":500,"luck":-8,"mo":8,"log":"取简不接愿"},"result":"你把玉简里的东西取了出来，确实值钱，转手就换了五百灵石。青石上那行字你没再看第二遍。此后有一段日子你过得极阔，进境也顺。只是每回数灵石，总有一瞬间听见指甲刮石头的声音。声音很小，你一直没告诉别人。"},{"text":"把遗愿转托他人","effect":{"cult":120,"fame":-30,"luck":-4,"flagAdd":["遗愿他托"],"log":"遗愿转托他人"},"result":"你寻了一个年轻散修，把玉简和原委一并交了，又给了他一笔路费。他答应得很痛快，后来也确实去了。这件事在你名下算清了，你落了个清静。只是江湖上渐渐有了一种说法：当年那位前辈找过你，你没接。这话你解释不清，也不打算解释。"}]},{"id":"d06_06","title":"开宗立派","weight":8,"once":true,"cond":{"realmMin":5,"realmMax":6},"text":"合道在即，你在云间得了一座无主洞府。名录摆上案头，玄虚道人蹲在门槛上问：你打算收些什么人。","choices":[{"text":"立门规：同门不许相残","effect":{"cult":260,"fame":50,"mind":8,"wealth":-500,"rel":{"沈青霜":10,"白芷":8},"log":"立派立仁规"},"result":"你把第一条写死：同门相残者，逐，永不复用。写的时候你想起一些旧事，笔尖顿了三顿。此后拜山的人多，走的人也多，山门清苦，库里的灵石总不够用。可每到深夜，你听见的回声是齐的，没有刀出鞘的声音。这条规，日后救过你的命。"},{"text":"立门规：强者居上座","effect":{"cult":400,"fame":20,"mo":10,"mind":-6,"rel":{"姜雪璃":8,"苏婉儿":-6},"log":"立派立强规"},"result":"你把规矩写成一句：能者上，不能者让。三年之内，你门下的弟子修为涨得比哪一家都快，快得让人眼红。第四年冬，山门里死了两个弟子，都是死在自家人手上。你把那条规矩留在原处没改，只是把自己关了三日。门里从此人人自危，人人拼命。"},{"text":"不立门规，只挂一块无字匾","effect":{"cult":200,"luck":10,"fame":-20,"wealth":300,"mo":-8,"log":"无字匾下立派"},"result":"匾是空的，规矩是各人的良心。来的人少，留下的人更少，但留下来的几个，你都记得住名字。山门冷清，账上倒一直有钱——不养闲人，也不必防谁。有人说你立派如儿戏，你不辩。若干年后有人翻遍你门下名册，发现人数不多，却也没出过一个叛徒。"}]},{"id":"d06_07","title":"当众论道","weight":9,"once":true,"cond":{"realmMin":4,"realmMax":6},"text":"论道大会台子很高，说不清自己的道就当场被人问下来。你站上去，姜雪璃坐在最后排。风把幡吹得响，你开不了口。","choices":[{"text":"直说自己的道，不引经据典","effect":{"cult":320,"fame":50,"mind":8,"mo":6,"log":"论道直说己道"},"result":"你说得很短，短到有人以为是怯场。你说完，台下静了片刻，老剑修第一个站起来拱手。此后多年，这段话被人反复引用、反复篡改，连你自己都认不出原样。姜雪璃散场时才看你一眼，眼神里有别的东西。你把那份心思压下去了。"},{"text":"借三家之说，说得滴水不漏","effect":{"cult":280,"fame":30,"wealth":400,"mind":-6,"log":"论道借人成说"},"result":"你把剑宗的刚、丹霞的缓、天音的空各取一截，拼成一套谁都挑不出错的道理。台上人人点头，台下有人递帖子请你去做客卿，定金给得很足。你收下了。回洞府的路上，你忽然想不起自己原话是什么。这个问题你想了很多年，一直没想出答案。"},{"text":"把台子让给别人，只在台下听","effect":{"cult":160,"mind":14,"fame":-20,"luck":6,"log":"论道让台听人"},"result":"你退下台，在人群里找了个角落坐下，从早听到晚，一句没插。别人当你是心虚，你也不恼。那天你听懂了六家真正的短处，比台上任何一人都多。多年后有人问你那次为何不上台，你说：台子那么小，站着的人看不见自己。"}]},{"id":"d06_08","title":"受封道号","weight":10,"once":true,"cond":{"realmMin":4,"realmMax":6},"text":"道号不是你求来的。三山五湖的修士联名递了帖子，末尾那句却不客气：这道号一受，天下事就与你有关了。","choices":[{"text":"受了道号，从此有名有姓","effect":{"fame":200,"cult":200,"mind":-4,"age":6,"lifespan":-20,"log":"受封道号"},"result":"道号一传出去，拜山的人从山脚排到半山。你从此没有一日是自己过的——有人求药，有人求剑，有人只求你说一句公道话。修为涨得比从前快，因为天下灵气都愿意往有名字的地方流。可你也再没办法一个人走夜路了，总有人跟着。"},{"text":"辞了道号，只留姓名","effect":{"fame":80,"mind":10,"luck":8,"cult":120,"wealth":-200,"log":"辞道号留姓名"},"result":"你把帖子原封退回，附了一封短笺：叫我名字就行。这一退，反而有人更高看你，送来的礼你一概不收，又得罪了几个。你过了几年真正清静的日子，走路不必回头，坐下不必看门。代价是有人替你起了绰号，比道号难听得多。"},{"text":"让给同门，自己不领","effect":{"fame":-20,"mind":6,"cult":150,"rel":{"顾长歌":12,"沈青霜":10},"log":"让号与同门"},"result":"你说这道号该给更该得的人。话传出去，落在同门身上，他推辞了两回，到底受了。此后他在明，你在暗，许多麻烦拦在他那边。他替你挡下不止一次。你欠他的这份，后来是用别的方式还的——还的时候你已经很老了。"}]},{"id":"d06_09","title":"第一道天雷","weight":10,"once":true,"cond":{"realmMin":6,"realmMax":6},"text":"渡劫那日天是铅灰的，没有风。云压到山头那么低，亮了一下又灭。第一道天雷落前，极远处一声钟响。","choices":[{"text":"迎上去，不避不让","effect":{"cult":600,"fame":40,"mo":8,"lifespan":-60,"death":"第一道天雷之下，形神俱灭","log":"硬抗第一道天雷"},"result":"雷穿身而过，你半边身子瞬间没了知觉。你确实接住了——真元在剧痛里拧成一股从未有过的形状。你在半空停了三息才落地，落地时手指还插在土里。远处护法的人跪了一片。这道雷替你改了一条经脉的走向，也烧掉了你大半寿元。"},{"text":"分雷入地，殃及山林","effect":{"cult":420,"fame":-30,"luck":-12,"lifespan":-20,"mo":6,"log":"分雷毁一山"},"result":"你把雷劈成八股引向四周，山保不住，方圆四十里的松林烧成了炭。火里埋着两户采药的人家，你后来一家一家找过去，赔了三年的灵石。修为是护住了，气运薄得像一层纸。此后你每逢经过焦土，都绕路走，因为焦味会让你想起那一声钟。"},{"text":"以禁法吞雷，代天行罚","effect":{"cult":520,"mo":15,"mind":-8,"wealth":800,"lifespan":-120,"log":"吞雷代天罚"},"result":"你用了上古的吞雷禁法，把第一道天雷咽了下去。咽下去的东西不老实，此后每逢雨夜，你胸腹里就有雷在走。修为与灵石来得太快，快到有人开始怕你。你自己也怕——照镜子时，眼白偶尔会亮一下，像要下雨。"}]},{"id":"d06_10","title":"天门洞开","weight":10,"once":true,"cond":{"realmMin":6,"realmMax":6},"text":"第九道天雷散尽，天裂开一道口子。门后很亮，亮得没有深浅，也没有声音。你看清那片亮里，有什么在看回来。","choices":[{"text":"抬脚入门，不问门后","effect":{"cult":600,"realm":7,"fame":100,"lifespan":200,"rel":{"苏婉儿":-20,"沈青霜":-20,"顾长歌":-20},"log":"登天门去"},"result":"你抬脚的那一刻，身后所有声音都断了——风声、人声、剑鸣，全断在半空。门里没有路，走进去就是路。你不知道自己要去哪里，只知道回头已经找不到回去的方向了。人间那些名字，一个也没能带上来。"},{"text":"抬手，把门按下","effect":{"cult":400,"mind":14,"luck":-8,"lifespan":-40,"fame":-40,"flagAdd":["闭天门"],"log":"按落天门闭"},"result":"你举掌按在天门边上，像按住一扇要撞开的风门。掌心裂了三道口子，血是金色的。门缓缓合上，那东西一直看着你，直到最后一道细缝消失。全天下骂你不识抬举，你回山门睡了整整一年。醒来时风还是风，雨还是雨。"},{"text":"在门下问一句：里面可有故人","effect":{"cult":260,"mind":8,"mo":8,"lifespan":-60,"luck":4,"log":"门下问故人"},"result":"你问了一句。门里没有回答，只是亮了一下——很轻的一下，像是有人应了。你站在那里把半生的名字念了一遍，念到一半就念不下去了。天门最后自己合上，留了一道细缝在你眉心，此后你看人，总比别人多看见一层影子。"}]},{"id":"d06_11","title":"雨夜收徒","weight":10,"once":true,"cond":{"realmMin":5,"realmMax":6},"text":"雨下到第三日，洞府外的石阶上跪着一个少年，瘦得只剩骨头，膝下的水是红的。他不求别的，只求一个名字。","choices":[{"text":"收下，从头教起","effect":{"fame":20,"mind":10,"cult":260,"wealth":-400,"rel":{"苏婉儿":-3},"log":"雨夜收徒"},"result":"你把他带进门，先给了一碗热的。教了三年，他才知道自己天资平平，练得比谁都苦。第十年他第一次替你挡下一剑，肩膀上留了道疤。你看着他长大，也看着他开始替你操心。教人这件事，最耗的是自己那点时间，而时间你最缺。"},{"text":"给他一部功法，不收入门墙","effect":{"fame":10,"cult":150,"mind":-4,"luck":6,"log":"赐功不留人"},"result":"你抄了一部中平功法给他，又指了条路，叫他去散修联盟讨口饭吃。他磕了三个头走了，走得很快。多年后你在别处见到他，他做了别人的师兄，见了你只称一声前辈。你心里空了一下，随即觉得也好——有些线不牵，就不会断。"},{"text":"给他灵石，让他下山去","effect":{"cult":320,"wealth":-600,"mind":-8,"luck":-6,"log":"雨夜予金遣人"},"result":"你数了一笔不算少的灵石给他，说够了，回去买块地。他接了，鞠了一躬，下了山。你关上门接着闭关，那一年进境极快，快得连雨都忘了听。后来听说有人在赌坊里见过他，输光了所有，再后来就没了消息。你从没跟人提过这件事。"}]},{"id":"d06_12","title":"故人皆老","weight":10,"once":true,"cond":{"realmMin":4,"realmMax":6},"text":"你回乡那年，村口那棵三抱粗的槐树没了，换成一块修路的功德碑。巷子里没人认得你，一个孩子问你是来收租的吗。","choices":[{"text":"只留一袋灵石，不留姓名","effect":{"mind":12,"luck":6,"wealth":-800,"lifespan":-10,"log":"归乡留金去"},"result":"你把灵石放在门槛内侧，摆得很整齐，像怕人不知道是谁来过，又像怕人知道。走出巷口时你听见有人推门，你没有回头。这一趟你没有见到任何人，却在回去的路上把少年时所有的事都想起来了一遍，清清楚楚。此后你运功，心里再没有堵着的地方。"},{"text":"敲开门，自报姓名","effect":{"mind":8,"cult":220,"fame":20,"lifespan":-30,"rel":{"白芷":-6},"log":"归乡认门"},"result":"门开了，出来的是个你不认识的老妇。你报上名字，她愣了很久，才想起许多年前巷子里确实有过这么一个人。话说到后来都是些琐事，米价、雨水、谁家孩子进了城。你替他们留下一笔钱和一部不入流的养生功法。走的时候，老妇喊了你的小名。"},{"text":"替全村迁走，另辟新村","effect":{"cult":280,"fame":40,"wealth":-2000,"luck":-6,"lifespan":-40,"log":"迁一村另立"},"result":"你动用修士的手段，一夜之间把整村的人和屋搬去了三十里外的水边，连井都重打了一口。新村长年无灾，米粮丰足。只是从此这地方在地图上没了名字，县志里也查不到。你要改的东西太多，改完之后，那条巷子就只剩你一个人记得了。"}]},{"id":"d06_13","title":"生死了断","weight":10,"once":true,"cond":{"realmMin":6,"realmMax":6,"flagAny":["受封道号","遗愿在身","闭天门","立派立仁规","遗愿他托","雾中定心","三尸俱斩","不斩三尸","剑冢残锋"]},"text":"你最后一次出关，山门外雪里站着个驼背老头。他说的只有一个意思：你的因果里，有他一笔。雪下得很安静。","choices":[{"text":"以全盛之势，与之正面了断","effect":{"cult":600,"fame":60,"mind":10,"mo":6,"lifespan":-150,"death":"了断因果之际，力竭身殒","log":"正面了断因果"},"result":"你把这一生所有的修为都推到最前面，第一击就把半座山削平了。雪被烧成了雾。你们从黄昏打到天亮，胜负在你最后一口气的边上分开。他倒下去的时候你也没能站住。你伤到的地方，此后每逢下雪都会疼，但因果确实清了，干干净净。"},{"text":"舍去百年寿元，一击定局","effect":{"cult":450,"fame":30,"mind":8,"mo":-6,"lifespan":-100,"flagAdd":["因果已了"],"log":"舍寿了断因果"},"result":"你把寿元烧成真元，只求一击。那一击之后，天地都静了片刻。你站着，他也没有倒——只是从此再没有出现过。你回到洞府，白了头，眉毛也白了。有人问你这笔账结得值不值，你说：能用岁数买的东西，都不算贵。"},{"text":"放手让他这笔账记下去","effect":{"cult":200,"mind":-10,"mo":15,"luck":-8,"lifespan":60,"log":"任账未了"},"result":"你收了手，说这笔账你留着，往后我什么时候想还再还。他盯了你很久，最后转身走进雪里。你保住了寿元，也保住了一条命，可此后的每一夜你都得留一半心防着他。魔念疯长，进境快得吓人，你照镜子时偶尔会认不出自己的眼神。"}]}]}</script>
<script>
/* ==========================================================================
 * 修仙模拟器 · 核心逻辑（纯逻辑，不碰 DOM，可被 Node 直接引入做平衡测试）
 * ========================================================================== */

const REALM_NAMES = ['凡体', '炼气', '筑基', '金丹', '元婴', '化神', '渡劫', '飞升'];
const REALM_LIFESPAN = [90, 120, 200, 400, 800, 1500, 3000, 999999];

/** 全部平衡参数集中在这里，方便 tools/simulate.mjs 做参数扫描 */
const TUNING = {
  /* 各境界突破所需增量。由 tools/sweep.mjs 扫描定稿，对应累计门槛
   * [240, 860, 2150, 3450, 4300, 5200, 7200]。
   * 形状：中段两关（金丹 1290 / 元婴 1300）负责筛人，化神之后数值变小，
   * 但天劫惩罚与最后一道 2000 的飞升关把顶端压回 2% 左右。 */
  costs: [240, 620, 1290, 1300, 850, 900, 2000],
  /** 每回合打坐自然积累的修为基数 */
  passiveBase: 14,
  /** 每高一个境界，打坐收益增加多少 */
  passivePerRealm: 16,
  /** 打坐收益随境界增长的指数：1 为线性，>1 为越到高阶越快 */
  passiveExp: 1.35,
  /** 修为受灵根影响的指数：越小，灵根差距对最终成就的影响越温和 */
  rootExp: 0.7,
  /** 一局最多经历多少个事件 */
  turnCap: 48,
  /** 单次事件最多推进当前境界进度的比例 */
  cultCapRatio: 0.6,

  /* ---- 死亡面：决定「陨落」这一档有多厚 ---- */
  /** 走火入魔（冲关反噬）直接身死的概率 */
  backfireDeath: 0,
  /** 化神之上（含化神）冲关失败遭天劫、身死道消的概率 */
  tribulationDeath: 0,
  /** 寿元耗尽是否算「陨落」（否则按境界评正常人生等） */
  agingIsDeath: false,

  /* ---- 结局判定线：决定六档之间的此消彼长 ---- */
  /** 飞升时魔念超过多少算「天魔人生」 */
  moAscendDemon: 55,
  /** 未飞升者：魔念达到多少且境界不低于 moDemonRealm，算「天魔人生」 */
  moDemon: 58,
  moDemonRealm: 3,
  /** 未飞升者：达到这个境界即算「爽文人生」 */
  powerRealm: 5,
  /** 差一个境界但声望够高，也算「爽文人生」 */
  powerFame: 185,
  /** 筑基且活到这个岁数（但没到金丹），算「凡人长寿」 */
  longlifeAge: 140

function honorTitle(s) {
  const r = s.realm;
  if (s.mo >= 65 && r >= 4) return r >= 6 ? '万魔之尊' : '血海魔君';
  switch (r) {
    case 0: return '山野凡人';
    case 1: return '炼气散修';
    case 2: return s.sect ? '外门筑基' : '筑基野修';
    case 3: return '金丹真人';
    case 4: return '元婴老祖';
    case 5: return '化神大能';
    case 6: return '渡劫真仙';
    default: return '飞升仙尊';
  }
}

/** 结算：返回 { endingId, title, verdict } */
function judge(s, opts) {
  opts = opts || {};
  const ascended = !!opts.ascended || s.realm >= 7;
  let id;
  if (s.deathCause) {
    id = 'fallen';
  } else if (ascended) {
    id = s.mo >= TUNING.moAscendDemon ? 'demon' : 'power';
  } else if (s.mo >= TUNING.moDemon && s.realm >= TUNING.moDemonRealm) {
    id = 'demon';
  } else if (s.realm >= TUNING.powerRealm || (s.realm >= TUNING.powerRealm - 1 && s.fame >= TUNING.powerFame)) {
    id = 'power';
  } else if (s.realm >= 3) {
    id = 'common';
  } else if (s.realm >= 2 && s.age >= TUNING.longlifeAge) {
    id = 'longlife';
  } else {
    id = 'mortal';
  }
  let title;
  if (id === 'fallen') {
    title = '身死道消';
  } else if (id === 'longlife') {
    title = s.age >= 180 ? '百岁山民' : '一世凡人';
  } else if (id === 'mortal') {
    title = s.realm >= 2 ? '碌碌小修' : (s.age >= 80 ? '一世凡人' : '半途而废');
  } else {
    title = honorTitle(s);
  }
  const e = ENDINGS[id];
  return { endingId: id, title, verdict: e.judge };
}

/* -------------------------------------------------------------- 工具 --- */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ri = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

function weightedPick(list, rng) {
  let total = 0;
  for (const it of list) total += it.weight;
  let r = rng() * total;
  for (const it of list) {
    r -= it.weight;
    if (r <= 0) return it;
  }
  return list[list.length - 1];
}

function condMatch(c, s, turn) {
  if (!c) return true;
  if (c.realmMin != null && s.realm < c.realmMin) return false;
  if (c.realmMax != null && s.realm > c.realmMax) return false;
  if (c.gender && s.gender !== c.gender) return false;
  if (c.noSect && s.sect) return false;
  if (c.sect && !c.sect.includes(s.sect || '无')) return false;
  if (c.luckMin != null && s.luck < c.luckMin) return false;
  if (c.luckMax != null && s.luck > c.luckMax) return false;
  if (c.mindMin != null && s.mind < c.mindMin) return false;
  if (c.mindMax != null && s.mind > c.mindMax) return false;
  if (c.moMin != null && s.mo < c.moMin) return false;
  if (c.moMax != null && s.mo > c.moMax) return false;
  if (c.fameMin != null && s.fame < c.fameMin) return false;
  if (c.fameMax != null && s.fame > c.fameMax) return false;
  if (c.ageMin != null && s.age < c.ageMin) return false;
  if (c.ageMax != null && s.age > c.ageMax) return false;
  if (c.cultMin != null && s.cult < c.cultMin) return false;
  if (c.flagAll && !c.flagAll.every(f => s.flags.includes(f))) return false;
  if (c.flagAny && !c.flagAny.some(f => s.flags.includes(f))) return false;
  if (c.flagNone && c.flagNone.some(f => s.flags.includes(f))) return false;
  if (c.turnMin != null && turn < c.turnMin) return false;
  if (c.turnMax != null && turn > c.turnMax) return false;
  return true;
}

/* -------------------------------------------------- 修为增益的软上限 --- */
/** 单次事件最多推进当前境界进度的一部分，避免一个事件直接跳过一整个大境界 */
function cultGain(s, raw, rootPower) {
  if (raw <= 0) return raw;
  const cap = Math.max(80, Math.round(BREAKTHROUGH_COST[s.realm] * TUNING.cultCapRatio));
  return Math.min(Math.round(raw * rootPower), cap);
}

/** 每回合天然而然的进境（时间流逝带来的积累） */
function passiveGain(s) {
  const base = TUNING.passiveBase + TUNING.passivePerRealm * Math.pow(s.realm, TUNING.passiveExp);
  return Math.round(base * Math.pow(s.rootMult, TUNING.rootExp));
}

function rootPower(s) {
  return Math.pow(s.rootMult, TUNING.rootExp);
}

function applyEffect(s, eff, rng, notes) {
  if (!eff) return notes;
  const push = (label, v) => { if (v) notes.push({ label, v }); };

  if (eff.cult) {
    const g = cultGain(s, eff.cult, rootPower(s));
    s.cult = Math.max(0, s.cult + g);
    push('修为', g);
  }
  if (eff.luck) { s.luck = clamp(s.luck + eff.luck, 0, 100); push('气运', eff.luck); }
  if (eff.mind) { s.mind = clamp(s.mind + eff.mind, 0, 100); push('道心', eff.mind); }
  if (eff.mo) { s.mo = clamp(s.mo + eff.mo, 0, 100); if (s.mo > (s.moPeak || 0)) s.moPeak = s.mo; push('魔念', eff.mo); }
  if (eff.fame) { s.fame = Math.max(0, s.fame + eff.fame); push('声望', eff.fame); }
  if (eff.wealth) { s.wealth += eff.wealth; push('灵石', eff.wealth); }
  if (eff.lifespan) { s.lifespan = Math.max(s.age + 1, s.lifespan + eff.lifespan); push('寿元', eff.lifespan); }
  if (eff.contribution) { s.contribution = Math.max(0, s.contribution + eff.contribution); push('宗门贡献', eff.contribution); }
  if (eff.flagAdd) for (const f of eff.flagAdd) if (!s.flags.includes(f)) s.flags.push(f);
  if (eff.flagDel) s.flags = s.flags.filter(f => !eff.flagDel.includes(f));
  if (eff.rel) {
    s.rels = s.rels || {};
    for (const k of Object.keys(eff.rel)) {
      s.rels[k] = clamp((s.rels[k] || 0) + eff.rel[k], 0, 100);
      push(k, eff.rel[k]);
    }
  }
  if (eff.partner) { s.partner = eff.partner; s.flags.push('已结道侣'); notes.push({ label: '道侣', text: eff.partner }); }
  if (eff.sectJoin) { s.sect = eff.sectJoin; s.flags.push('已入宗门'); notes.push({ label: '宗门', text: eff.sectJoin }); }
  if (eff.sectLeave) { s.sect = null; s.contribution = 0; notes.push({ label: '宗门', text: '离宗' }); }
  if (eff.realm != null && eff.realm > s.realm) {
    s.realm = eff.realm;
    s.lifespan = Math.max(s.lifespan, REALM_LIFESPAN[s.realm]);
    notes.push({ label: '境界', text: REALM_NAMES[s.realm] });
  }
  if (eff.death) s.deathCause = eff.death;
  return notes;
}

class Game {
  constructor(events, rng) {
    this.events = events;
    this.rng = rng || Math.random;
    this.reset();
  }

  reset() {
    this.s = null;
    this.seen = {};
    this.turn = 0;
    this.chronicle = [];
    this.current = null;
    this.lastResult = null;
    this.over = false;
    this.ending = null;
    this.ascended = false;
    this.rerolled = false;
    this.log = [];
  }

  /* --- 开局随机 --- */
  roll(gender) {
    const rng = this.rng;
    const root = weightedPick(ROOTS, rng);
    const origin = weightedPick(ORIGINS, rng);
    const age = ri(rng, 12, 16);
    this.s = {
      name: '无名',
      gender: gender || (rng() < 0.5 ? '男' : '女'),
      origin: origin.name,
      originDesc: origin.desc,
      root: root.name,
      rootMult: root.mult,
      rootDesc: root.desc,
      realm: 0,
      cult: 0,
      age,
      lifespan: REALM_LIFESPAN[0],
      luck: clamp(50 + (origin.luck || 0) + ri(rng, -8, 8), 5, 95),
      mind: clamp(50 + (origin.mind || 0) + ri(rng, -8, 8), 5, 95),
      mo: 0,
      fame: Math.max(0, origin.fame || 0),
      wealth: origin.wealth || 0,
      sect: null,
      contribution: 0,
      flags: (origin.flags || []).slice(),
      rels: {},
      partner: null,
      deathCause: null,
      rootName: root.name,
      originName: origin.name
    };
    return this.s;
  }

  reroll() {
    if (this.rerolled) return false;
    this.rerolled = true;
    return true;
  }

  /* --- 回合 --- */
  defaultYears() {
    const r = this.s.realm;
    return ri(this.rng, 2, 4) + Math.floor(r * 0.5);
  }

  pickEvent() {
    const s = this.s, rng = this.rng;
    // 关键事件：已入炼气却还没拜宗，优先推择宗
    if (!s.sect && s.realm >= 1 && !this.seen['d01_13']) {
      const key = this.events.find(e => e.id === 'd01_13');
      if (key) return key;
    }
    const pool = [];
    for (const e of this.events) {
      if (e.once !== false && this.seen[e.id]) continue;
      if (this.lastEventId === e.id) continue;
      if (!condMatch(e.cond, s, this.turn + 1)) continue;
      if (e.cond && e.cond.chance != null && rng() > e.cond.chance) continue;
      pool.push(e);
    }
    if (!pool.length) return this.filler();
    return weightedPick(pool, rng);
  }

  filler() {
    return {
      id: 'filler_' + (this.turn % 3),
      title: '静修',
      once: false,
      text: '山中无岁月。你在洞府里坐了一段日子，灵气一进一出，如溪水过石。',
      choices: [
        { text: '继续闭关', effect: { cultBase: 1 }, result: '你把心思收得更紧了些，修为长了一线。' },
        { text: '推门出去走走', effect: { luck: 3, cultBase: 0.4 }, result: '山风扑面，你在溪边站了很久，心里松快了些。' }
      ]
    };
  }

  nextEvent() {
    if (this.over) return null;
    const ev = this.pickEvent();
    this.current = ev;
    this.lastResult = null;
    this.seen[ev.id] = (this.seen[ev.id] || 0) + 1;
    this.lastEventId = ev.id;
    return ev;
  }

  /** 选择后结算；返回 { result, notes, ended } */
  choose(index) {
    const ev = this.current;
    const s = this.s;
    const ch = ev.choices[index] || ev.choices[0];
    let eff = ch.effect || {};
    const notes = [];

    // 岁月本身的积累
    const pg = passiveGain(s);
    if (pg > 0) { s.cult += pg; }

    // 静修类事件的修为随境界水涨船高
    if (eff.cultBase != null) {
      const step = TUNING.passiveBase + TUNING.passivePerRealm * Math.pow(s.realm, TUNING.passiveExp);
      const raw = Math.round(eff.cultBase * step * 1.6 * rootPower(s));
      applyEffect(s, Object.assign({}, eff, { cult: raw, cultBase: undefined }), this.rng, notes);
    } else {
      applyEffect(s, eff, this.rng, notes);
    }
    if (pg > 0) notes.unshift({ label: '岁月积累', v: pg });

    this.chronicle.push({ age: s.age, event: ev.title, choice: ch.text, log: eff.log || '' });

    const years = eff.age != null ? eff.age : this.defaultYears();
    s.age += Math.max(0, years);
    s.age = Math.round(s.age);
    this.turn++;

    this.lastResult = { result: ch.result, notes };

    // 寿元耗尽既可以按境界评结局，也可以直接算「陨落」（由 TUNING.agingIsDeath 决定）
    if (!s.deathCause && TUNING.agingIsDeath && s.age >= s.lifespan) s.deathCause = '寿元耗尽';

    if (s.deathCause) {
      this.chronicle.push({ age: s.age, event: '陨落', choice: s.deathCause, log: s.deathCause });
      this.finish(false);
    } else if (s.realm >= 7) {
      this.ascended = true;
      this.finish(true);
    } else if (s.age >= s.lifespan) {
      this.finish(false, '寿元耗尽');
    } else if (this.turn >= TUNING.turnCap) {
      this.finish(false, '大限将至');
    }
    return { result: this.lastResult, ended: this.over };
  }

  canBreakthrough() {
    const s = this.s;
    return !this.over && s.realm <= 6 && s.cult >= BREAKTHROUGH_COST[s.realm];
  }

  breakthroughChance() {
    const s = this.s;
    // 化神之后是应天劫：每一道都难过，失败要拿寿元去填
    const heaven = s.realm >= 5 ? 0.22 : 0;
    let p = 0.40 + s.mind / 280 + s.luck / 400 + (s.rootMult - 1) * 0.15 - s.mo / 260 - s.realm * 0.05 - heaven;
    return clamp(p, 0.08, 0.93);
  }

  /** 突破会消耗一个回合 */
  breakthrough() {
    const s = this.s;
    const cost = BREAKTHROUGH_COST[s.realm];
    const p = this.breakthroughChance();
    const ok = this.rng() < p;
    const notes = [];
    let text;
    if (ok) {
      s.cult = Math.max(0, s.cult - cost);
      s.realm += 1;
      s.fame += 8 * s.realm;
      s.lifespan = Math.max(s.lifespan, REALM_LIFESPAN[s.realm]);
      text = '灵气自百会灌入，周身经脉一齐轰鸣——你破了' + REALM_NAMES[s.realm] + '。';
      notes.push({ label: '境界', text: REALM_NAMES[s.realm] });
      notes.push({ label: '寿元上限', v: REALM_LIFESPAN[s.realm] - REALM_LIFESPAN[s.realm - 1] });
      this.chronicle.push({ age: s.age, event: '突破', choice: '破入' + REALM_NAMES[s.realm], log: '破入' + REALM_NAMES[s.realm] });
    } else {
      const bad = this.rng() < 0.3;
      s.cult = Math.round(s.cult * (bad ? 0.55 : 0.75));
      s.lifespan = Math.max(s.age + 1, s.lifespan - (bad ? 30 : 12));
      s.mo = clamp(s.mo + (bad ? 12 : 5), 0, 100);
      s.mind = clamp(s.mind - (bad ? 8 : 3), 0, 100);
      text = bad
        ? '真气冲关不成，反噬而上，你一口血喷在蒲团上，经脉里像有针在走。'
        : '只差一线。灵气在关口上散了，你睁开眼，天已经亮了三次。';
      notes.push({ label: '修为', v: -Math.round(cost * 0.25) });
      notes.push({ label: '魔念', v: bad ? 12 : 5 });
      this.chronicle.push({ age: s.age, event: '突破失败', choice: bad ? '走火入魔' : '冲关未成', log: bad ? '冲关反噬' : '冲关未成' });
      // 走火入魔 / 天劫：冲关失败也可能把命留在这道关口上
      if (bad && this.rng() < TUNING.backfireDeath) {
        s.deathCause = '冲关反噬';
        text += ' 这一口血再没止住——你的道途断在了这道关口上。';
      } else if (s.realm >= 5 && this.rng() < TUNING.tribulationDeath) {
        s.deathCause = '天劫加身';
        text += ' 天雷过了七道，第八道落下时，你没有再站起来。';
      }
    }
    s.age += this.defaultYears();
    this.turn++;
    s.cult += passiveGain(s);
    this.lastResult = { result: text, notes };
    if (!s.deathCause && TUNING.agingIsDeath && s.age >= s.lifespan) s.deathCause = '寿元耗尽';
    if (s.deathCause) {
      this.chronicle.push({ age: s.age, event: '陨落', choice: s.deathCause, log: s.deathCause });
      this.finish(false);
    } else if (s.age >= s.lifespan) {
      this.finish(false, '寿元耗尽');
    } else if (this.turn >= TUNING.turnCap) {
      this.finish(false, '大限将至');
    }
    return { result: this.lastResult, ended: this.over };
  }

  finished() { return this.over; }

  finish(ascended, reason) {
    this.over = true;
    const j = judge(this.s, { ascended: ascended || this.ascended });
    this.ending = Object.assign({}, j, { reason: reason || (this.s.deathCause || '') });
  }

  /** 汇总本局达成的成就 id（跨周目统计由外层负责） */
  runAchievements() {
    const s = this.s, out = [];
    const has = id => out.push(id);
    if (s.realm >= 1) has('a_first');
    if (s.root === '天灵根') has('a_root_top');
    if (s.root === '五灵根') has('a_root_low');
    if (s.sect) has('a_sect');
    if (s.fame >= 300) has('a_fame');
    if (s.wealth >= 1000) has('a_rich');
    if (s.realm >= 3) has('a_gold');
    if (s.realm >= 4) has('a_baby');
    if (s.realm >= 5) has('a_spirit');
    if (s.realm >= 6) has('a_tribu');
    if (this.ascended) has('a_ascend');
    if (s.partner) has('a_partner');
    if (!s.partner && s.realm >= 5) has('a_alone');
    if (s.mo >= 80) has('a_demon');
    if ((s.moPeak || 0) >= 45 && s.mo < 20) has('a_save');
    if (s.age >= 100) has('a_long');
    if (s.deathCause) has('a_die');
    if (this.ending) {
      if (this.ending.endingId === 'mortal') has('a_mortal_end');
      if (this.ending.endingId === 'power') has('a_power_end');
      if (this.ending.endingId === 'demon') has('a_demon_end');
      if (this.ending.endingId === 'longlife') has('a_long_end');
    }
    if (s.mind >= 80) has('a_kind');
    if (s.mo >= 60 && s.mo < 70) has('a_iron');
    return out;
  }
}

function createGame(events, rng) { return new Game(events, rng); }

/** 供模拟器使用的简易可复现随机数 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}


/* ===== 界面层 ===== */

/* ==========================================================================
 * 修仙模拟器 · 界面与存档层

(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('game-data').textContent);
  var EVENTS = DATA.events;
  var SAVE_KEY = 'xiuxian.v1';
  var GAME = null;
  var RNG = Math.random;

  /* ------------------------------------------------------------ 存档 --- */

  var profile = { endings: {}, achs: {}, sects: [], runs: 0, wins: {} };

  function loadProfile() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.profile) {
          profile = Object.assign(profile, o.profile);
          profile.sects = profile.sects || [];
        }
      }
    } catch (e) { /* 忽略 */ }
  }
  function saveProfile() {
    try {
      var o = readRaw() || {};
      o.profile = profile;
      localStorage.setItem(SAVE_KEY, JSON.stringify(o));
    } catch (e) { }
  }
  function readRaw() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveRun() {
    if (!GAME || !GAME.s) return;
    try {
      var o = readRaw() || {};
      o.run = {
        s: GAME.s, seen: GAME.seen, turn: GAME.turn, chronicle: GAME.chronicle,
        over: GAME.over, ending: GAME.ending, ascended: GAME.ascended,
        rerolled: GAME.rerolled, lastEventId: GAME.lastEventId || null,
        currentId: GAME.current ? GAME.current.id : null
      };
      o.profile = profile;
      localStorage.setItem(SAVE_KEY, JSON.stringify(o));
    } catch (e) { }
  }
  function clearRun() {
    try {
      var o = readRaw();
      if (o) { delete o.run; localStorage.setItem(SAVE_KEY, JSON.stringify(o)); }
    } catch (e) { }
  }

  /* ------------------------------------------------------------ 工具 --- */

  function $(id) { return document.getElementById(id); }
  function show(id) {
    var list = document.querySelectorAll('.screen');
    for (var i = 0; i < list.length; i++) list[i].classList.remove('on');
    $(id).classList.add('on');
    window.scrollTo(0, 0);
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function sign(n) { return (n > 0 ? '+' : '') + n; }

  /* --------------------------------------------------------- 墨点粒子 --- */

  function inkFall() {
    var box = $('inkfall');
    var n = window.innerWidth < 420 ? 12 : 18;
    var html = '';
    for (var i = 0; i < n; i++) {
      var size = (2 + Math.random() * 6).toFixed(1);
      html += '<i style="left:' + (Math.random() * 100).toFixed(1) + 'vw;width:' + size + 'px;height:' + size +
        'px;animation-duration:' + (11 + Math.random() * 14).toFixed(1) + 's;animation-delay:-' +
        (Math.random() * 20).toFixed(1) + 's"></i>';
    }
    box.innerHTML = html;
  }

  /* --------------------------------------------------------- 打字机 --- */

  var typer = null;
  function typewriter(el, text, done) {
    if (typer) { clearInterval(typer.timer); typer = null; }
    el.innerHTML = '';
    var i = 0;
    var span = document.createElement('span');
    var cur = document.createElement('span');
    cur.className = 'cursor';
    cur.textContent = '｜';
    el.appendChild(span);
    el.appendChild(cur);
    var speed = window.innerWidth < 420 ? 22 : 18;
    var state = { timer: null };
    typer = state;
    state.skip = function () {
      clearInterval(state.timer);
      span.textContent = text;
      cur.remove();
      typer = null;
      if (done) done();
    };
    state.timer = setInterval(function () {
      i += 2;
      span.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(state.timer);
        cur.remove();
        typer = null;
        if (done) done();
      }
    }, speed);
  }
  function skipTyping() { if (typer) { typer.skip(); return true; } return false; }

  /* --------------------------------------------------------- 属性面板 --- */

  function hudHTML(s) {
    var cost = BREAKTHROUGH_COST[s.realm] || 1;

    var chips = [];
    chips.push('<span class="chip"><b>灵根</b>' + esc(s.root) + '</span>');
    chips.push('<span class="chip"><b>出身</b>' + esc(s.origin) + '</span>');
    chips.push('<span class="chip"><b>气运</b>' + s.luck + '</span>');
    chips.push('<span class="chip"><b>道心</b>' + s.mind + '</span>');
    if (s.mo > 0) chips.push('<span class="chip warn"><b>魔念</b>' + s.mo + '</span>');
    chips.push('<span class="chip"><b>声望</b>' + s.fame + '</span>');
    chips.push('<span class="chip"><b>灵石</b>' + s.wealth + '</span>');
    if (s.sect) chips.push('<span class="chip"><b>宗门</b>' + esc(s.sect) + (s.contribution ? '·' + s.contribution : '') + '</span>');
    else chips.push('<span class="chip"><b>宗门</b>无</span>');

    var rels = s.rels || {};
    for (var k in rels) {
      if (rels[k] >= 40) chips.push('<span class="chip"><b>' + esc(k) + '</b>' + rels[k] + '</span>');
    }
    return '' +
      '<div class="hud-top">' +
      '<span class="hud-name">' + esc(s.name) + '</span>' +
      '<span class="hud-realm">' + REALM_NAMES[s.realm] + '</span>' +
      '<span class="hud-age">' + s.age + ' 岁 · 寿元 ' + (s.lifespan >= 99999 ? '无尽' : s.lifespan) + '</span>' +
      '</div>' +
      (s.realm >= 7 ? '' : '<div class="cultbar"><i style="width:' + pct + '%"></i></div>') +
      '<div class="chips">' + chips.join('') + '</div>';

  function renderHUD() {
    $('hud').innerHTML = hudHTML(GAME.s);
  }

  /* ------------------------------------------------------------ 流程 --- */

  function boot() {
    loadProfile();
    inkFall();
    bindTitle();

    if (raw && raw.run && !raw.run.over) {
      $('btn-continue').style.display = 'block';
      $('continue-info').textContent = raw.run.s.name + ' · ' + REALM_NAMES[raw.run.s.realm] + ' · ' + raw.run.s.age + ' 岁';
      $('continue-info').style.display = 'block';
    }
    if (Object.keys(profile.endings).length) {
      $('btn-gallery').style.display = 'block';
    }
    $('stat-line').textContent = profile.runs
      ? '已修行 ' + profile.runs + ' 世 · 已解锁结局 ' + Object.keys(profile.endings).length + ' / 6'
      : '一世一轮回，结局六种';
  }

  var gender = '男';
  function bindTitle() {
    $('btn-male').onclick = function () { gender = '男'; $('btn-male').classList.add('sel'); $('btn-female').classList.remove('sel'); };
    $('btn-female').onclick = function () { gender = '女'; $('btn-female').classList.add('sel'); $('btn-male').classList.remove('sel'); };
    $('btn-start').onclick = function () {
      var nm = ($('name-input').value || '').trim();
      if (!nm) { toast('请先取一个名字'); return; }
      if (nm.length > 8) { toast('名字太长，取个短些的'); return; }
      runAch = {}; endingCounted = false;
      GAME = new Game(EVENTS, RNG);
      GAME.roll(gender);
      GAME.s.name = nm;
      show('screen-roll');
      renderRoll();
    };
    $('btn-continue').onclick = function () {
      var raw = readRaw();
      if (!raw || !raw.run) return;
      runAch = {}; endingCounted = !!raw.run.over;
      GAME = new Game(EVENTS, RNG);
      var r = raw.run;
      GAME.s = r.s; GAME.seen = r.seen || {}; GAME.turn = r.turn || 0;
      GAME.chronicle = r.chronicle || []; GAME.over = !!r.over;
      GAME.ending = r.ending || null; GAME.ascended = !!r.ascended;
      GAME.rerolled = true; GAME.lastEventId = r.lastEventId || null;
      if (GAME.over) { renderEnding(); show('screen-ending'); return; }
      if (r.currentId) {
        var ev = EVENTS.filter(function (e) { return e.id === r.currentId; })[0];
        GAME.current = ev || GAME.nextEvent();
      } else {
        GAME.nextEvent();
      }
      show('screen-game');
      renderTurn();
    };
    $('btn-gallery').onclick = function () { renderGallery(); show('screen-gallery'); };
    $('btn-gal-back').onclick = function () { boot(); show('screen-title'); };
    $('btn-share-back').onclick = function () { show('screen-ending'); };
    $('btn-share').onclick = function () { show('screen-share'); };
    $('name-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btn-start').click(); });
  }

  function renderRoll() {
    var s = GAME.s;
    $('roll-root').textContent = s.root;
    $('roll-root-desc').textContent = s.rootDesc + '（修行速度 ×' + s.rootMult.toFixed(2) + '）';
    $('roll-origin').textContent = s.origin;
    $('roll-origin-desc').textContent = s.originDesc;

    $('btn-reroll').style.display = GAME.rerolled ? 'none' : 'block';
    $('reroll-note').textContent = GAME.rerolled ? '命数已定，重来不得。' : '一生只有一次改命的机会。';
  }

  function bindRoll() {
    $('btn-reroll').onclick = function () {
      if (!GAME.reroll()) return;
      var nm = GAME.s.name, g = GAME.s.gender;
      GAME.roll(g);
      GAME.s.name = nm;
      renderRoll();

    $('btn-enter').onclick = function () {
      if (!GAME.rerolled) GAME.rerolled = true;
      GAME.turn = 0;
      GAME.nextEvent();
      show('screen-game');
      renderTurn();
    };
  }

  function renderTurn() {
    saveRun();
    renderHUD();
    var ev = GAME.current;
    var s = GAME.s;
    $('event-title').textContent = ev.title;
    $('event-turn').textContent = '第 ' + (GAME.turn + 1) + ' 事 · ' + s.age + ' 岁';
    $('choices').innerHTML = '';
    $('result-box').innerHTML = '';
    $('result-box').style.display = 'none';

    var bt = $('btn-breakthrough');
    if (GAME.canBreakthrough()) {
      bt.style.display = 'block';
      bt.textContent = '闭关突破 · 破入' + REALM_NAMES[s.realm + 1] + '（成功率约 ' + Math.round(GAME.breakthroughChance() * 100) + '%）';

    } else {
      bt.style.display = 'block';
      bt.disabled = true;

    var out = GAME.choose(i);

  function bindGame() {

  /* ------------------------------------------------------------ 成就 --- */

  var runAch = {};

    var s = GAME.s;
    if (s.sect && profile.sects.indexOf(s.sect) < 0) { profile.sects.push(s.sect); }
    var got = GAME.runAchievements();
    if (profile.sects.length >= 6 && !profile.achs.a_six) profile.achs.a_six = 1;
    var fresh = [];
    got.forEach(function (id) {
      if (!runAch[id]) { runAch[id] = 1; if (!profile.achs[id]) { profile.achs[id] = 1; fresh.push(id); } }
    });
    if (fresh.length) {
      var names = fresh.map(function (id) {
        var a = ACHIEVEMENTS.filter(function (x) { return x.id === id; })[0];
        return a ? a.name : id;
      });

        '<span class="g-seal">' + (n ? E.seal : '？') + '</span>' +
        '<span class="g-name">' + (n ? E.name : '未解锁') + '</span>' +
        '<span style="font-size:11.5px">' + (n ? '达成 ' + n + ' 次' : E.tier) + '</span>' +
        '</div>';
    }).join('');
    $('ach-list').innerHTML = ACHIEVEMENTS.map(function (a) {
      var on = !!profile.achs[a.id];
      return '<div class="ach' + (on ? ' on' : '') + '"><span class="dot"></span>' +
        '<span><b style="font-weight:400">' + a.name + '</b> <span class="d">' + a.desc + '</span></span>' +
        '</div>';
    }).join('');
    var total = ACHIEVEMENTS.length;
    var got = ACHIEVEMENTS.filter(function (a) { return profile.achs[a.id]; }).length;
    $('gal-stat').textContent = '结局 ' + Object.keys(profile.endings).length + '/6 · 成就 ' + got + '/' + total +
      ' · 已修行 ' + profile.runs + ' 世' + (profile.sects.length ? ' · 待过：' + profile.sects.join('、') : '');
  }

  /* --------------------------------------------------------- 分享图 --- */

  function drawShare() {
    var s = GAME.s, e = GAME.ending || {};
    var E = ENDINGS[e.endingId] || { name: '结局', tier: '', seal: '道', color: '#1d1a16' };
    var W = 720, H = 1280;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var F = '"STKaiti","Kaiti SC","KaiTi","Songti SC","SimSun",serif';

    x.fillStyle = '#efe6d5'; x.fillRect(0, 0, W, H);
    var g = x.createRadialGradient(W * 0.2, H * 0.1, 40, W * 0.2, H * 0.1, H * 0.8);
    g.addColorStop(0, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(190,172,142,0.25)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.strokeStyle = 'rgba(29,26,22,0.5)'; x.lineWidth = 3;
    x.strokeRect(34, 34, W - 68, H - 68);
    x.strokeStyle = 'rgba(29,26,22,0.18)'; x.lineWidth = 1;
    x.strokeRect(46, 46, W - 92, H - 92);

    x.textAlign = 'center';
    x.fillStyle = '#1d1a16';
    x.font = '30px ' + F;
    x.fillText('修 仙 模 拟 器', W / 2, 116);
    x.font = '18px ' + F;
    x.fillStyle = '#6d6255';
    x.fillText('一世一轮回 · 结局六种', W / 2, 152);

    x.font = '20px ' + F;
    x.fillStyle = '#453d33';
    x.textAlign = 'left';
    x.fillText('姓名', 76, 226);
    x.fillText('性别', 300, 226);
    x.fillText('岁数', 470, 226);
    x.font = '26px ' + F; x.fillStyle = '#1d1a16';
    x.fillText(s.name, 76, 262);
    x.fillText(s.gender, 300, 262);
    x.fillText(s.age + ' 岁', 470, 262);

    x.font = '20px ' + F; x.fillStyle = '#453d33';
    x.fillText('灵根', 76, 316);
    x.fillText('出身', 300, 316);
    x.font = '22px ' + F; x.fillStyle = '#1d1a16';
    x.fillText(s.root, 76, 350);
    x.fillText(s.origin, 300, 350);

    x.strokeStyle = 'rgba(29,26,22,0.25)'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(70, 386); x.lineTo(W - 70, 386); x.stroke();

    x.textAlign = 'center';
    x.font = '18px ' + F; x.fillStyle = '#6d6255';
    x.fillText('· ' + (E.tier || '') + ' ·', W / 2, 432);
    x.font = '62px ' + F; x.fillStyle = E.color;
    x.fillText(E.name, W / 2, 508);
    x.font = '26px ' + F; x.fillStyle = '#453d33';
    x.fillText(e.title || '', W / 2, 556);

    x.save();
    x.translate(W - 118, 420); x.rotate(0.13);
    x.strokeStyle = '#9c2b23'; x.lineWidth = 4;
    x.strokeRect(-42, -42, 84, 84);
    x.fillStyle = '#9c2b23'; x.font = '46px ' + F;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(E.seal, 0, 4);
    x.restore();
    x.textBaseline = 'alphabetic';

    var rows = [
      ['境界', REALM_NAMES[s.realm]],
      ['道心 / 魔念', s.mind + ' / ' + s.mo],
      ['气运 / 声望', s.luck + ' / ' + s.fame],
      ['灵石 / 宗门', s.wealth + ' / ' + (s.sect || '无')],
      ['道侣', s.partner || '无']
    ];
    var y = 626;
    x.font = '21px ' + F;
    rows.forEach(function (r) {
      x.textAlign = 'left'; x.fillStyle = '#6d6255'; x.fillText(r[0], 84, y);
      x.textAlign = 'right'; x.fillStyle = '#1d1a16'; x.fillText(String(r[1]), W - 84, y);
      x.strokeStyle = 'rgba(29,26,22,0.1)';
      x.beginPath(); x.moveTo(84, y + 14); x.lineTo(W - 84, y + 14); x.stroke();
      y += 52;
    });

    x.textAlign = 'center'; x.fillStyle = '#6d6255'; x.font = '20px ' + F;
    x.fillText('— 生 平 摘 要 —', W / 2, y + 30);
    y += 62;
    x.textAlign = 'left'; x.font = '19px ' + F;
    var lines = GAME.chronicle.filter(function (c) { return c.log; }).slice(-9);
    if (!lines.length) lines = GAME.chronicle.slice(-9);
    lines.forEach(function (c) {
      if (y > H - 116) return;
      x.fillStyle = '#8a7f6e';
      x.fillText(c.age + '岁', 84, y);
      x.fillStyle = '#1d1a16';
      var t = (c.log || (c.event + '：' + c.choice));
      if (t.length > 20) t = t.slice(0, 19) + '…';
      x.fillText(t, 148, y);
      y += 38;
    });

    x.textAlign = 'center'; x.fillStyle = '#6d6255'; x.font = '18px ' + F;
    x.fillText('修仙模拟器 · 网页文字小游戏', W / 2, H - 66);

    return c.toDataURL('image/png');
  }

  function bindShare() {
    $('btn-share-make').onclick = function () {
      var url = drawShare();
      $('share-img').src = url;
      $('share-result').style.display = 'block';
      $('btn-share-make').textContent = '重新生成';
      var a = $('btn-download');
      a.href = url;
      a.download = '修仙模拟器_' + GAME.s.name + '.png';
    };
  }

  /* ------------------------------------------------------------ 启动 --- */

  document.addEventListener('DOMContentLoaded', function () {
    boot();
    bindRoll();
    bindGame();
    bindEnding();
    bindShare();
    show('screen-title');
  });
})();

</script>
</body>
</html>
